# git-cliff configuration for the Emu198x suite changelog.
#
# The suite releases as one version, so the changelog is one document generated
# from the whole repository's history — not aggregated from per-package
# changelogs. That is the difference from release-plz, which only ever considers
# crates it is configured to release and so never saw 181 of the 209 crates.

[changelog]
header = """
# Changelog

All notable changes to Emu198x will be documented in this file.

Format loosely based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
not strictly. Versions follow [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking** — {% endif %}\
{% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.breaking and commit.breaking_description and commit.breaking_description != commit.message %}\
. {{ commit.breaking_description | trim | split(pat="\n") | join(sep=" ") }}\
{% endif %}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
# Anything that is not a conventional commit is not a release note. This is what
# keeps merge commits and stray prose out without listing them individually.
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"

# Only behaviour a user could notice reaches the changelog. docs, tests, chores,
# CI and refactors are deliberately dropped: they are the majority of commits
# here and would bury the twenty that matter.
commit_parsers = [
  # Scope-first, because these rules are evaluated in order and the type rules
  # below would claim these commits before the type-based skip further down
  # ever saw them: `^feat` matches `feat(ci):` perfectly well, which is how
  # "Prototype cutting releases without release-plz" reached a user-facing
  # changelog. The plumbing that ships a release is not a change *in* the
  # release.
  #
  # The list is the scopes this has actually happened with, not a speculative
  # set: `ci`, `release`, and now `test`. `test` was added when `fix(test):
  # hex-format digests without relying on LowerHex` — a change to test helpers
  # so the suite compiles against sha2 0.11 — turned up in a release PR's notes
  # under "Fixed", where a reader would take it for a fix to the emulator.
  #
  # That is the rule working rather than failing: the previous revision said
  # add a scope when it first appears, and this is that. `build`, `deps` and
  # `docs` still have not, so they are still absent.
  #
  # `protect_breaking_commits` still wins over this, so a `feat(ci)!:` would
  # appear anyway. That is right: if CI plumbing breaks someone's build, that
  # is a change in the release.
  { message = '^(feat|fix|perf|revert)\((ci|release|test)\)', skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverted" },
  { message = "^(docs|test|chore|ci|build|refactor|style)", skip = true },
  { message = "^Merge", skip = true },
]

# How a version is computed from the commits, which is policy rather than
# tooling: whatever cuts the release, this is the rule it should follow.
#
# git-cliff's default is `breaking_always_bump_major = true`. On this history
# that turns the single `fix!:` after v0.2.3 — widening `IoEvent::port` — into
# **1.0.0**. Measured, not assumed: `git-cliff --bumped-version` returned
# exactly that before this section existed.
#
# A 1.0 is a statement about the project, not a fact about one commit. Pre-1.0
# the breaking marker moves the minor instead, which is what 0.x semver means
# by a breaking release, and is how v0.3.0 was arrived at.
#
# Declaring 1.0 is therefore a deliberate act: set the workspace version by
# hand once, and these rules resume from there.
[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
