# git-cliff configuration for the Emu198x suite changelog.
#
# The suite releases as one version, so the changelog is one document generated
# from the whole repository's history — not aggregated from per-package
# changelogs. That is the difference from release-plz, which only ever considers
# crates it is configured to release and so never saw 181 of the 209 crates.

[changelog]
header = """
# Changelog

All notable changes to Emu198x will be documented in this file.

Format loosely based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
not strictly. Versions follow [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking** — {% endif %}\
{% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.breaking and commit.breaking_description %}\
. {{ commit.breaking_description | trim | split(pat="\n") | join(sep=" ") }}\
{% endif %}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
# Anything that is not a conventional commit is not a release note. This is what
# keeps merge commits and stray prose out without listing them individually.
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"

# Only behaviour a user could notice reaches the changelog. docs, tests, chores,
# CI and refactors are deliberately dropped: they are the majority of commits
# here and would bury the twenty that matter.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverted" },
  { message = "^(docs|test|chore|ci|build|refactor|style)", skip = true },
  { message = "^Merge", skip = true },
]
