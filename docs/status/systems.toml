# The system registry: one entry per machine, and the only place the repo's
# four vocabularies are joined.
#
# The same machine is named four different ways — the shipping crate
# (`emu198x-sinclair-zx81`), the profile's `machine_id` (`sinclair-zx81`), the
# issue label (`system:zx81`) and the milestone (`ZX81 100%`) — and they agree
# only by luck. The oldest systems predate the convention entirely:
# `emu198x-c64` is `commodore-c64`, `emu198x-spectrum` is
# `sinclair-zx-spectrum`. Nothing could be cross-referenced mechanically, which
# is why status drifted between README, issue bodies, catalogue metadata and
# private notes: reconciling them was manual, so it stopped happening (#825).
#
# Stated, not derived. Three separate attempts to infer these joins by pattern
# matching produced wrong answers — false gaps for `atom`/`dragon`/`oric`,
# a silently missing Game Gear, and profile ids captured as machines. A guess
# that is usually right is exactly what this file exists to replace.
#
# `crate` is the shipping binary. It is not one-to-one: the Sega crate hosts
# two machines, which is what #998 is about.
#
# Checked by `scripts/status/check_registry.py` in CI: every machine a profile
# declares must appear here, and every label and milestone named here must
# exist.

[[system]]
machine_id = "acorn-atom"
crate = "emu198x-acorn-atom"
label = "system:atom"
milestone = "Acorn Atom 100%"

