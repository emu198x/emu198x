# Repositories scripts/extract-repo.py can stand up, one entry each.
#
# Layers 1 (CPUs, #1997) and 2 (shared chips, #1998) of
# knowledge/decisions/workspace-shape.md § Amendment. A crate is listed once it
# can move: published, `emu198x-` prefixed and independently versioned. The
# rest of those checklists need a rename-and-publish change here first, the way
# fad8cc4de did it for these six.
#
# `corpus` entries become the repository's nightly workflow. They are the jobs
# for these crates in .github/workflows/nightly-accuracy.yml, which leave it
# when the crates do.

[[repo]]
name = "mos-6502"
crates = ["emu198x-mos-6502"]
summary = "The MOS 6502 CPU, cycle-stepped, with a pin-level bus interface."
consumers = "Used by its Commodore, Atari, Acorn, Nintendo and Oric machines, and by Play198x for `.sid` playback."
# 74.60% line coverage on 2026-10-24, with the corpus tests ignored.
coverage_floor = 73

[[repo.corpus]]
artifact = "harte-6502"
crate = "emu198x-mos-6502"
test = "single_step_tests"
env_var = "EMU198X_6502_TOM_HARTE_DIR"
filter = "run_all"

[[repo.corpus]]
artifact = "dormann-6502"
crate = "emu198x-mos-6502"
test = "dormann_tests"
env_var = "EMU198X_6502_DORMANN_DIR"

# The tarball carries the project's synthetic free KERNAL beside the cases,
# never a commercial ROM; see test-data/commodore/c64/synthetic-kernal/.
[[repo.corpus]]
artifact = "lorenz-6502"
crate = "emu198x-mos-6502"
test = "lorenz_tests"
env_var = "EMU198X_6502_LORENZ_DIR"
filter = "run_lorenz_6502_cpu_suite"
timeout = 120
extra_env = { EMU198X_C64_KERNAL_ROM = "kernal.rom" }

[[repo]]
name = "zilog-z80"
crates = ["emu198x-zilog-z80"]
summary = "The Zilog Z80 CPU as a half-cycle signal-level state machine."
consumers = "Used by its Sinclair, Amstrad, MSX, Sega and other Z80 machines, and by Play198x for `.ay` playback."
# 90.85% line coverage on 2026-10-24, with the corpus tests ignored.
coverage_floor = 90

[[repo.corpus]]
artifact = "harte-z80"
crate = "emu198x-zilog-z80"
test = "single_step_tests"
env_var = "EMU198X_Z80_TOM_HARTE_DIR"
filter = "run_all"

[[repo.corpus]]
artifact = "fuse-z80"
crate = "emu198x-zilog-z80"
test = "z80_fuse"
env_var = "EMU198X_FUSE_Z80_TESTS_DIR"

# --skip checkpoint drops the checkpoint tests, which need
# EMU198X_ZEX_CHECKPOINT and panic without it.
[[repo.corpus]]
artifact = "zex"
crate = "emu198x-zilog-z80"
test = "zex_tests"
env_var = "EMU198X_ZEX_DIR"
extra_args = "--skip checkpoint"
timeout = 120

[[repo]]
name = "sharp-lr35902"
