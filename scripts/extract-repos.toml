# Repositories scripts/extract-repo.py can stand up, one entry each.
#
# Layers 1 (CPUs, #1997) and 2 (chips, buses and peripherals, #1998) of
# knowledge/decisions/workspace-shape.md § Amendment. Since the 2026-10-25
# amendments every chip, bus, board protocol and peripheral gets a repository,
# however many families use it. A crate is listed once it can move:
# publishable, `emu198x-` prefixed and independently versioned. One not listed
# here is either gated (the 68k family moves last), depends on a family's glue
# or a format layout and must be untangled first, or still needs a
# rename-and-publish change like fad8cc4de's.
#
# `corpus` entries become the repository's nightly workflow. They are the jobs
# for these crates in .github/workflows/nightly-accuracy.yml, which leave it
# when the crates do.

[[repo]]
name = "sony-spc700"
crates = ["emu198x-sony-spc700"]
summary = "The Sony SPC700 (S-SMP), the SNES sound CPU, with a pin-level bus interface."
consumers = "Used by the SNES."
# 99.91% line coverage on 2026-10-25, with the SingleStepTests corpus absent.
coverage_floor = 99

[[repo]]
name = "mos-sid-6581"
crates = ["emu198x-mos-sid-6581"]
summary = "The MOS 6581 and 8580 SID sound chips."
consumers = "Used by the Commodore 64 and by Play198x for `.sid` playback."
# 95.73% line coverage on 2026-10-24, with the corpus tests ignored.
coverage_floor = 95
# Carried from this workspace's profile: the filter's lookup tables cost the
# best part of a minute per unoptimised test process, and about a second here.
cargo_extra = """
[profile.dev.package.emu198x-mos-sid-6581]
opt-level = 3
"""

[[repo]]
name = "commodore-paula-8364"
crates = ["emu198x-commodore-paula-8364"]
summary = "Commodore's Paula (8364): Amiga audio, disk and interrupt control."
consumers = "Used by the Amiga machines and by Play198x for tracker music."
# 95.53% line coverage on 2026-10-24, with the corpus tests ignored.
coverage_floor = 95
# The WinUAE and hardware reference observations its tests compile in. The
# corpus is CC0; its README and LICENSE go with them.
data = [
  "test-data/commodore/amiga/paula-audio/LICENSE",
  "test-data/commodore/amiga/paula-audio/README.md",
  "test-data/commodore/amiga/paula-audio/active-target-probe/winuae.csv",
  "test-data/commodore/amiga/paula-audio/amplitude-probe/winuae.csv",
  "test-data/commodore/amiga/paula-audio/cancelled-startup-probe/winuae.csv",
  "test-data/commodore/amiga/paula-audio/handover-probe/winuae.csv",
  "test-data/commodore/amiga/paula-audio/interrupt-probe/reference.csv",
  "test-data/commodore/amiga/paula-audio/live-attachment-probe/winuae.csv",
  "test-data/commodore/amiga/paula-audio/manual-probe/attachments.csv",
  "test-data/commodore/amiga/paula-audio/manual-probe/winuae.csv",
  "test-data/commodore/amiga/paula-audio/modulation-probe/reference.csv",
  "test-data/commodore/amiga/paula-audio/period-probe/reference.csv",
  "test-data/commodore/amiga/paula-audio/startup-length-probe/reference.csv",
]

