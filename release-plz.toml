# release-plz configuration — suite releases.
#
# Public GitHub Releases are versioned as the Emu198x suite: one `vX.Y.Z`
# release contains every current distable emulator binary for all configured
# desktop targets. Individual machine crates can still exist as separate Cargo
# packages internally, but they must not produce separate public GitHub
# Releases.
#
# The release workflow creates the suite `vX.Y.Z` tag after a release PR is
# merged, then release-plz prepares the next suite release PR.

[workspace]
publish = false              # nothing goes to crates.io
git_release_enable = false   # cargo-dist owns the GitHub Release
git_tag_enable = false       # the release workflow owns the suite tag
git_tag_name = "v{{ version }}"
# Every crate, not just the shipping binaries. Nothing here goes to crates.io,
# so version determination has to come from git tags for *all* of them —
# otherwise release-plz skips the library crates entirely and never gathers
# their commits, which is why `changelog_include` was aggregating nothing and
# 85 of the 86 commits since v0.2.1 could not reach the changelog. Per-package
# tags and releases stay off above, so this changes what is *processed*, not
# what is published or tagged.
git_only = true
changelog_update = false     # the Spectrum package aggregates the suite changelog
release_commits = '^(feat|fix)(\([^)]*\))?!?:'

