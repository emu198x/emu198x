# release-plz configuration — INDEPENDENT per-machine versioning.
#
# Each machine binary is versioned, tagged, and released on its own cadence
# (a Z80 fix bumps only the Z80-using machines, not the 6502 ones). Library
# crates (chips, CPUs, runtimes) are versioned for the dependency graph but
# never tagged or released — they ship inside the machine binaries.
#
# A merged release PR creates per-machine tags `emu198x-<machine>-vX.Y.Z`,
# each firing cargo-dist (release.yml) to build that machine's binary.
# See the umbrella project-skeleton-standard decision (Emu independent versioning).

[workspace]
publish = false              # nothing goes to crates.io
git_release_enable = false   # cargo-dist owns the GitHub Release
git_tag_enable = false       # default: libraries are not tagged/released
git_only = true              # baseline from git tags, not the registry
changelog_update = true

[[package]]
name = "emu198x-acorn-atom"
git_tag_enable = true
git_tag_name = "{{ package }}-v{{ version }}"

