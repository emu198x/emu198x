# release-plz configuration.
#
# Trigger: every push to main runs release-plz, which opens (or
# updates) a "chore: release" PR with a bumped workspace version and
# a CHANGELOG entry generated from the new commits. Merging the PR
# creates a git tag, which fires .github/workflows/release.yml
# (cargo-dist) to build the six native shells and attach the archives
# to a GitHub Release.
#
# Versioning is lockstep: every workspace crate inherits version
# from [workspace.package] in Cargo.toml, so a single bump applies
# everywhere.
[workspace]
publish = false
git_release_enable = false
git_tag_enable = true
changelog_update = true

# git_only = true: take the previous version from the git tag, not the
# crates.io registry. Required whenever publish = false — with no registry
# baseline, release-plz can't see the last release and never bumps the version
# (it reports "already up-to-date" and opens no release PR). See the umbrella
# project-skeleton-standard decision for the full story.
git_only = true
