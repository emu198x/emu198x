[package]
name = "emu198x-jupiter-ace"
description = "Jupiter Ace headless runner with shell-backed script + MCP parity — Z80A + 8 KB Forth ROM"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "emu198x-jupiter-ace"
path = "src/main.rs"

[features]
# UI mode is on by default for interactive / dev builds. The headless
# screenshot / script pipeline builds with `--no-default-features` to skip the
# shared `emu198x-ui` harness (winit + wgpu) — `--script` and `--mcp` still
# work; the default UI path errors out with a "rebuild with --features ui"
# message.
default = ["ui"]
ui = ["dep:emu198x-ui"]

[dependencies]
emu198x-shell = { path = "../emu198x-shell", version = "0.8.0" }
emu198x-ui = { path = "../emu198x-ui", version = "0.8.0", optional = true }
machine-jupiter-ace = { path = "../machine-jupiter-ace", version = "0.8.0" }
png = { workspace = true }
runtime-jupiter-ace = { path = "../runtime-jupiter-ace", version = "0.8.0" }
serde_json = { workspace = true }

[lints]
workspace = true

# `publish = false` (added in 63fac19e) keeps this off crates.io but also
# hides it from cargo-dist, which owns the GitHub Release. `dist = true`
# restores it without publishing.
[package.metadata.dist]
dist = true
