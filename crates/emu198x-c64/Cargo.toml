[package]
name = "emu198x-c64"
description = "Native Commodore 64 verifier with interactive UI, headless script, and MCP modes"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# UI mode is on by default for interactive / dev builds. Code198x's
# headless screenshot/video pipeline builds with `--no-default-features`
# to skip the shared `emu198x-ui` harness (winit + wgpu + muda) — the
# `--script` and `--mcp` modes still work, only the default UI path
# errors out at runtime with a "rebuild with --features ui" message.
default = ["ui"]
ui = ["dep:emu198x-ui"]

[dependencies]
common-commodore-c64 = { path = "../common-commodore-c64", version = "0.11.0" }
emu198x-shell = { path = "../emu198x-shell", version = "0.11.0" }
mos-vic-ii = { path = "../mos-vic-ii", version = "0.11.0" }
emu198x-ui = { path = "../emu198x-ui", version = "0.11.0", optional = true }
runtime-commodore-c64 = { path = "../runtime-commodore-c64", version = "0.11.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true

[lints]
workspace = true

# `publish = false` (added in 63fac19e) keeps this off crates.io but also
# hides it from cargo-dist, which owns the GitHub Release. `dist = true`
# restores it without publishing.
[package.metadata.dist]
dist = true
