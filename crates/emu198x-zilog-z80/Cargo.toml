[package]
name = "emu198x-zilog-z80"
description = "Z80 CPU — half-cycle signal-level state machine"
edition.workspace = true
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Starts at
# the version it already carried in-tree.
version = "0.6.0"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["z80", "cpu", "emulator", "zx-spectrum", "msx"]
categories = ["emulators"]

[dependencies]
serde = { workspace = true }

[dev-dependencies]
# Path-only on purpose. A dev-dependency carrying a version must resolve
# on the registry at publish time; without one cargo strips it from the
# published manifest, which is what lets this crate ship while its test
# helper stays unpublished.
emu198x-test-skip = { path = "../emu198x-test-skip" }
postcard = { workspace = true }
serde_json = "1"
# Isa198x disassembler, used only by the isa_conformance cross-check test
# (rung-1 phase 2, see 198x/decisions/rung1-wiring.md).
isa-disasm = { package = "isa198x-disasm", version = "0.1" }

[lints]
workspace = true
