[package]
name = "emu198x-spectrum-web"
description = "ZX Spectrum in the browser, published to npm as @emu198x/zx-spectrum"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Embeds the 48K ROM in the artifact, for the published npm package only.
# Off by default so this repository, and every clone and fork of it, builds
# and ships without firmware. `scripts/build-npm.sh` turns it on and supplies
# the image from EMU198X_SPECTRUM_48K_ROM.
#
# See knowledge/decisions/test-rom-policy.md
# § Firmware in a published browser build.
bundled-rom = []

[dependencies]
emu198x-shell = { path = "../emu198x-shell", version = "0.20.1" }
format-sinclair-zx-spectrum-sna = { path = "../format-sinclair-zx-spectrum-sna", version = "0.20.1" }
format-sinclair-zx-spectrum-z80 = { path = "../format-sinclair-zx-spectrum-z80", version = "0.20.1" }
format-sinclair-zx-spectrum-snapshot = { path = "../format-sinclair-zx-spectrum-snapshot", version = "0.20.1" }
emu198x-web = { path = "../emu198x-web", version = "0.20.1" }
runtime-sinclair-zx-spectrum = { path = "../runtime-sinclair-zx-spectrum", version = "0.20.1" }

# The browser boundary. wasm-bindgen was named in the approved plan; js-sys,
# web-sys and wasm-bindgen-futures are how it reaches the DOM and awaits the
# wgpu adapter, and travel with it rather than being separate choices.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "Window",
    "Document",
] }

[lints]
workspace = true
