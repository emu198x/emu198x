[package]
name = "emu198x-atari-2600"
description = "Atari 2600 (VCS) headless runner with shell-backed script + MCP parity — 6507 + TIA + RIOT"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "emu198x-atari-2600"
path = "src/main.rs"

[features]
# UI mode (default). Headless `--script`/`--mcp` builds can use
# `--no-default-features` to skip the winit + wgpu graphics stack.
default = ["ui"]
ui = ["dep:emu198x-ui"]

[dependencies]
emu198x-shell = { path = "../emu198x-shell", version = "0.18.0" }
atari-tia = { path = "../atari-tia", version = "0.18.0" }
emu198x-ui = { path = "../emu198x-ui", version = "0.18.0", optional = true }
machine-atari-2600 = { path = "../machine-atari-2600", version = "0.18.0" }
png = { workspace = true }
runtime-atari-2600 = { path = "../runtime-atari-2600", version = "0.18.0" }
serde_json = { workspace = true }

[lints]
workspace = true

# `publish = false` (added in 63fac19e) keeps this off crates.io but also
# hides it from cargo-dist, which owns the GitHub Release. `dist = true`
# restores it without publishing.
[package.metadata.dist]
dist = true
