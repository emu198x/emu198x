[package]
name = "emu198x-nes"
description = "Native NES verifier with interactive UI, headless script, and MCP modes"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# UI mode is on by default for interactive / dev builds. The headless
# screenshot / smoke / Blargg pipeline builds with
# `--no-default-features` to skip the heavy graphics stack (winit +
# wgpu) — the `--script` and `--mcp` modes still work, only the default
# UI path errors out at runtime with a "rebuild with --features ui"
# message.
default = ["ui"]
ui = ["dep:emu198x-native-video", "dep:winit"]

[dependencies]
emu198x-native-video = { path = "../emu198x-native-video", optional = true }
emu198x-shell = { path = "../emu198x-shell" }
machine-nintendo-nes = { path = "../machine-nintendo-nes" }
runtime-nintendo-nes = { path = "../runtime-nintendo-nes" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
winit = { workspace = true, optional = true }

[lints]
workspace = true
