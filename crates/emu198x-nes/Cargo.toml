[package]
name = "emu198x-nes"
description = "Native NES verifier with interactive UI, headless script, and MCP modes"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[features]
# UI mode is on by default for interactive / dev builds. The headless
# screenshot / smoke / Blargg pipeline builds with `--no-default-features`
# to skip the shared `emu198x-ui` harness (winit + wgpu) — the `--script`
# and `--mcp` modes still work, only the default UI path errors out at
# runtime with a "rebuild with --features ui" message.
default = ["ui"]
ui = ["dep:emu198x-ui"]

[dependencies]
emu198x-shell = { path = "../emu198x-shell", version = "0.16.0" }
ricoh-ppu-2c02 = { path = "../ricoh-ppu-2c02", version = "0.16.0" }
emu198x-ui = { path = "../emu198x-ui", version = "0.16.0", optional = true }
machine-nintendo-nes = { path = "../machine-nintendo-nes", version = "0.16.0" }
runtime-nintendo-nes = { path = "../runtime-nintendo-nes", version = "0.16.0" }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

# `publish = false` (added in 63fac19e) keeps this off crates.io but also
# hides it from cargo-dist, which owns the GitHub Release. `dist = true`
# restores it without publishing.
[package.metadata.dist]
dist = true
