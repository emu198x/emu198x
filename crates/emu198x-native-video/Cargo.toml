[package]
name = "emu198x-native-video"
description = "Shared native GPU video presentation for Emu198x frontends"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck.workspace = true
emu198x-shell = { path = "../emu198x-shell", version = "0.31.0" }
pollster.workspace = true
thiserror.workspace = true
wgpu.workspace = true
winit.workspace = true

[lints]
workspace = true

# wgpu targets WebGPU only by default on wasm; the `webgl` feature adds the
# GL backend so the presenter still runs where WebGPU is unavailable. No
# web-sys here on purpose: the crate is generic over the surface target, so
# the caller supplies the canvas and this crate never names a DOM type.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["web", "webgl"] }


# Reads a real browser canvas back, because a presenter that compiles for wasm
# and returns Ok is not one that draws (#1436). Same versions the browser
# crates already carry.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2.127"
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "ImageData",
    "Node",
    "Window",
] }

[dev-dependencies]
runtime-sinclair-zx-spectrum = { path = "../runtime-sinclair-zx-spectrum" }
runtime-commodore-c64 = { path = "../runtime-commodore-c64" }
runtime-nintendo-nes = { path = "../runtime-nintendo-nes" }
runtime-commodore-amiga = { path = "../runtime-commodore-amiga" }

[[example]]
name = "validate-signal"
path = "../../tools/spectrum-composite/src/validate_live.rs"

[[example]]
name = "validate-interlace"
path = "../../tools/spectrum-composite/src/validate_interlace.rs"

[[example]]
name = "validate-phosphor"
path = "../../tools/spectrum-composite/src/validate_phosphor.rs"
