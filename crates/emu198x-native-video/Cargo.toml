[package]
name = "emu198x-native-video"
description = "Shared native GPU video presentation for Emu198x frontends"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck.workspace = true
emu198x-shell = { path = "../emu198x-shell", version = "0.20.0" }
pollster.workspace = true
thiserror.workspace = true
wgpu.workspace = true
winit.workspace = true

[lints]
workspace = true

# wgpu targets WebGPU only by default on wasm; the `webgl` feature adds the
# GL backend so the presenter still runs where WebGPU is unavailable. No
# web-sys here on purpose: the crate is generic over the surface target, so
# the caller supplies the canvas and this crate never names a DOM type.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }

