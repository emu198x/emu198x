[package]
name = "emu198x-commodore-agnus-ecs"
description = "Commodore Super Agnus (ECS) — thin wrapper over emu198x-commodore-agnus-ocs that adds the BEAMCON0 register, programmable sync generator, and ECS-specific timing extensions. Used by ECS machines (A500+, A600, A3000)."
edition.workspace = true
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["agnus", "amiga", "ecs", "emulator"]
categories = ["emulators"]

[dependencies]
emu198x-commodore-agnus-ocs = { path = "../emu198x-commodore-agnus-ocs", version = "0.1.0" }
serde = { workspace = true }

[lints]
workspace = true
