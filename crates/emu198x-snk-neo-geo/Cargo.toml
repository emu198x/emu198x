[package]
homepage.workspace = true
name = "emu198x-snk-neo-geo"
description = "SNK Neo Geo AES headless runner with shell-backed script + MCP parity — 68000 + Z80 + LSPC2 + YM2610"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "emu198x-snk-neo-geo"
path = "src/main.rs"

[features]
# UI mode is on by default for interactive / dev builds. The headless
# screenshot / script pipeline builds with `--no-default-features` to skip the
# shared `emu198x-ui` harness (winit + wgpu) — `--script` and `--mcp` still
# work; the default UI path errors out with a "rebuild with --features ui"
# message.
default = ["ui"]
ui = ["dep:emu198x-ui"]

[dependencies]
emu198x-shell = { workspace = true }
emu198x-ui = { path = "../emu198x-ui", version = "0.45.0", optional = true }
format-snk-neo-geo-romset = { path = "../format-snk-neo-geo-romset", version = "0.45.0" }
machine-snk-neo-geo = { path = "../machine-snk-neo-geo", version = "0.45.0" }
runtime-snk-neo-geo = { path = "../runtime-snk-neo-geo", version = "0.45.0" }
serde_json = { workspace = true }
zip = { workspace = true }

# Embeds the application icon in the Windows .exe (no-op elsewhere).
[build-dependencies]
emu198x-app-icon = { path = "../emu198x-app-icon", version = "0.45.0" }

[lints]
workspace = true

# `publish = false` keeps this off crates.io but also hides it from
# cargo-dist, which owns the GitHub Release. `dist = true` restores it
# without publishing.
[package.metadata.dist]
dist = true
