[package]
name = "emu198x-sony-spc700"
description = "Sony SPC700 (S-SMP) CPU with a cycle-accurate pin-level bus interface"
edition.workspace = true
# Independently versioned, like the other published CPU crates: the version
# communicates this crate's changes, not the Emu198x suite's releases.
version = "0.1.0"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["spc700", "snes", "cpu", "emulator"]
categories = ["emulators"]

[dependencies]
serde = { workspace = true }

[dev-dependencies]
# Use the workspace copy here, and keep the published helper available to
# the corpus test when Cargo packages this crate without its sibling.
emu198x-test-skip = { path = "../emu198x-test-skip", version = "0.1.0" }
serde_json = { workspace = true }

[lints]
workspace = true
