[package]
name = "emu198x-shell"
description = "Cross-system shared control surface, machine registry types, and host I/O contracts"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[dependencies]
cpal = { workspace = true }
gilrs = { workspace = true }
# Shared 6502/6809 disassembler from Asm198x (the isa spec crate). Pinned to a
# reproducible rev — isa-disasm is untagged. Re-exported below so the
# `impl_6502_debug_target!` macro can reach it via `$crate::isa_disasm` without
# every 6502 runtime taking the dependency. See 198x/decisions/rung1-wiring.md.
isa-disasm = { git = "https://github.com/asm198x/asm198x", rev = "30a0e5238ee2935521c480de018ee60e645624ed" }
png = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
emu198x-test-skip = { path = "../emu198x-test-skip", version = "0.2.0" }

[lints]
workspace = true
