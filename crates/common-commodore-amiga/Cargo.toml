[package]
name = "common-commodore-amiga"
description = "Shared board-level substrate for Commodore Amiga machine crates — CIA pair, copper, RTC, memory map, Denise-side shared rendering. Per-chipset wrappers (machine-commodore-amiga-ocs / -ecs / -aga) plug their specific Agnus + Denise chips into this substrate."
edition.workspace = true
version = "0.2.0"
license.workspace = true
repository.workspace = true

[dependencies]
mos-cia-8520 = { path = "../mos-cia-8520" }
commodore-paula-8364 = { path = "../commodore-paula-8364" }
commodore-denise-ocs = { path = "../commodore-denise-ocs" }
commodore-denise-ecs = { path = "../commodore-denise-ecs" }
commodore-agnus-ocs = { path = "../commodore-agnus-ocs" }
serde = { workspace = true }

[lints]
workspace = true
