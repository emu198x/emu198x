[package]
name = "emu198x-commodore-gary"
description = "Commodore Gary — Amiga central address decoder. Maps 24-bit addresses to chip selects for custom registers, CIAs, ROM, and RAM regions."
edition.workspace = true
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gary", "amiga", "address-decoder", "emulator"]
categories = ["emulators"]

[dependencies]
serde = { workspace = true }

[lints]
workspace = true
