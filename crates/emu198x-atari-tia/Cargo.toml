[package]
name = "emu198x-atari-tia"
description = "Atari TIA (Television Interface Adaptor) — Atari 2600, 7800"
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["tia", "atari", "2600", "video", "emulator"]
categories = ["emulators"]

[dependencies]
serde = { workspace = true }
serde-big-array = { workspace = true }

[dev-dependencies]
# Test-only: read/write the TIA frame-oracle golden PNGs (tests/tia_oracle.rs).
# The shipped library stays dependency-free.
png = { workspace = true }

[lints]
workspace = true
