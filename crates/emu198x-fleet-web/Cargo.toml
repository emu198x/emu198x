runtime-sega-master-system = { path = "../runtime-sega-master-system", version = "0.25.0", optional = true }
runtime-sega-sg-1000 = { path = "../runtime-sega-sg-1000", version = "0.25.0", optional = true }
runtime-sinclair-zx-spectrum = { path = "../runtime-sinclair-zx-spectrum", version = "0.25.0", optional = true }
runtime-sinclair-zx80 = { path = "../runtime-sinclair-zx80", version = "0.25.0", optional = true }
