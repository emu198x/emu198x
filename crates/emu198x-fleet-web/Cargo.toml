runtime-sord-m5 = { path = "../runtime-sord-m5", version = "0.25.0", optional = true }
runtime-spectravideo-svi-328 = { path = "../runtime-spectravideo-svi-328", version = "0.25.0", optional = true }
runtime-tatung-einstein = { path = "../runtime-tatung-einstein", version = "0.25.0", optional = true }
[target.'cfg(target_arch = "wasm32")'.dependencies]
