runtime-memotech-mtx = { path = "../runtime-memotech-mtx", version = "0.25.0", optional = true }
runtime-msx = { path = "../runtime-msx", version = "0.25.0", optional = true }
runtime-nintendo-game-boy = { path = "../runtime-nintendo-game-boy", version = "0.25.0", optional = true }
runtime-nintendo-nes = { path = "../runtime-nintendo-nes", version = "0.25.0", optional = true }
