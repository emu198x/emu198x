[package]
name = "emu198x-gi-ay-3-8912"
description = "General Instrument AY-3-8912 PSG — single-I/O-port facade over the AY-3-8910 core"
edition.workspace = true
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ay-3-8912", "psg", "sound", "emulator"]
categories = ["emulators"]

[dependencies]
emu198x-gi-ay-3-8910 = { path = "../emu198x-gi-ay-3-8910", version = "0.6.0" }
serde = { workspace = true }

[lints]
workspace = true
