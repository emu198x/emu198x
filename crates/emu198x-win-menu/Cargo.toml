[package]
name = "emu198x-win-menu"
description = "Attaches the shared native menu bar to a window on Windows"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

# Empty on every other platform, so the crate builds anywhere and costs
# nothing outside Windows.
[target.'cfg(target_os = "windows")'.dependencies]
muda = { workspace = true }
winit = { workspace = true }

# The workspace forbids unsafe code, and `forbid` cannot be relaxed by an
# `allow`, so this crate carries its own copy of the workspace lints with
# `unsafe_code` lowered to `deny`. `src/lib.rs` allows it for the `attach`
# module alone. tests/lint_exception.rs fails if this table drifts from the
# workspace's. See knowledge/decisions/windows-menu-unsafe-exception.md.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
