[package]
name = "emu198x-mos-cia-8520"
description = "MOS 8520 Complex Interface Adapter — Amiga variant of the 6526 CIA. Binary 24-bit TOD (not BCD), two 16-bit timers, 8-bit I/O ports, serial shift register, interrupt controller."
edition.workspace = true
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["8520", "cia", "amiga", "emulator"]
categories = ["emulators"]

[dependencies]
serde = { workspace = true }

[lints]
workspace = true
