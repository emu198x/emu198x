[package]
name = "emu198x-dragon"
description = "Native Dragon 32/64 verifier with interactive UI, headless harness, and MCP modes"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[features]
# UI mode is on by default for interactive / dev builds. The headless
# smoke / trace / XRoar pipeline builds with `--no-default-features` to
# skip the shared `emu198x-ui` harness (winit + wgpu + muda) — the
# headless harness and `--mcp` modes still work, only the default UI path
# errors out at runtime with a "rebuild with --features ui" message.
default = ["ui"]
ui = ["dep:emu198x-ui"]

[dependencies]
emu198x-shell = { path = "../emu198x-shell", version = "0.2.0" }
emu198x-ui = { path = "../emu198x-ui", version = "0.2.0", optional = true }
format-dragon-bin = { path = "../format-dragon-bin", version = "0.2.0" }
format-dragon-cas = { path = "../format-dragon-cas", version = "0.2.0" }
format-dragon-disk = { path = "../format-dragon-disk", version = "0.2.0" }
format-dragon-pak = { path = "../format-dragon-pak", version = "0.2.0" }
machine-dragon-32 = { path = "../machine-dragon-32", version = "0.2.0" }
motorola-vdg-6847 = { path = "../motorola-vdg-6847", version = "0.2.0" }
png = { workspace = true }
runtime-dragon = { path = "../runtime-dragon", version = "0.2.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
zip = { workspace = true }

[dev-dependencies]
emu198x-test-skip = { path = "../emu198x-test-skip", version = "0.2.0" }

[lints]
workspace = true
