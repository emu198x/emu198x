[package]
name = "emu198x-dragon"
description = "Native Dragon 32/64 verifier with interactive UI, headless harness, and MCP modes"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# UI mode is on by default for interactive / dev builds. The headless
# smoke / trace / XRoar pipeline builds with `--no-default-features` to
# skip the heavy graphics stack (winit + wgpu) — the headless harness and
# `--mcp` modes still work, only the default UI path errors out at
# runtime with a "rebuild with --features ui" message.
default = ["ui"]
ui = ["dep:emu198x-native-video", "dep:winit"]

[dependencies]
emu198x-native-video = { path = "../emu198x-native-video", optional = true }
emu198x-shell = { path = "../emu198x-shell" }
format-dragon-bin = { path = "../format-dragon-bin" }
format-dragon-cas = { path = "../format-dragon-cas" }
format-dragon-disk = { path = "../format-dragon-disk" }
format-dragon-pak = { path = "../format-dragon-pak" }
machine-dragon-32 = { path = "../machine-dragon-32" }
motorola-vdg-6847 = { path = "../motorola-vdg-6847" }
png = { workspace = true }
runtime-dragon = { path = "../runtime-dragon" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
winit = { workspace = true, optional = true }
zip = { workspace = true }

[lints]
workspace = true
