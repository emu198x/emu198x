[package]
name = "commodore-denise-aga"
description = "Commodore Lisa (AGA Denise) — thin wrapper over commodore-denise-ecs that adds the 24-bit / 256-entry palette, HAM8, BPLCON4 (bitplane XOR + sprite bank), and FMODE-driven wide sprite handling. Used by AGA machines (A1200, A4000, CD32)."
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[dependencies]
commodore-denise-ecs = { path = "../commodore-denise-ecs", version = "0.21.0" }
commodore-denise-ocs = { path = "../commodore-denise-ocs", version = "0.21.0" }
common-commodore-amiga = { path = "../common-commodore-amiga", version = "0.21.0" }
serde = { workspace = true }

