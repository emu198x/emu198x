[package]
name = "emu198x-atari-antic"
description = "Atari ANTIC display list processor — Atari 5200, 800XL, 130XE"
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["antic", "atari", "display-list", "emulator"]
categories = ["emulators"]

[dependencies]
emu198x-atari-gtia = { path = "../emu198x-atari-gtia", version = "0.1.0" }
serde = { workspace = true }
serde-big-array = { workspace = true }

[lints]
workspace = true
