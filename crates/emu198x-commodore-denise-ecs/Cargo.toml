[package]
name = "emu198x-commodore-denise-ecs"
description = "Commodore Super Denise (ECS) — thin wrapper over commodore-denise-ocs that adds the BPLCON3 register and ECS display-mode extensions. Used by ECS machines (A500+, A600, A3000) and consumed by commodore-denise-aga via Lisa."
edition.workspace = true
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["denise", "amiga", "ecs", "emulator"]
categories = ["emulators"]

[dependencies]
emu198x-commodore-denise-ocs = { path = "../emu198x-commodore-denise-ocs", version = "0.1.0" }
serde = { workspace = true }

[lints]
workspace = true
