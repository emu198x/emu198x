[package]
name = "emu198x-mos-sid-6581"
description = "MOS 6581 / 8580 SID (Sound Interface Device) with three voices, ADSR envelopes, multi-mode filter, and downsampled audio output"
edition.workspace = true
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Starts at
# the version it already carried in-tree.
version = "0.7.0"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["c64", "sid", "6581", "audio-chip", "emulator"]
categories = ["emulators", "multimedia::audio"]

[dependencies]
serde = { workspace = true }

[dev-dependencies]
allocation-counter = "0.8.1"

[lints]
workspace = true
