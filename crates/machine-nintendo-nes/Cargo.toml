[package]
name = "machine-nintendo-nes"
description = "NES machine wiring — master-clock-driven tick loop, PPU every dot, CPU every 3rd dot. Ties the 2A03 CPU, 2C02 PPU, and cartridge mapper together with internal RAM, OAMDMA, and controller I/O."
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[dependencies]
format-nintendo-nes-ines = { path = "../format-nintendo-nes-ines", version = "0.6.0" }
mos-6502 = { path = "../mos-6502", version = "0.6.0" }
ricoh-apu-2a03 = { path = "../ricoh-apu-2a03", version = "0.6.0" }
ricoh-ppu-2c02 = { path = "../ricoh-ppu-2c02", version = "0.6.0" }
serde = { workspace = true }
serde-big-array = { workspace = true }

[dev-dependencies]
emu198x-test-skip = { path = "../emu198x-test-skip", version = "0.6.0" }

[lints]
workspace = true
