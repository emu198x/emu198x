[package]
name = "machine-nintendo-nes"
description = "NES machine wiring — master-clock-driven tick loop, PPU every dot, CPU every 3rd dot. Ties the 2A03 CPU, 2C02 PPU, and cartridge mapper together with internal RAM, OAMDMA, and controller I/O."
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[dependencies]
nintendo-nes-cartridge = { path = "../nintendo-nes-cartridge", version = "0.44.0" }
emu198x-mos-6502 = "0.6.1"
emu198x-ricoh-apu-2a03 = { path = "../emu198x-ricoh-apu-2a03", version = "0.6.0" }
emu198x-ricoh-ppu-2c02 = { path = "../emu198x-ricoh-ppu-2c02", version = "0.1.0" }
serde = { workspace = true }
serde-big-array = { workspace = true }

[dev-dependencies]
format-nintendo-famicom-fds = { path = "../format-nintendo-famicom-fds", version = "0.44.0" }
emu198x-test-skip = { path = "../emu198x-test-skip", version = "0.1.0" }

[lints]
workspace = true
