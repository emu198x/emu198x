[package]
name = "emu198x-mos-pia-6520"
description = "MOS 6520 / Motorola 6821 Peripheral Interface Adapter"
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["6520", "6821", "pia", "io", "emulator"]
categories = ["emulators"]

[lib]
name = "emu198x_mos_pia_6520"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }

[lints]
workspace = true
