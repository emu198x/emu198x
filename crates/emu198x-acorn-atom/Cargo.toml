[package]
name = "emu198x-acorn-atom"
description = "Acorn Atom headless runner with shell-backed script + MCP parity — 6502 + 24 KB combined ROM"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "emu198x-acorn-atom"
path = "src/main.rs"

[features]
# UI mode is on by default for interactive / dev builds. The headless
# screenshot / script pipeline builds with `--no-default-features` to skip the
# shared `emu198x-ui` harness (winit + wgpu) — `--script` and `--mcp` still
# work; the default UI path errors out with a "rebuild with --features ui"
# message.
default = ["ui"]
ui = ["dep:emu198x-ui"]

[dependencies]
emu198x-shell = { path = "../emu198x-shell", version = "0.7.0" }
motorola-vdg-6847 = { path = "../motorola-vdg-6847", version = "0.7.0" }
emu198x-ui = { path = "../emu198x-ui", version = "0.7.0", optional = true }
machine-acorn-atom = { path = "../machine-acorn-atom", version = "0.7.0" }
png = { workspace = true }
runtime-acorn-atom = { path = "../runtime-acorn-atom", version = "0.7.0" }
serde_json = { workspace = true }

[lints]
workspace = true

# `publish = false` (added in 63fac19e) keeps this off crates.io but also
# hides it from cargo-dist, which owns the GitHub Release. `dist = true`
# restores it without publishing.
[package.metadata.dist]
dist = true
