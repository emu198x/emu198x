[package]
name = "emu198x-peripheral-kempston-sinclair-zx-spectrum-mouse"
description = "Kempston mouse interface — Spectrum edge-connector peripheral"
edition.workspace = true
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["zx-spectrum", "kempston", "mouse", "peripheral", "emulator"]
categories = ["emulators"]

[dependencies]
emu198x-bus-sinclair-zx-spectrum = { path = "../emu198x-bus-sinclair-zx-spectrum", version = "0.1.0" }
serde = { workspace = true }

[lints]
workspace = true
