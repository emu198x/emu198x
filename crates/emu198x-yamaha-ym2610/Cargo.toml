[package]
name = "emu198x-yamaha-ym2610"
description = "Yamaha YM2610 (OPNB): FM, SSG, ADPCM-A and ADPCM-B, cycle-stepped — SNK Neo Geo"
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ym2610", "opnb", "adpcm", "neo-geo", "emulator"]
categories = ["emulators"]

[dependencies]
emu198x-gi-ay-3-8910 = { path = "../emu198x-gi-ay-3-8910", version = "0.6.0" }
emu198x-yamaha-ym2612 = { path = "../emu198x-yamaha-ym2612", version = "0.1.0" }
serde = { workspace = true }

[dev-dependencies]
postcard = { workspace = true }

[lints]
workspace = true
