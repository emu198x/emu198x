[package]
name = "emu198x-ui"
description = "Shared native UI harness (winit + wgpu video + audio + input) for Emu198x runners"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
emu198x-shell = { path = "../emu198x-shell", version = "0.25.0" }
emu198x-native-video = { path = "../emu198x-native-video", version = "0.25.0" }
winit = { workspace = true }
thiserror.workspace = true
# Decodes the embedded application icon (src/icon.rs).
png = { workspace = true }
# Native file dialogs for the File → Open menu. Builds cross-platform (its Linux
# backend is xdg-desktop-portal, no GTK), so unlike muda it isn't target-gated.
rfd = { workspace = true }

# The native menu (muda) is non-Linux only: its 0.19.x line with
# `default-features = false` drops the GTK backend (which would reopen a
# Dependabot alert and pull libgtk-3-dev). Linux gets the no-op stub menu in
# `menu.rs`; the keyboard shortcuts cover every command regardless.
[target.'cfg(not(target_os = "linux"))'.dependencies]
muda = { workspace = true }

# The Dock icon (src/icon.rs): winit ignores window icons on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = [
    "std",
    "NSApplication",
    "NSCell",
    "NSControl",
    "NSDockTile",
    "NSImage",
    "NSImageView",
    "NSResponder",
    "NSView",
] }
objc2-foundation = { workspace = true, features = ["std", "NSData", "NSGeometry"] }

[lints]
workspace = true
