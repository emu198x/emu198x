[package]
name = "emu198x-apple-ii"
description = "Original Apple II emulator with shared native UI, scripts and MCP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
default = ["ui"]
ui = ["dep:emu198x-ui"]

[dependencies]
emu198x-shell.workspace = true
emu198x-ui = { path = "../emu198x-ui", version = "0.46.2", optional = true }
emu198x-runtime-apple-ii = "0.1.1"
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.dist]
dist = true
