[package]
name = "emu198x-amiga"
description = "Native Amiga verifier with interactive UI, headless script, and MCP debugging modes"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[features]
# UI mode is on by default for interactive / dev builds. The MCP
# debugging surface and the headless capture pipeline build with
# `--no-default-features` to skip the heavy graphics stack (winit +
# wgpu) — `--script` and `--mcp` still work, only the default UI path
# errors out at runtime with a "rebuild with --features ui" message.
default = ["ui"]
ui = ["dep:emu198x-ui"]

[dependencies]
emu198x-ui = { path = "../emu198x-ui", version = "0.10.0", optional = true }
emu198x-shell = { path = "../emu198x-shell", version = "0.10.0" }
machine-commodore-amiga-a1200 = { path = "../machine-commodore-amiga-a1200", version = "0.10.0" }
mos-cia-8520 = { path = "../mos-cia-8520", version = "0.10.0" }
motorola-68000 = { path = "../motorola-68000", version = "0.10.0" }
runtime-commodore-amiga = { path = "../runtime-commodore-amiga", version = "0.10.0" }
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
png = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
emu198x-test-skip = { path = "../emu198x-test-skip", version = "0.10.0" }

[lints]
workspace = true

# `publish = false` (added in 63fac19e) keeps this off crates.io but also
# hides it from cargo-dist, which owns the GitHub Release. `dist = true`
# restores it without publishing.
[package.metadata.dist]
dist = true
