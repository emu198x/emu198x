[package]
name = "emu198x-zilog-z80-ctc"
description = "Zilog Z80 CTC (Z8430) Counter/Timer Circuit — Sord M5, MSX, Memotech MTX, Tatung Einstein"
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["z80", "ctc", "timer", "emulator"]
categories = ["emulators"]

[dependencies]
serde = { workspace = true }

[lints]
workspace = true
