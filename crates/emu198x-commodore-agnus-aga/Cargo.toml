[package]
name = "emu198x-commodore-agnus-aga"
description = "Commodore Alice (AGA Agnus) — thin wrapper over commodore-agnus-ecs that adds the FMODE register (bitplane / sprite DMA fetch widths) and AGA-specific bus arbitration. Used by AGA machines (A1200, A4000, CD32)."
edition.workspace = true
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["alice", "agnus", "amiga", "aga", "emulator"]
categories = ["emulators"]

[dependencies]
emu198x-commodore-agnus-ecs = { path = "../emu198x-commodore-agnus-ecs", version = "0.1.0" }
emu198x-commodore-agnus-ocs = { path = "../emu198x-commodore-agnus-ocs", version = "0.1.0" }
serde = { workspace = true }

[lints]
workspace = true
