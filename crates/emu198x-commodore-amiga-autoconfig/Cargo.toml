[package]
name = "emu198x-commodore-amiga-autoconfig"
description = "Amiga Zorro-II autoconfig board state machine — probe-window register reads, base-address configuration writes, shut-up escape, post-config RAM backing."
edition.workspace = true
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["amiga", "zorro", "autoconfig", "expansion", "emulator"]
categories = ["emulators"]

[dependencies]
serde = { workspace = true }

[dev-dependencies]
postcard = { workspace = true }

[lints]
workspace = true
