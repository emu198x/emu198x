[package]
name = "emu198x-gtk-window"
description = "The GTK4 window process the Linux machine binaries open their window in"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

# Not a release of its own: it ships inside every Linux machine archive, as
# libexec/emu198x-gtk-window, built there by scripts/build-gtk-window.sh
# before dist runs (knowledge/decisions/gtk-window-process.md).
[package.metadata.dist]
dist = false

[[bin]]
name = "emu198x-gtk-window"
path = "src/main.rs"
required-features = ["gtk"]

[dependencies]
emu198x-shell = { workspace = true }
emu198x-ui = { path = "../emu198x-ui", version = "0.45.0" }
emu198x-native-video = { path = "../emu198x-native-video", version = "0.45.0" }
winit = { workspace = true }

# GTK needs the system's libgtk-4-dev to build, so it sits behind a feature
# that only the `GTK host` CI job and Linux builds of the window turn on.
[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { workspace = true, optional = true }

[features]
gtk = ["dep:gtk4"]

[lints]
workspace = true
