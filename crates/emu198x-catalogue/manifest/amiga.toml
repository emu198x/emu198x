# Amiga catalogue. See knowledge/decisions/october-catalogue.md.
#
# Coverage target: 10 entries spanning OCS, ECS and AGA profiles,
# PAL and NTSC timing, Workbench, boot-block trackloaders, Copper /
# blitter-sensitive display cases and Paula audio. The active accuracy
# closure campaign defines this engineering gate; it is not a public
# launch commitment.
#
# Media paths resolve against:
#   EMU198X_CATALOGUE_MEDIA_ROOT     (no default — required)
#   EMU198X_CATALOGUE_FIRMWARE_ROOT  (default: ~/.emu198x/roms)
#
# Lay out the media root so the relative paths below resolve. Workbench
# ADFs and game ADFs both sit under the same root.

[system]
id = "amiga"

[[system.firmware]]
variant = "a500-ocs-pal-a501"
files = [
    { id = "commodore-amiga-kickstart-rom", path = "commodore-amiga/kick13.rom" },
]

[[system.firmware]]
variant = "a500-plus-ecs-pal"
files = [
    { id = "commodore-amiga-kickstart-rom", path = "commodore-amiga/kick204.rom" },
]

[[system.firmware]]
variant = "a600-ecs-pal"
files = [
    { id = "commodore-amiga-kickstart-rom", path = "commodore-amiga/kick205.rom" },
]

[[system.firmware]]
variant = "a600-ecs-ntsc"
files = [
    { id = "commodore-amiga-kickstart-rom", path = "commodore-amiga/kick205.rom" },
]

[[system.firmware]]
variant = "a1200-aga-pal"
files = [
    { id = "commodore-amiga-kickstart-rom", path = "commodore-amiga/kick31a1200.rom" },
]

[[system.firmware]]
variant = "a1200-aga-ntsc"
files = [
    { id = "commodore-amiga-kickstart-rom", path = "commodore-amiga/kick31a1200.rom" },
]

[[entry]]
id = "workbench-1.3-desktop"
title = "Amiga Workbench 1.3 desktop boot"
year = 1988
publisher = "Commodore"
variant = "a500-ocs-pal-a501"

[entry.media]
# DF0 floppy slot. The runtime auto-DMAs the boot block off the disk
# once Kickstart reaches the insert-disk screen.
kind = "disk"
slot = "floppy-0"
path = "commodore-amiga/workbench-1.3.adf"

[entry.boot]
# Workbench 1.3 boot is long. The existing boot_invariants regression
# uses 25M ticks ≈ ~175 frames at PAL. Catalogue overshoots to 600 to
# give margin for the AmigaDOS startup window to render fully.
# Captures the canonical AmigaDOS splash:
#   "Copyright ©1987 Commodore-Amiga, Inc. / All rights reserved.
#    Release 1.3 / A500/A2000 U.K. Workbench disk. Release 1.3 version 34.20"
# with the orange cursor on the classic blue Workbench background.
wait_frames = 600
frame_hash = "xxh64:59787c4d45822282"

[entry.audio]
# Workbench desktop has no music or sound effects.
from_frame = 60
secs = 2.0
hash = "xxh64:f6389c53ba66240d"

[[entry]]
id = "workbench-2.04-desktop"
title = "Amiga Workbench 2.04 desktop boot (ECS A500+)"
year = 1991
publisher = "Commodore"
variant = "a500-plus-ecs-pal"

[entry.media]
# DF0 floppy slot. The ECS A500+ uses Kickstart 2.04 + Workbench 2.04.
# Different chip stack to OCS A500 (Agnus 8375 / Denise 8373 / 1 MiB
# chip RAM); validates the ECS path end-to-end.
kind = "disk"
slot = "floppy-0"
path = "commodore-amiga/workbench-2.04.adf"

[entry.boot]
# WB 2.04 boot is longer than WB 1.3. The boot block loads, the OS
# brings up libraries, and the AmigaDOS startup-sequence runs. With
# the floppy spin-up regression fixed (peripheral-commodore-amiga-
# floppy 2026-05-05) the disk loads cleanly and we land on the
# canonical "KeyMap Selection" prompt the WB 2.04 startup-sequence
# raises when no Extras disk is in DF1:
#   "KeyMap Selection / This procedure will copy a selected keymap
#    from the Extras disk onto your Workbench disk. / Please ensure
#    that you are working with a copy of your Workbench disk. / Do
#    you wish to continue? (1 = Yes / 0 = No)"
# This is the strongest single-frame proof that WB 2.04 actually
# booted: it requires the boot block to have run, libraries to have
# initialised, and the startup-sequence script to have executed.
wait_frames = 1500
frame_hash = "xxh64:f13c054d5b989d12"

[entry.audio]
# Workbench desktop has no music or sound effects.
from_frame = 60
secs = 2.0
hash = "xxh64:f6389c53ba66240d"

[[entry]]
id = "barbarian"
title = "Barbarian - The Ultimate Warrior"
year = 1988
publisher = "Palace"
variant = "a500-ocs-pal-a501"

[entry.media]
# OCS A500 boot-block trackloaded game (cracker release, pre-extracted
# to .adf). Validates the trackloader path beyond Workbench.
kind = "disk"
slot = "floppy-0"
path = "commodore-amiga/Barbarian - The Ultimate Warrior (1988)(Palace)[cr BS1 - TKT - INA].adf"

[[entry.script]]
# BSO cracker intros respond to joystick port-1 FIRE button.
at_frame = 1500
port = 1
button = "fire"

[entry.boot]
# After FIRE the BSO cracker intro hands off to the actual Palace
# Barbarian title. wait_frames covers the post-FIRE load.
# Captures the canonical "BARBARIAN" title (Palace logo + score
# header + snake-coiled tree pillars + "DEMONSTRATION" subtitle).
wait_frames = 6000
frame_hash = "xxh64:6265d00efcf40768"

[entry.audio]
# Title attract sequence — silent at this 2 s window.
from_frame = 60
secs = 2.0
hash = "xxh64:f6389c53ba66240d"

[[entry]]
id = "1943"
title = "1943 - The Battle of Midway"
year = 1989
publisher = "GO!"
variant = "a500-ocs-pal-a501"

[entry.media]
# OCS A500 single-disk Capcom arcade port (PNA = Paranoimia cracker
# release). Different publisher + different cracker group + different
# mod tune than Barbarian — broader validation of the trackloader
# and Paula audio paths.
kind = "disk"
slot = "floppy-0"
path = "commodore-amiga/1943 - The Battle of Midway (1989)(GO!)[cr PNA].zip"

[[entry.script]]
# Paranoimia cracker intros also respond to joystick port-1 FIRE.
at_frame = 1500
port = 1
button = "fire"

[entry.boot]
# After FIRE the Paranoimia cracker intro hands off to the actual
# 1943 game. wait_frames covers the post-FIRE load. Captures the
# canonical 1943 title: "1943™ / THE BATTLE OF MIDWAY / F1 - ONE
# PLAYER / Joystick control only / PRESS FIRE ON JOYSTICK TO START
# / © 1987 CAPCOM".
wait_frames = 6000
frame_hash = "xxh64:99d5044f70a3bb21"

[entry.audio]
# Title attract sequence — silent at this 2 s window (waiting for
# joystick FIRE to start the game).
from_frame = 60
secs = 2.0
hash = "xxh64:f6389c53ba66240d"

[[entry]]
