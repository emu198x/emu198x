# Amiga catalogue. See wiki/decisions/october-catalogue.md.
#
# Coverage target: 10 entries spanning OCS A500 + ECS A500+, KS 1.3
# + KS 2.04, AmigaDOS-friendly + boot-block trackloaded games, NTSC
# validation. AGA / A1200 are post-October per the product roadmap.
#
# Media paths resolve against:
#   EMU198X_CATALOGUE_MEDIA_ROOT     (default: ~/Projects/Emu198x-Unclean/Reference)
#   EMU198X_CATALOGUE_FIRMWARE_ROOT  (default: ~/.emu198x/roms)

[system]
id = "amiga"

[[system.firmware]]
variant = "a500-ocs-pal-a501"
files = [
    { id = "commodore-amiga-kickstart-rom", path = "commodore-amiga/kick13.rom" },
]

[[system.firmware]]
variant = "a500-plus-ecs-pal"
files = [
    { id = "commodore-amiga-kickstart-rom", path = "commodore-amiga/kick204.rom" },
]

[[entry]]
id = "workbench-1.3-desktop"
title = "Amiga Workbench 1.3 desktop boot"
year = 1988
publisher = "Commodore"
variant = "a500-ocs-pal-a501"

[entry.media]
# DF0 floppy slot. The runtime auto-DMAs the boot block off the disk
# once Kickstart reaches the insert-disk screen.
kind = "disk"
slot = "floppy-0"
# Workbench 1.3 ADF stored alongside the ROMs. EMU198X_CATALOGUE_MEDIA_ROOT
# defaults to ~/Projects/Emu198x-Unclean/Reference but Workbench is at
# ~/.emu198x/media/commodore-amiga/. Override with the full path when
# running this entry, OR symlink the file under the catalogue media root.
path = "/Users/stevehill/.emu198x/media/commodore-amiga/workbench-1.3.adf"

[entry.boot]
# Workbench 1.3 boot is long. The existing boot_invariants regression
# uses 25M ticks ≈ ~175 frames at PAL. Catalogue overshoots to 600 to
# give margin for the AmigaDOS startup window to render fully.
# Captures the canonical AmigaDOS splash:
#   "Copyright ©1987 Commodore-Amiga, Inc. / All rights reserved.
#    Release 1.3 / A500/A2000 U.K. Workbench disk. Release 1.3 version 34.20"
# with the orange cursor on the classic blue Workbench background.
wait_frames = 600
frame_hash = "xxh64:59787c4d45822282"

[entry.audio]
# Workbench desktop has no music or sound effects.
from_frame = 60
secs = 2.0
hash = "xxh64:f6389c53ba66240d"

[[entry]]
id = "workbench-2.04-desktop"
title = "Amiga Workbench 2.04 desktop boot (ECS A500+)"
year = 1991
publisher = "Commodore"
variant = "a500-plus-ecs-pal"

[entry.media]
# DF0 floppy slot. The ECS A500+ uses Kickstart 2.04 + Workbench 2.04.
# Different chip stack to OCS A500 (Agnus 8375 / Denise 8373 / 1 MiB
# chip RAM); validates the ECS path end-to-end.
kind = "disk"
slot = "floppy-0"
path = "/Users/stevehill/.emu198x/media/commodore-amiga/workbench-2.04.adf"

[entry.boot]
# WB 2.04 boot is even longer than WB 1.3. Captures the canonical
# 2.04 boot logo: rainbow checkmark + "2.0 Roms (37.175) / Copyright
# © 1985-1991 / Commodore-Amiga, Inc. / All Rights Reserved" with
# the A500 disk drive showing the insert-disk prompt.
wait_frames = 1500
frame_hash = "xxh64:1ab637314805711f"

[entry.audio]
# Workbench desktop has no music or sound effects.
from_frame = 60
secs = 2.0
hash = "xxh64:f6389c53ba66240d"

[[entry]]
id = "barbarian"
title = "Barbarian - The Ultimate Warrior"
year = 1988
publisher = "Palace"
variant = "a500-ocs-pal-a501"

[entry.media]
# OCS A500 boot-block trackloaded game (cracker release, pre-extracted
# to .adf). Validates the trackloader path beyond Workbench.
kind = "disk"
slot = "floppy-0"
path = "/Users/stevehill/Projects/Code198x/Amiga/extracted/Barbarian - The Ultimate Warrior (1988)(Palace)[cr BS1 - TKT - INA].adf"

[[entry.script]]
# BSO cracker intros respond to joystick port-1 FIRE button.
at_frame = 1500
port = 1
button = "fire"

[entry.boot]
# After FIRE the BSO cracker intro hands off to the actual Palace
# Barbarian title. wait_frames covers the post-FIRE load.
# Captures the canonical "BARBARIAN" title (Palace logo + score
# header + snake-coiled tree pillars + "DEMONSTRATION" subtitle).
wait_frames = 6000
frame_hash = "xxh64:6265d00efcf40768"

[entry.audio]
# Title attract sequence — silent at this 2 s window.
from_frame = 60
secs = 2.0
hash = "xxh64:f6389c53ba66240d"

[[entry]]
id = "1943"
title = "1943 - The Battle of Midway"
year = 1989
publisher = "GO!"
variant = "a500-ocs-pal-a501"

[entry.media]
# OCS A500 single-disk Capcom arcade port (PNA = Paranoimia cracker
# release). Different publisher + different cracker group + different
# mod tune than Barbarian — broader validation of the trackloader
# and Paula audio paths.
kind = "disk"
slot = "floppy-0"
path = "/Users/stevehill/Projects/Code198x/Amiga/Games/[ADF]/1943 - The Battle of Midway (1989)(GO!)[cr PNA].zip"

[[entry.script]]
# Paranoimia cracker intros also respond to joystick port-1 FIRE.
at_frame = 1500
port = 1
button = "fire"

[entry.boot]
# After FIRE the Paranoimia cracker intro hands off to the actual
# 1943 game. wait_frames covers the post-FIRE load. Captures the
# canonical 1943 title: "1943™ / THE BATTLE OF MIDWAY / F1 - ONE
# PLAYER / Joystick control only / PRESS FIRE ON JOYSTICK TO START
# / © 1987 CAPCOM".
wait_frames = 6000
frame_hash = "xxh64:99d5044f70a3bb21"

[entry.audio]
# Title attract sequence — silent at this 2 s window (waiting for
# joystick FIRE to start the game).
from_frame = 60
secs = 2.0
hash = "xxh64:f6389c53ba66240d"
