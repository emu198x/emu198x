# (portrait and credits) and the audio window was silent. Now the 1571
# makes exactly the 1541's 138 motor and head moves and reaches the same
# playfield as the 1541 entry (64 pixels apart: sprite positions). Why the
# 1571 stalled with the old timer is not traced. Previous hashes:
# bc99c5b7a536f896 (frame), e45531b9387b986f (audio).
wait_frames = 20000
frame_hash = "xxh64:41bdf490f9df6341"

