title = "Action Replay v6.0 Professional"
year = 1989
publisher = "Datel Electronics"
variant = "pal"

[entry.media]
# CRT — the Datel freezer (hardware type 1): 32K ROM in four 8K banks,
# 8K onboard RAM, a $DE00 control register, and a freeze button on /NMI.
