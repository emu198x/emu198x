wait_frames = 12000
frame_hash = "xxh64:b562e1cd4a4a3a34"

[entry.audio]
# In-game with an idle prince is deterministic near-silence; the hash
# asserts the audio pipeline output, not musical content (the intro
# music plays before the boot waypoint).
from_frame = 60
secs = 2.0
hash = "xxh64:7422993a23696560"

