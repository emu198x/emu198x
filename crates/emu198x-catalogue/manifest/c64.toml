[entry.boot]
wait_frames = 50000
frame_hash = "xxh64:ab97482eb1b0aa5d"

[entry.audio]
from_frame = 60
secs = 2.0
hash = "xxh64:e375068dddec4797"

[[entry]]
id = "thing-on-a-spring"
title = "Thing on a Spring"
year = 1985
publisher = "Gremlin"
variant = "pal"

[entry.media]
# C64 TAP datasette path. Tape autoload presses PLAY ON TAPE for us;
# the tape-stop wait handles the rest of the load.
kind = "tape"
slot = "tape-1"
path = "commodore/c64/Games/Arcade/[TAP]/Thing on a Spring (1985)(Gremlin).zip"

[entry.boot]
# Per the existing tape_autoload regression test, Thing on a Spring
# reaches its post-load menu state ~25000 frames after autoload. The
# catalogue overshoots to 50000 to land solidly on the score-table
# screen (the test's 25000 captures a pre-menu state in the catalogue
# context).
wait_frames = 50000
frame_hash = "xxh64:76d04c00d01ea0d0"

[entry.audio]
# Under the sprite sequencer (FRAME_ROUTING_VERSION 2) the menu's SID
# music plays here — this window is no longer silent.
from_frame = 60
secs = 2.0
hash = "xxh64:ca42ce3ea5066000"

[[entry]]
id = "wizball"
title = "Wizball"
year = 1987
publisher = "Ocean"
variant = "pal"

[entry.media]
# D64 — Rob Hubbard SID showcase + colour-cycling palette effects.
kind = "disk"
slot = "drive-8"
path = "commodore/c64/Games/Shoot'em Up/[D64]/Wizball (1987)(Ocean).zip"

# Same LOAD-RUN pattern as Bruce Lee. Initial loader stage runs ~2400
# frames after LOADING text, then RUN starts the program.
[[entry.script]]
at_frame = 2400
press = "r"
[[entry.script]]
at_frame = 2403
press = "u"
[[entry.script]]
at_frame = 2406
press = "n"
[[entry.script]]
at_frame = 2409
press = "return"

[entry.boot]
# After RUN, Wizball loads further and reaches its post-load attract
# state — captures the high-score table screen with the WIZBALL logo
# and Hubbard's SID music looping. Re-blessed for the LXA magic-constant
# fix (#737): Wizball executes LXA (VICE: "needs to be 0xee for
# wizball"), and the $EE model un-garbles the logo and "sensi soft"
# lettering the previous bless had captured corrupted.
wait_frames = 16000
frame_hash = "xxh64:c44b183eb1b947d7"

[entry.audio]
# Captures the Rob Hubbard title-screen SID — first non-silent
# audio assertion of any disk-loaded C64 entry.
from_frame = 60
secs = 2.0
hash = "xxh64:b3eb1c2aae329a3b"

[[entry]]
id = "monty-on-the-run"
title = "Monty on the Run"
year = 1985
publisher = "Gremlin"
variant = "pal"

[entry.media]
# TAP — THE canonical Rob Hubbard SID showcase. The "Monty on the
# Run" song is one of the most-arranged C64 tunes ever. Novaload
# turbo tape (the loader screen shows "NOVALOAD").
#
# play_phase_cycles: the game's attract mode has a genuine IRQ race —
# an interrupt landing in its ROM-banked vector-update window reads a
# torn $0314 and crashes to a warm start. Whether that happens is set
# once, by the tape-start phase vs the raster (frame-locked after
# load). The default phase under the cycle-exact CIA (#17) loses the
# race; nudging PLAY by ~2700 cycles picks a surviving phase, as a
# real user's PLAY press would. Verified: loads to the attract screen.
kind = "tape"
slot = "tape-1"
path = "commodore/c64/Games/Arcade/[TAP]/Monty on the Run (1985)(Gremlin).zip"
play_phase_cycles = 2688

[entry.boot]
# Novaload turbo tape. Captures the post-load attract state:
# Monty / High Scores header + score table + scrolling credits + the
# "MONTY FREEDOM KIT" controls panel. The loader's pulse thresholds
# run through the cycle-exact CIA timers (#17), which stretched the
# load past the old 50000-frame point. Re-blessed with the
# play_phase_cycles nudge above; screenshot + non-silent audio
# verified 2026-07-03.
wait_frames = 62000
frame_hash = "xxh64:d3547aa2257908ef"

[entry.audio]
# Captures Hubbard's "Monty on the Run" theme — first non-silent
# audio assertion on a tape-loaded C64 entry (peak 11336 / RMS 3077
# over the 2s window at the 2026-07-03 re-bless).
from_frame = 60
secs = 2.0
hash = "xxh64:1d260595e427fc4f"

[[entry]]
id = "prince-of-persia"
title = "Prince of Persia"
year = 2011
publisher = "Andreas Varga"
variant = "pal"

[entry.media]
# CRT — mrsid's native EasyFlash port, THE canonical EasyFlash release:
# 1 MB of banked flash (hardware type 32), boots its own loader from the
# cartridge in Ultimax mode. First cartridge entry in the catalogue.
kind = "cartridge"
slot = "cartridge-1"
path = "commodore/c64/Games/Arcade/[CRT]/Prince of Persia (2011)(Andreas Varga)[cr Nostalgia][t +9][EasyFlash 2011-11-01].zip"

[[entry.script]]
# The Nostalgia menu highlights "load game"; RETURN starts it.
at_frame = 600
press = "return"
# Walk the trainer screen: CR accepts each of the eight Y/N rows and
# the starting-level selector, then the game starts.
[[entry.script]]
at_frame = 3000
press = "n"
[[entry.script]]
at_frame = 3050
press = "n"
[[entry.script]]
at_frame = 3100
press = "n"
[[entry.script]]
at_frame = 3150
press = "n"
[[entry.script]]
at_frame = 3200
press = "n"
[[entry.script]]
at_frame = 3250
press = "n"
[[entry.script]]
at_frame = 3300
press = "n"
[[entry.script]]
at_frame = 3350
press = "n"
[[entry.script]]
at_frame = 3400
press = "n"
[[entry.script]]
# CR on the starting-level selector launches the game.
at_frame = 3500
press = "return"

[entry.boot]
# Boot straight from flash through the crack menu into the game: the
# capture lands in-game on level 1 (dungeon, prince, guard). Exercises
# the whole EasyFlash surface — Ultimax boot, bank register sweeps,
# mode-register GAME/EXROM transitions, and the 16K ROMH-on-HIRAM PLA
# rule its launcher depends on ($01=$36).
wait_frames = 12000
frame_hash = "xxh64:b562e1cd4a4a3a34"

[entry.audio]
# In-game with an idle prince is deterministic near-silence; the hash
# asserts the audio pipeline output, not musical content (the intro
# music plays before the boot waypoint).
from_frame = 60
secs = 2.0
hash = "xxh64:ce6e8e82de1a0a18"
