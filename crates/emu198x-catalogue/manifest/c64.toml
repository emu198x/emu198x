# C64 catalogue. See knowledge/decisions/october-catalogue.md.
#
# Coverage target: 10 entries spanning D64 disk, TAP datasette, NTSC,
# and named SID showcases. Cartridges deferred until subsystem lands.
#
# Media paths resolve against:
#   EMU198X_CATALOGUE_MEDIA_ROOT     (default: ~/Projects/Emu198x-Unclean/Reference)
#   EMU198X_CATALOGUE_FIRMWARE_ROOT  (default: ~/.emu198x/roms)

[system]
id = "c64"
# Routing versions the captured hashes encode. Verified at run-time
# against AUDIO_ROUTING_VERSION (mos-sid-6581) and
# FRAME_ROUTING_VERSION (mos-vic-ii). Mismatch fails loud with a
# re-capture instruction. See
# knowledge/decisions/c64-architecture-review.md Seam 4.
audio_routing_version = 3
frame_routing_version = 2

[[system.firmware]]
variant = "pal"
files = [
    { id = "commodore-c64-kernal-rom",    path = "commodore-c64/kernal.rom" },
    { id = "commodore-c64-basic-rom",     path = "commodore-c64/basic.rom" },
    { id = "commodore-c64-character-rom", path = "commodore-c64/chargen.rom" },
    # 1541 DOS ROM is required when disk media is attached. Loaded
    # always so the same firmware list works for boot-to-READY and
    # disk-loaded entries on the same variant.
    { id = "commodore-1541-dos-rom",      path = "commodore-c64/1541.rom" },
]

[[entry]]
id = "boot-to-ready"
title = "C64 KERNAL boot to READY"
year = 1982
publisher = "Commodore"
variant = "pal"

# No media — pure firmware boot. Validates the C64 runtime path
# end-to-end without needing a real game image.

[entry.boot]
# Boot detection fires when "COMMODORE 64 BASIC V2" appears, before
# the rest of the boot banner renders. Wait some frames so the full
# "**** COMMODORE 64 BASIC V2 ****  /  64K RAM SYSTEM 38911 BASIC
# BYTES FREE  /  READY." banner has settled.
wait_frames = 60
frame_hash = "xxh64:78b237c0b923ded5"

[entry.audio]
# C64 boots silent — no music, no sound effects.
from_frame = 60
secs = 2.0
hash = "xxh64:2d2d7c5231ec57ab"

[[entry]]
id = "bruce-lee"
title = "Bruce Lee"
year = 1984
publisher = "Datasoft"
variant = "pal"

[entry.media]
kind = "disk"
slot = "drive-8"
path = "commodore/c64/Games/Arcade/[D64]/Bruce Lee (1984)(Datasoft).zip"

# Disk autoload sends LOAD"*",8,1 + RETURN, then waits for "SEARCHING
# FOR". The script then waits for the loader to finish (~2500 frames
# returns to BASIC at READY), types R-U-N-RETURN to start the program.
[[entry.script]]
at_frame = 2400
press = "r"
[[entry.script]]
at_frame = 2403
press = "u"
[[entry.script]]
at_frame = 2406
press = "n"
[[entry.script]]
at_frame = 2409
press = "return"

[entry.boot]
# After RUN, the program loads further into memory and reaches its
# title screen. The KERNAL serial loader runs through the cycle-exact
# CIA timers (#17), which stretched the load past the old 16000-frame
# point; 20000 frames lands on the same target state with margin.
# Captures the canonical Bruce Lee playfield (mountains + temple +
# Bruce Lee + the Ninja + the Yamo). Re-blessed for the LXA magic fix
# (#737): the load/attract timeline shifted a little, so the demo
# sprites sit at different positions at the capture frame; the audio
# hash was unchanged by the fix.
wait_frames = 20000
frame_hash = "xxh64:7f4376f4e93bbeb4"

[entry.audio]
# Captures the in-game SID music.
from_frame = 60
secs = 2.0
hash = "xxh64:154fa6dfa3fd36d5"

[[entry]]
id = "aztec-challenge"
title = "Aztec Challenge"
year = 1983
publisher = "Cosmi"
variant = "pal"

[entry.media]
kind = "disk"
slot = "drive-8"
path = "commodore/c64/Games/Arcade/[D64]/Aztec Challenge (1983)(Cosmi).zip"

# Same LOAD-RUN pattern as Bruce Lee, with Aztec's longer initial
# loader stage (4000 frames after LOADING vs Bruce Lee's 2400).
[[entry.script]]
at_frame = 4000
press = "r"
[[entry.script]]
at_frame = 4003
press = "u"
[[entry.script]]
at_frame = 4006
press = "n"
[[entry.script]]
at_frame = 4009
press = "return"

[entry.boot]
# Captures the post-RUN player-select state. Aztec's player-select
# uses a custom graphical rendering rather than standard text mode,
# so the captured pixel hash looks "scrambled" relative to a
# typical menu. The existing disk_autoload regression test asserts
# text on row 3 via screen_text_lines (which reads character data),
# confirming the screen IS at player-select even though pixels
# render with custom CHARGEN.
wait_frames = 5000
frame_hash = "xxh64:e69c66d47c38fe97"

[entry.audio]
from_frame = 60
secs = 2.0
hash = "xxh64:9a8ab639d32c76d7"

