slot = "cartridge-1"

path = "commodore/c64/Applications/[CRT]/Action Replay v6.0 Professional (1989)(Datel Electronics).zip"

[[entry.script]]
# Let the KERNAL reach READY, then press the freeze button: the Action
# Replay menu takes over the screen.
at_frame = 200
press = "freeze"

[entry.boot]
# The capture lands on the Action Replay freezer menu — proof the freeze
# button drove /NMI and the cartridge banked itself in over $8000/$E000.
wait_frames = 500
frame_hash = "xxh64:72943c01dbd9bd32"

[entry.audio]
# The idle freezer menu is deterministic near-silence.
from_frame = 60
secs = 2.0
hash = "xxh64:8d457b26c922563e"

