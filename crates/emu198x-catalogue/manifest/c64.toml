# C64 catalogue. See knowledge/decisions/october-catalogue.md.
#
# Coverage target: 10 entries spanning D64 disk, TAP datasette, NTSC,
# and named SID showcases. Cartridges deferred until subsystem lands.
#
# Media paths resolve against:
#   EMU198X_CATALOGUE_MEDIA_ROOT     (default: ~/Projects/Emu198x-Unclean/Reference)
#   EMU198X_CATALOGUE_FIRMWARE_ROOT  (default: ~/.emu198x/roms)

[system]
id = "c64"
# Routing versions the captured hashes encode. Verified at run-time
# against AUDIO_ROUTING_VERSION (mos-sid-6581) and
# FRAME_ROUTING_VERSION (mos-vic-ii). Mismatch fails loud with a
# re-capture instruction. See
# knowledge/decisions/c64-architecture-review.md Seam 4.
audio_routing_version = 1
frame_routing_version = 2

[[system.firmware]]
variant = "pal"
files = [
    { id = "commodore-c64-kernal-rom",    path = "commodore-c64/kernal.rom" },
    { id = "commodore-c64-basic-rom",     path = "commodore-c64/basic.rom" },
    { id = "commodore-c64-character-rom", path = "commodore-c64/chargen.rom" },
    # 1541 DOS ROM is required when disk media is attached. Loaded
    # always so the same firmware list works for boot-to-READY and
    # disk-loaded entries on the same variant.
    { id = "commodore-1541-dos-rom",      path = "commodore-c64/1541.rom" },
]

[[entry]]
id = "boot-to-ready"
title = "C64 KERNAL boot to READY"
year = 1982
publisher = "Commodore"
variant = "pal"

# No media — pure firmware boot. Validates the C64 runtime path
# end-to-end without needing a real game image.

[entry.boot]
# Boot detection fires when "COMMODORE 64 BASIC V2" appears, before
# the rest of the boot banner renders. Wait some frames so the full
# "**** COMMODORE 64 BASIC V2 ****  /  64K RAM SYSTEM 38911 BASIC
# BYTES FREE  /  READY." banner has settled.
wait_frames = 60
frame_hash = "xxh64:78b237c0b923ded5"

[entry.audio]
# C64 boots silent — no music, no sound effects.
from_frame = 60
secs = 2.0
hash = "xxh64:2d2d7c5231ec57ab"

[[entry]]
id = "bruce-lee"
title = "Bruce Lee"
year = 1984
publisher = "Datasoft"
variant = "pal"

[entry.media]
kind = "disk"
slot = "drive-8"
path = "commodore/c64/Games/Arcade/[D64]/Bruce Lee (1984)(Datasoft).zip"

# Disk autoload sends LOAD"*",8,1 + RETURN, then waits for "SEARCHING
# FOR". The script then waits for the loader to finish (~2500 frames
# returns to BASIC at READY), types R-U-N-RETURN to start the program.
[[entry.script]]
at_frame = 2400
press = "r"
[[entry.script]]
at_frame = 2403
press = "u"
[[entry.script]]
at_frame = 2406
press = "n"
[[entry.script]]
at_frame = 2409
press = "return"

[entry.boot]
# After RUN, the program loads further into memory and reaches its
# title screen. ~16000 frames (≈5 minutes emulated time) is the safety
# margin per the existing disk_autoload regression test.
# Captures the canonical Bruce Lee playfield (mountains + temple +
# Bruce Lee + the Ninja + the Yamo).
wait_frames = 16000
frame_hash = "xxh64:98fd84eeb617c09a"

[entry.audio]
# Captures the in-game SID music.
from_frame = 60
secs = 2.0
hash = "xxh64:ea4002a300a2d00b"

[[entry]]
id = "aztec-challenge"
title = "Aztec Challenge"
year = 1983
publisher = "Cosmi"
variant = "pal"

[entry.media]
kind = "disk"
slot = "drive-8"
path = "commodore/c64/Games/Arcade/[D64]/Aztec Challenge (1983)(Cosmi).zip"

# Same LOAD-RUN pattern as Bruce Lee, with Aztec's longer initial
# loader stage (4000 frames after LOADING vs Bruce Lee's 2400).
[[entry.script]]
at_frame = 4000
press = "r"
[[entry.script]]
at_frame = 4003
press = "u"
[[entry.script]]
at_frame = 4006
press = "n"
[[entry.script]]
at_frame = 4009
press = "return"

[entry.boot]
# Captures the post-RUN player-select state. Aztec's player-select
# uses a custom graphical rendering rather than standard text mode,
# so the captured pixel hash looks "scrambled" relative to a
# typical menu. The existing disk_autoload regression test asserts
# text on row 3 via screen_text_lines (which reads character data),
# confirming the screen IS at player-select even though pixels
# render with custom CHARGEN.
wait_frames = 5000
frame_hash = "xxh64:2c603ce4e24c3f4b"

[entry.audio]
from_frame = 60
secs = 2.0
hash = "xxh64:4157b0254b857738"

[[entry]]
id = "bomb-jack"
title = "Bomb Jack"
year = 1986
publisher = "Elite"
variant = "pal"

[entry.media]
kind = "disk"
slot = "drive-8"
path = "commodore/c64/Games/Arcade/[D64]/Bomb Jack (1986)(Elite).zip"

# Bomb Jack uses a self-running multi-stage loader — no RUN needed,
# just a long wait (~50000 frames) for it to reach its title screen.
# Captures the canonical "BOMB JACK / OFFICIALLY LICENSED CBM 64
# VERSION / COPYRIGHT ELITE SYSTEMS LTD 1986 / PRESS FIRE TO PLAY"
# with the scrolling credit "AND TO MARK COOKSEY FOR THE MUSIC".
[entry.boot]
wait_frames = 50000
frame_hash = "xxh64:ab97482eb1b0aa5d"

[entry.audio]
from_frame = 60
secs = 2.0
hash = "xxh64:f069fde6b541e7a6"

[[entry]]
id = "thing-on-a-spring"
title = "Thing on a Spring"
year = 1985
publisher = "Gremlin"
variant = "pal"

[entry.media]
# C64 TAP datasette path. Tape autoload presses PLAY ON TAPE for us;
# the tape-stop wait handles the rest of the load.
kind = "tape"
slot = "tape-1"
path = "commodore/c64/Games/Arcade/[TAP]/Thing on a Spring (1985)(Gremlin).zip"

[entry.boot]
# Per the existing tape_autoload regression test, Thing on a Spring
# reaches its post-load menu state ~25000 frames after autoload. The
# catalogue overshoots to 50000 to land solidly on the score-table
# screen (the test's 25000 captures a pre-menu state in the catalogue
# context).
wait_frames = 50000
frame_hash = "xxh64:e3a6cc012790ad9c"

[entry.audio]
# Under the sprite sequencer (FRAME_ROUTING_VERSION 2) the menu's SID
# music plays here — this window is no longer silent.
from_frame = 60
secs = 2.0
hash = "xxh64:7ed8c2a9ed209344"

[[entry]]
id = "wizball"
title = "Wizball"
year = 1987
publisher = "Ocean"
variant = "pal"

[entry.media]
# D64 — Rob Hubbard SID showcase + colour-cycling palette effects.
kind = "disk"
slot = "drive-8"
path = "commodore/c64/Games/Shoot'em Up/[D64]/Wizball (1987)(Ocean).zip"

# Same LOAD-RUN pattern as Bruce Lee. Initial loader stage runs ~2400
# frames after LOADING text, then RUN starts the program.
[[entry.script]]
at_frame = 2400
press = "r"
[[entry.script]]
at_frame = 2403
press = "u"
[[entry.script]]
at_frame = 2406
press = "n"
[[entry.script]]
at_frame = 2409
press = "return"

[entry.boot]
# After RUN, Wizball loads further and reaches its post-load attract
# state — captures the high-score table screen with the WIZBALL logo
# and Hubbard's SID music looping.
wait_frames = 16000
frame_hash = "xxh64:c440191a8a82f024"

[entry.audio]
# Captures the Rob Hubbard title-screen SID — first non-silent
# audio assertion of any disk-loaded C64 entry.
from_frame = 60
secs = 2.0
hash = "xxh64:5d64607a33917135"

[[entry]]
id = "monty-on-the-run"
title = "Monty on the Run"
year = 1985
publisher = "Gremlin"
variant = "pal"

[entry.media]
# TAP — THE canonical Rob Hubbard SID showcase. The "Monty on the
# Run" song is one of the most-arranged C64 tunes ever. Standard
# Gremlin tape loader (no turbo-loader).
kind = "tape"
slot = "tape-1"
path = "commodore/c64/Games/Arcade/[TAP]/Monty on the Run (1985)(Gremlin).zip"

[entry.boot]
# Standard Gremlin tape loader. Captures the post-load attract state:
# Monty / High Scores header + score table + scrolling credits + the
# "MONTY FREEDOM KIT" controls panel.
wait_frames = 50000
frame_hash = "xxh64:c2244ec2282abe54"

[entry.audio]
# Captures Hubbard's "Monty on the Run" theme — first non-silent
# audio assertion on a tape-loaded C64 entry.
from_frame = 60
secs = 2.0
hash = "xxh64:c74f842c8210a508"
