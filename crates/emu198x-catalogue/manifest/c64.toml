# C64 catalogue. See knowledge/decisions/october-catalogue.md.
#
# Coverage: 13 entries spanning firmware-only boot, D64/D81/G64 disk,
# TAP datasette, cartridges, 1541/1571/1581 routes and SID showcases.
#
# Media paths resolve against:
#   EMU198X_CATALOGUE_MEDIA_ROOT     (default: /Volumes/Data/Library/ROMs/TOSEC)
#   EMU198X_CATALOGUE_FIRMWARE_ROOT  (default: ~/.emu198x/roms)

[system]
id = "c64"
# Routing versions the captured hashes encode. Verified at run-time
# against AUDIO_ROUTING_VERSION (emu198x-mos-sid-6581) and
# FRAME_ROUTING_VERSION (mos-vic-ii). Mismatch fails loud with a
# re-capture instruction. See
# knowledge/decisions/c64-architecture-review.md Seam 4.
# Version 5 is the #777 waveform-generator series (pulse comparator and
# ring-mod polarity, grounded triangle LSB, TEST-bit noise drift, floating
# DAC input). Re-captured with `catalogue capture`: the eight music entries'
# audio hashes changed; every frame hash and the five silent entries' audio
# hashes stayed the same.
# Version 6 is #769: die-photo noise taps, 8580 combined-waveform tables,
# the noise+pulse pull-down and the combined-waveform noise write-back.
# Re-captured with `catalogue capture`: six music entries' audio hashes
# changed (five from the noise taps alone, Prince of Persia from the
# write-back as well); every frame hash and the other seven entries' audio
# hashes stayed the same.
# Version 7 is #1606: the power-on accumulator (0x555555) and noise
# register (0x7FFFFE), the one-cycle pulse compare, the two-cycle noise
# shift, the hard-sync special case and the 6581 sawtooth-combined MSB
# pull-down. Re-captured with `catalogue capture`: all eight music entries'
# audio hashes changed, and Aztec Challenge's frame hash too (see its
# entry); the other twelve frame hashes and the five silent entries' audio
# hashes stayed the same.
audio_routing_version = 7
# Version 8 is stage 3a of the C64 accuracy closure campaign: the CPU sees
# the raster edge and raster IRQ on cycle 1, VIC-II write rules, sprite DMA
# and the light pen follow VICE's cycles, and a two-tick colour stage
# resolves colour registers and the side border. Re-captured with
# `catalogue capture`: frame hashes changed for Aztec Challenge, Thing on a
# Spring, Wizball, Monty on the Run and Bomb Jack II (G64); the other eight
# are unchanged. The eight music entries' audio hashes changed too. That
# comes from CPU timing (the raster IRQ and sprite-DMA stalls now fall on
# VICE's cycles), not from SID routing, so audio_routing_version stays at
# the SID crate's value.
# Version 9 is #1620: the graphics sequencer loads each cell at the XSCROLL
# that stands after the CPU access of its g-access cycle, so a mid-line
# $D016 write moves the rest of the line instead of waiting for the next.
# Before the bump, `catalogue run` passed all thirteen entries with the fix
# in place; at version 9 it passes them again, so every frame and audio
# hash is unchanged.
# Version 10 is #1660: the graphics sequencer decodes the display mode at
# the shift register's output, and the g-access reads some mode bits a
# cycle late. `catalogue run` changed one frame hash, Aztec Challenge's
# (see its entry); every other frame and audio hash is unchanged.
frame_routing_version = 10

[[system.firmware]]
variant = "pal"
files = [
    { id = "commodore-c64-kernal-rom",    path = "commodore-c64/kernal.rom" },
    { id = "commodore-c64-basic-rom",     path = "commodore-c64/basic.rom" },
    { id = "commodore-c64-character-rom", path = "commodore-c64/chargen.rom" },
    # 1541 DOS ROM is required when disk media is attached. Loaded
    # always so the same firmware list works for boot-to-READY and
    # disk-loaded entries on the same variant.
    { id = "commodore-1541-dos-rom",      path = "commodore-c64/1541.rom" },
]

# Same PAL breadbin, but with the 1581 3.5" drive's DOS ROM instead of the
# 1541's. Entries on this variant attach a 1581 on IEC device 9 (slot
# "drive-9") for D81 media. Kept a separate variant so D64/TAP entries on the
# plain "pal" set keep their captured hashes untouched.
[[system.firmware]]
variant = "pal-1581"
files = [
    { id = "commodore-c64-kernal-rom",    path = "commodore-c64/kernal.rom" },
    { id = "commodore-c64-basic-rom",     path = "commodore-c64/basic.rom" },
    { id = "commodore-c64-character-rom", path = "commodore-c64/chargen.rom" },
    { id = "commodore-1581-dos-rom",      path = "commodore-c64/1581.rom" },
]

# Same PAL breadbin, but with the 1571 5.25" drive's DOS ROM. The runner puts a
# 1571 on IEC device 8 (slot "drive-8") for this variant, so D71/D64 entries
# load through it with the standard LOAD"*",8,1. Separate variant so the plain
# "pal" set's captured hashes stay untouched.
[[system.firmware]]
variant = "pal-1571"
files = [
    { id = "commodore-c64-kernal-rom",    path = "commodore-c64/kernal.rom" },
    { id = "commodore-c64-basic-rom",     path = "commodore-c64/basic.rom" },
    { id = "commodore-c64-character-rom", path = "commodore-c64/chargen.rom" },
    { id = "commodore-1571-dos-rom",      path = "commodore-c64/1571.rom" },
]

[[entry]]
id = "boot-to-ready"
title = "C64 KERNAL boot to READY"
year = 1982
publisher = "Commodore"
variant = "pal"

# No media — pure firmware boot. Validates the C64 runtime path
# end-to-end without needing a real game image.

[entry.boot]
# Boot detection fires when "COMMODORE 64 BASIC V2" appears, before
# the rest of the boot banner renders. Wait some frames so the full
# "**** COMMODORE 64 BASIC V2 ****  /  64K RAM SYSTEM 38911 BASIC
# BYTES FREE  /  READY." banner has settled.
wait_frames = 60
frame_hash = "xxh64:78b237c0b923ded5"

[entry.audio]
# C64 boots silent — no music, no sound effects.
from_frame = 60
secs = 2.0
hash = "xxh64:e45531b9387b986f"

[[entry]]
id = "bruce-lee"
title = "Bruce Lee"
year = 1984
publisher = "Datasoft"
variant = "pal"

[entry.media]
kind = "disk"
slot = "drive-8"
path = "commodore/c64/Games/Arcade/[D64]/Bruce Lee (1984)(Datasoft).zip"

# Disk autoload sends LOAD"*",8,1 + RETURN, then waits for "SEARCHING
# FOR". The script then waits for the loader to finish (~2500 frames
# returns to BASIC at READY), types R-U-N-RETURN to start the program.
[[entry.script]]
at_frame = 2400
press = "r"
[[entry.script]]
at_frame = 2403
press = "u"
[[entry.script]]
at_frame = 2406
press = "n"
[[entry.script]]
at_frame = 2409
press = "return"

[entry.boot]
# After RUN, the program loads further into memory and reaches its
# title screen. The KERNAL serial loader runs through the cycle-exact
# CIA timers (#17), which stretched the load past the old 16000-frame
# point; 20000 frames lands on the same target state with margin.
# Captures the canonical Bruce Lee playfield (mountains + temple +
# Bruce Lee + the Ninja + the Yamo). Re-blessed for the LXA magic fix
# (#737); again for the CIA TOD fix (#762), which shifts the TOD-driven
# attract so the demo sprites sit at different positions at the capture
# frame (screenshot-verified as the same canonical playfield); and the
# audio hash for AUDIO_ROUTING_VERSION 4 (#763).
# Re-captured 2026-10-07 for #1642, when VIA timer 1 started counting from
# the value written to T1C-H, one cycle later than before. The 1541 DOS
# restarts its controller timer (VIA 2 timer 1) with T1C-H writes in its job
# loop interrupt ($F99C) and its stepper ramp ($FA81, $FAAB; The Anatomy of
# the 1541 Disk Drive), so each of those periods is now a cycle longer.
# The drive makes the same 138 motor and head moves as before; the last
# ends 68,474 drive cycles (about 3.4 frames) later. The capture is the
# same playfield, with Bruce Lee's sprite at another animation step (47
# pixels), and the music window falls at another point in the tune.
# Previous hashes: e0ff7f47c0d722c0 (frame), 41ed1062c919a1f7 (audio).
wait_frames = 20000
frame_hash = "xxh64:330260df30fd7669"

[entry.audio]
# Captures the in-game SID music.
from_frame = 60
secs = 2.0
hash = "xxh64:803dabadb248682b"

[[entry]]
id = "aztec-challenge"
title = "Aztec Challenge"
year = 1983
publisher = "Cosmi"
variant = "pal"

[entry.media]
kind = "disk"
slot = "drive-8"
path = "commodore/c64/Games/Arcade/[D64]/Aztec Challenge (1983)(Cosmi).zip"

# Same LOAD-RUN pattern as Bruce Lee, with Aztec's longer initial
# loader stage (4000 frames after LOADING vs Bruce Lee's 2400).
[[entry.script]]
at_frame = 4000
press = "r"
[[entry.script]]
at_frame = 4003
press = "u"
[[entry.script]]
at_frame = 4006
press = "n"
[[entry.script]]
at_frame = 4009
press = "return"

[entry.boot]
# Captures the post-RUN player-select state. Aztec's player-select
# uses a custom graphical rendering rather than standard text mode,
# so the captured pixel hash looks "scrambled" relative to a
# typical menu. The existing disk_autoload regression test asserts
# text on row 3 via screen_text_lines (which reads character data),
# confirming the screen IS at player-select even though pixels
# render with custom CHARGEN.
# The game reads OSC3 for random numbers (six `LDA $D41B` in RAM at the
# waypoint), so SID changes move what frame 5000 shows. At audio routing
# version 7 it is the in-game scene, as it already was at version 6 with the
# player elsewhere; the SID power-on state alone gives player-select, and
# the two-cycle noise shift moves it on again.
# Re-captured 2026-10-07 for #1642, when VIA timer 1 started counting from
# the value written to T1C-H, one cycle later than before. The 1541 DOS
# restarts its controller timer (VIA 2 timer 1) with T1C-H writes in its job
# loop interrupt ($F99C) and its stepper ramp ($FA81, $FAAB; The Anatomy of
# the 1541 Disk Drive), so each of those periods is now a cycle longer.
# The drive makes the same 12 motor and head moves as before; the last
# ends 9,623 drive cycles earlier. The capture is the same in-game scene
# with the player and spears elsewhere, since the game's random numbers
# depend on when it reads them. Previous hashes: a4c39c2a29913273 (frame),
# fca3bd061cecfc27 (audio).
# Re-captured at frame routing version 10 (#1660): two pixels at
# (114, 209) change from brown to black. A sprite with background priority
# (`$D01B`) lies there over a multicolour "01" pair in `$D022`. A "01" pair
# counts as background for sprite priority (Bauer, section 3.7.3.2; VICE's
# `pixel_pri = px & 2`), but the old renderer treated it as foreground,
# which hid the sprite. Reverting only that rule restores the previous
# hash. Previous frame hash: 9cc4001386e8b386.
wait_frames = 5000
frame_hash = "xxh64:73a2fa71906091c0"

[entry.audio]
from_frame = 60
secs = 2.0
hash = "xxh64:82a2492c0f2e18e0"

