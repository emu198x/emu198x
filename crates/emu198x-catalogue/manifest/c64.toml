[[entry]]
id = "monty-on-the-run"
title = "Monty on the Run"
year = 1985
publisher = "Gremlin"
variant = "pal"

[entry.media]
# TAP — THE canonical Rob Hubbard SID showcase. The "Monty on the
# Run" song is one of the most-arranged C64 tunes ever. Novaload
# turbo tape (the loader screen shows "NOVALOAD").
#
# play_phase_cycles: the game's attract mode has a genuine IRQ race —
# an interrupt landing in its ROM-banked vector-update window reads a
# torn $0314 and crashes to a warm start. Whether that happens is set
# once, by the tape-start phase vs the raster (frame-locked after
# load). The default phase under the cycle-exact CIA (#17) loses the
# race; nudging PLAY by ~2700 cycles picks a surviving phase, as a
# real user's PLAY press would. Verified: loads to the attract screen.
kind = "tape"
slot = "tape-1"
path = "commodore/c64/Games/Arcade/[TAP]/Monty on the Run (1985)(Gremlin).zip"
play_phase_cycles = 2688

[entry.boot]
# Novaload turbo tape. Captures the post-load attract state:
# Monty / High Scores header + score table + scrolling credits + the
# "MONTY FREEDOM KIT" controls panel. The loader's pulse thresholds
# run through the cycle-exact CIA timers (#17), which stretched the
# load past the old 50000-frame point. Re-blessed with the
# play_phase_cycles nudge above; screenshot + non-silent audio
# verified 2026-07-03.
wait_frames = 62000
frame_hash = "xxh64:d3547aa2257908ef"

[entry.audio]
# Captures Hubbard's "Monty on the Run" theme — first non-silent
# audio assertion on a tape-loaded C64 entry (peak 11336 / RMS 3077
# over the 2s window at the 2026-07-03 re-bless).
from_frame = 60
secs = 2.0
hash = "xxh64:58fd2f915df63ee1"

