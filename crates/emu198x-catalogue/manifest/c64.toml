# The Nostalgia menu highlights "load game"; RETURN starts it.
at_frame = 600
press = "return"
# Walk the trainer screen: CR accepts each of the eight Y/N rows and
# the starting-level selector, then the game starts.
[[entry.script]]
at_frame = 3000
press = "n"
[[entry.script]]
at_frame = 3050
press = "n"
[[entry.script]]
at_frame = 3100
press = "n"
[[entry.script]]
at_frame = 3150
press = "n"
[[entry.script]]
at_frame = 3200
press = "n"
[[entry.script]]
at_frame = 3250
press = "n"
[[entry.script]]
at_frame = 3300
press = "n"
[[entry.script]]
at_frame = 3350
press = "n"
[[entry.script]]
at_frame = 3400
press = "n"
[[entry.script]]
# CR on the starting-level selector launches the game.
at_frame = 3500
press = "return"

[entry.boot]
# Boot straight from flash through the crack menu into the game: the
# capture lands in-game on level 1 (dungeon, prince, guard). Exercises
# the whole EasyFlash surface — Ultimax boot, bank register sweeps,
