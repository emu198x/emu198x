[[entry]]
id = "tetris-plus3"
title = "Tetris (+3)"
year = 1988
publisher = "Mirrorsoft"
variant = "plus3"

[entry.media]
# Mirrorsoft's official Spectrum port. Track 12 is a format-only
# protection track: 16 sectors with sequential CHRN values (sec i
# has C=H=R=N=i) all flagged ST1.DE | ST2.DD, and the loader does
# a multi-ReadID rotation check on that track to verify the layout.
# A chip that always returned sectors[0] from ReadID would see the
# same all-zeros header forever and conclude the disk is a copy;
# rotational ReadID walks the track and satisfies the check.
# Unblocked by `read_id_index` in `nec-upd765a`.
kind = "disk"
slot = "disk-a"
path = "sinclair/spectrum/Games/[DSK]/Tetris (1988)(Mirrorsoft)(+3).zip"

[entry.boot]
# Captures the Mirrorsoft title screen: rainbow-coloured "TETRIS"
# logo, "MIRROR Soft PRESSENTS" banner, scrolling credits ribbon
# at the bottom showing "...N SOFTWARE AND ..."
wait_frames = 6000
frame_hash = "xxh64:14ad0950cf6ac3b0"

[entry.audio]
from_frame = 60
secs = 2.0
hash = "xxh64:c27195d1cabf3150"

# ─── Speedlock-6 cluster ────────────────────────────────────────
# Four titles that share Ocean's Speedlock-6 protection: a weak-
# sector check on track 0 sector 2. All four hung at the same
# anti-tamper wipe loop ($FDxx INC HL ladder) until the µPD765A
# learned to model marginal-encoding physics on sectors with
# recorded ST1.DE / ST2.DD set — at which point all four progress
# past the protection and reach loaded game code. See
# `wiki/decisions/marginal-encoding-model.md`.

[[entry]]
id = "operation-wolf-plus3"
title = "Operation Wolf (+3)"
year = 1988
publisher = "Ocean"
variant = "plus3"

[entry.media]
# Taito arcade conversion. Speedlock-6 with a weak track-0 sector
# 2 carrying ST1.DE | ST2.DD; loader re-reads that sector and
# expects the bytes to differ between reads.
kind = "disk"
slot = "disk-a"
path = "sinclair/spectrum/Games/[DSK]/Operation Wolf (1988)(Ocean)(+3).zip"

