# ─── 48K custom-pulse loaders ───────────────────────────────────
# Every TAP entry above loads through the BASIC ROM's standard
# LD-BYTES path. The Alkatraz entry below routes through TZX's
# 0x11 turbo-speed blocks instead, exercising the
# format-sinclair-zx-spectrum-tzx → TapeSpan pulse pipeline — a
# regression in pulse timing or in the CPU's IN A,(0xFE) edge
# polling under custom pulses surfaces here before any of the
# TAP entries flinch.
#
# Speedlock-tape (Hit Squad re-releases of Ocean's 1988 titles)
# remains unsupported — pulse-timing precision in our edge polling
# isn't yet tight enough for Speedlock 7's cycle-counted byte read.
# Documented at wiki/decisions/speedlock-tape-incomplete.md.


