# Spectrum catalogue. See wiki/decisions/october-catalogue.md.
#
# Coverage target: 10 entries spanning 48K, 128K, +3 (DSK), Pentagon
# (TR-DOS), and Timex (DOCK). This file lands narrow with one entry —
# additional entries land per the staged rollout in the decision doc.
#
# Frame and audio paths are resolved against:
#   EMU198X_CATALOGUE_MEDIA_ROOT     (default: ~/Projects/Emu198x-Unclean/Reference)
#   EMU198X_CATALOGUE_FIRMWARE_ROOT  (default: ~/.emu198x/roms)

[system]
id = "spectrum"

[[system.firmware]]
variant = "48k"
files = [
    { id = "sinclair-zx-spectrum-48k-rom", path = "sinclair-zx-spectrum-48k/48.rom" },
]

[[system.firmware]]
variant = "128k"
files = [
    { id = "sinclair-zx-spectrum-128k-rom-0", path = "sinclair-zx-spectrum-128k/128-0.rom" },
    { id = "sinclair-zx-spectrum-128k-rom-1", path = "sinclair-zx-spectrum-128k/128-1.rom" },
]

[[system.firmware]]
variant = "plus3"
files = [
    { id = "amstrad-zx-spectrum-plus3-rom-0", path = "amstrad-zx-spectrum-plus3/plus3-0.rom" },
    { id = "amstrad-zx-spectrum-plus3-rom-1", path = "amstrad-zx-spectrum-plus3/plus3-1.rom" },
    { id = "amstrad-zx-spectrum-plus3-rom-2", path = "amstrad-zx-spectrum-plus3/plus3-2.rom" },
    { id = "amstrad-zx-spectrum-plus3-rom-3", path = "amstrad-zx-spectrum-plus3/plus3-3.rom" },
]

[[entry]]
id = "manic-miner"
title = "Manic Miner"
year = 1983
publisher = "Bug-Byte"
variant = "48k"

[entry.media]
kind = "tape"
slot = "tape-1"
path = "sinclair/spectrum/Games/[TAP]/Manic Miner (1983)(Bug-Byte)[a3].zip"

[entry.boot]
# Frames after the tape load completes, before capturing the title-screen
# frame ("MANIC MINER / PRESS ENTER TO START"). Captured for paste-into-
# manifest via:
#   cargo run -p emu198x-catalogue --bin catalogue -- capture --entry manic-miner
wait_frames = 60
frame_hash = "xxh64:30284edfffd9c628"

[entry.audio]
# Frames after the boot waypoint to start the 2 s audio capture window.
# Captures the iconic "In the Hall of the Mountain King" loop on the
# title screen.
from_frame = 100
secs = 2.0
hash = "xxh64:4aa1053c8758f416"

