# Spectrum catalogue. See wiki/decisions/october-catalogue.md.
#
# Coverage target: 10 entries spanning 48K, 128K, +3 (DSK), Pentagon
# (TR-DOS), and Timex (DOCK). This file lands narrow with one entry —
# additional entries land per the staged rollout in the decision doc.
#
# Frame and audio paths are resolved against:
#   EMU198X_CATALOGUE_MEDIA_ROOT     (default: ~/Projects/Emu198x-Unclean/Reference)
#   EMU198X_CATALOGUE_FIRMWARE_ROOT  (default: ~/.emu198x/roms)

[system]
id = "spectrum"

[[system.firmware]]
variant = "48k"
files = [
    { id = "sinclair-zx-spectrum-48k-rom", path = "sinclair-zx-spectrum-48k/48.rom" },
]

# Spectrum+ is electrically identical to the 48K — same ROM image, same
# memory map, same Ferranti ULA. The catalogue duplicates the 48K title
# set against the dedicated -plus crate so any future drift between the
# two surfaces immediately. See wiki/decisions/october-catalogue.md.
[[system.firmware]]
variant = "plus"
files = [
    { id = "sinclair-zx-spectrum-48k-rom", path = "sinclair-zx-spectrum-48k/48.rom" },
]

# 16K Spectrum: same Z80, same Ferranti ULA, same 48 BASIC ROM as the
# 48K — only RAM size differs (16 KiB vs 48 KiB). The catalogue picks
# titles small enough to fit in 16K (typically 1982-83 single-screen
# action games), exercising memory-bound behaviour the 48K and Spectrum+
# entries can't.
[[system.firmware]]
variant = "16k"
files = [
    { id = "sinclair-zx-spectrum-48k-rom", path = "sinclair-zx-spectrum-48k/48.rom" },
]

[[system.firmware]]
variant = "128k"
files = [
    { id = "sinclair-zx-spectrum-128k-rom-0", path = "sinclair-zx-spectrum-128k/128-0.rom" },
    { id = "sinclair-zx-spectrum-128k-rom-1", path = "sinclair-zx-spectrum-128k/128-1.rom" },
]

# Grey +2 (Amstrad-built but Sinclair-class hardware, 1986). Two ROMs,
# Sinclair 7K010E ULA, electrically identical to the 128K — only the
# ROM bundle and copyright banner differ.
[[system.firmware]]
variant = "plus2"
files = [
    { id = "sinclair-zx-spectrum-plus2-rom-0", path = "amstrad-zx-spectrum-plus2/plus2-0.rom" },
    { id = "sinclair-zx-spectrum-plus2-rom-1", path = "amstrad-zx-spectrum-plus2/plus2-1.rom" },
]

# +2A and +2B share the Amstrad gate-array (4 ROMs, plus3 firmware ids).
# +2A uses v4.0 ROMs (same bundle as the +3); +2B uses v4.1 ROMs.
[[system.firmware]]
variant = "plus2a"
files = [
    { id = "sinclair-zx-spectrum-plus3-rom-0", path = "amstrad-zx-spectrum-plus3/plus3-0.rom" },
    { id = "sinclair-zx-spectrum-plus3-rom-1", path = "amstrad-zx-spectrum-plus3/plus3-1.rom" },
    { id = "sinclair-zx-spectrum-plus3-rom-2", path = "amstrad-zx-spectrum-plus3/plus3-2.rom" },
    { id = "sinclair-zx-spectrum-plus3-rom-3", path = "amstrad-zx-spectrum-plus3/plus3-3.rom" },
]

[[system.firmware]]
variant = "plus2b"
files = [
    { id = "sinclair-zx-spectrum-plus3-rom-0", path = "amstrad-zx-spectrum-plus2b/plus3-0.rom" },
    { id = "sinclair-zx-spectrum-plus3-rom-1", path = "amstrad-zx-spectrum-plus2b/plus3-1.rom" },
    { id = "sinclair-zx-spectrum-plus3-rom-2", path = "amstrad-zx-spectrum-plus2b/plus3-2.rom" },
    { id = "sinclair-zx-spectrum-plus3-rom-3", path = "amstrad-zx-spectrum-plus2b/plus3-3.rom" },
]

[[system.firmware]]
variant = "plus3"
files = [
    { id = "amstrad-zx-spectrum-plus3-rom-0", path = "amstrad-zx-spectrum-plus3/plus3-0.rom" },
    { id = "amstrad-zx-spectrum-plus3-rom-1", path = "amstrad-zx-spectrum-plus3/plus3-1.rom" },
    { id = "amstrad-zx-spectrum-plus3-rom-2", path = "amstrad-zx-spectrum-plus3/plus3-2.rom" },
    { id = "amstrad-zx-spectrum-plus3-rom-3", path = "amstrad-zx-spectrum-plus3/plus3-3.rom" },
]

