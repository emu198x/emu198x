[[entry]]
id = "chase-hq-plus3"
title = "Chase H.Q. (+3)"
year = 1989
publisher = "Ocean"
variant = "plus3"

[entry.media]
# +3 disk (DSK format) — exercises the NEC µPD765A FDC code path,
# completely untested in the catalogue until now. Same Ocean Chase HQ
# as the 128K tape entry; lets us A/B compare 128K tape vs +3 disk
# loading paths for the same title.
kind = "disk"
slot = "disk-a"
path = "sinclair/spectrum/Games/[DSK]/Chase H.Q. (1989)(Ocean)(+3).zip"

[entry.boot]
# Captures the canonical +3 boot menu with the DSK already inserted:
#   "128 +3 / Loader / +3 BASIC / Calculator / 48 BASIC /
#    ©1982, 1986, 1987 Amstrad Plc. / Drives A:, B: and M: available."
# The menu is the proof point for the +3 path:
#   - 4-ROM firmware loaded (plus3-{0,1,2,3}.rom)
#   - SpectrumPlus runtime constructed
#   - DSK file parsed via format-amstrad-dsk::parse
#   - Disk inserted via load_disk_image into the NEC µPD765A FDC
#   - Boot reached interactive menu state
# Pushing past the menu requires ENTER on Loader; tested with
# `script[]` press="enter" at_frame=5000, which DOES change the
# screen state (different hash from no-script run), proving ENTER
# is received. The post-Loader-select state stalls at the minimal
# "Loader" bottom-bar without progressing to the actual disk load.
#
# Confirmed 2026-05-06: this stall is NOT a regression. The archived
# Emu198x-Oldest emu-sinclair-zx-spectrum (commit 3f7e4722, "Add ZX
# Spectrum +3 with NEC uPD765 FDC and DSK disk loading") stalls on
# Chase HQ, ACE 2, and Action Fighter at the same Loader screen.
# The +3 ROM `Loader` reads system files (DISK.SYS, etc.) the
# upd765/format-amstrad-dsk path doesn't fully service in either
# codebase. The Insector Hecti / Bustout compat screenshots in the
# archive that show real gameplay are TAP/TZX/Z80 boots, not DSK.
#
# Tracked as a follow-up: needs +3 disk subsystem completion (FDC
# READ ID + sector-by-sector boot block + DISK.SYS load). The menu
# boot is genuine +3 + DSK regression coverage on its own — proves
# 4-ROM firmware, FDC port handling, and DSK parsing.
wait_frames = 8000
frame_hash = "xxh64:4e00d0998410913a"

[entry.audio]
# Menu silent — no music or sound effects.
from_frame = 60
secs = 2.0
hash = "xxh64:c27195d1cabf3150"
