[entry.media]
# Imagine's 1986 Spectrum conversion of Konami's coin-op infiltration
# game. Multiple rips of this title exist; three of them load on our
# chip and two wedge:
#   - Hit Squad 1989 SpeedLock-7 re-release: wedges (block-7 pause
#     1335ms is 435ms below the SpeedLock-7 catalogue norm, fill
#     overruns into pilot tone — see speedlock-tape-incomplete.md).
#   - Plain Imagine 1986 rip: wedges at a different sled ($fbd1).
#   - Imagine 1986 [SpeedLock 2] rip: passes (this entry).
# The [SpeedLock 2] label on the rip is interesting: Head over Heels
# (the canonical Speedlock-2 example) still wedges, but this Green
# Beret rip's Speedlock-2 variant loads cleanly. Either the rip is
# mislabelled or Speedlock-2 has sub-variants that behave differently.
kind = "tape"
slot = "tape-1"
path = "sinclair/spectrum/Games/[TZX]/Green Beret (1986)(Imagine)[SpeedLock 2].zip"

