# ─── +3 disk entries ────────────────────────────────────────────
# 3" floppy titles for the 1987 Amstrad-built +3. Every entry below
# exercises the full µPD765A FDC + DSK / EDSK pipeline end-to-end:
# the +3 BIOS boots its 4-ROM firmware to the interactive menu,
# `autoload_plus3_loader` presses ENTER (Loader option), the FDC
# streams sectors from the parsed disk image, and the protected
# loader unpacks the game into RAM. See
# `wiki/decisions/spectrum-plus3-disk-loading-incomplete.md` for the
# five-bug fix history that made this path work.
#
# Each title was picked to exercise a different copy-protection
# scheme so a regression in any one path surfaces fast:
#   - Ocean Speedlock 7+   → Chase H.Q., Rainbow Islands
#   - Hewson custom loader → Cybernoid, Cybernoid II
#   - Durell speed-up loader → Saboteur II

[[entry]]
id = "chase-hq-plus3"
title = "Chase H.Q. (+3)"
year = 1989
publisher = "Ocean"
variant = "plus3"

[entry.media]
# Speedlock 7+ — the protection that drove the bus_request, drive
# mask, multi-sector ReadData, real-CHRN, and physical-track-lookup
# fixes. Same Ocean Chase H.Q. as the 128K tape entry; lets us A/B
# compare the 128K tape path against the +3 disk path for the same
# title.
kind = "disk"
slot = "disk-a"
path = "sinclair/spectrum/Games/[DSK]/Chase H.Q. (1989)(Ocean)(+3).zip"

[entry.boot]
# Captures the in-game options screen: stage scoreboard at the top
# ("SCORE / TIME / SPEED / GEAR / DISTANCE / STAGE 1 LO"), then the
# CHASE H.Q. logo, "PRESS ENTER FOR OPTIONS", and the dual Ocean
# Software / Taito Corporation copyright lines. This is the post-
# load attract state — the loader streams the title bitmap and
# hands off to the game's own main loop with interrupts enabled.
# Earlier capture (xxh64:13e8354d88a39eb0) was the bare title
# screen the loader paints *before* the full DDAM key sequence
# completes; with the µPD765A's ReadDeletedData + ST1/ST2
# propagation in place, Chase H.Q. now reaches the actual
# ready-to-play state.
wait_frames = 6000
frame_hash = "xxh64:5cf0885094444d92"

[entry.audio]
# Game's main loop now drives the AY chip — title music plays
# during the attract state, so the audio window captures
# something other than silence (the canonical idle pattern from
# the loader-only entries below). Distinct hash from every other
# +3 disk entry because Chase H.Q. is the only one to fully
# reach its post-load audio state.
from_frame = 60
secs = 2.0
hash = "xxh64:67ca80a86daeb33f"

