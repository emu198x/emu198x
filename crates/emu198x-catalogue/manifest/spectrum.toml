# ─── Speedlock-tape cluster ─────────────────────────────────────
# Unlocked 2026-05-13 by the TZX partial-last-byte parser fix (see
# `wiki/decisions/speedlock-tape-incomplete.md`). Speedlock-5 and
# Speedlock-7 protections both fail without the fix because their
# anti-tamper signature byte is delivered via a 0x14 block with
# `bits_in_last_byte = 6` — the parser was reading the lower six
# bits instead of the upper six.

[[entry]]
id = "operation-wolf-tape-speedlock"
title = "Operation Wolf (Speedlock 7)"
year = 1991
publisher = "Hit Squad, The"
variant = "48k"

[entry.media]
# Hit Squad budget re-release of Ocean's 1988 arcade conversion.
# Speedlock 7 protection: encrypted loader at $F48E that decrypts
# in-place, performs pulse-width pre-check against a 14-byte
# threshold table at $FEB4, then runs a bit-shift verifier that
# compares L against $3A — the partial-last-byte gate the parser
# fix unblocks.
kind = "tape"
slot = "tape-1"
path = "sinclair/spectrum/Games/[TZX]/ARCADE COLLECTION 20 - Operation Wolf (1991)(Hit Squad, The)[SpeedLock 7].zip"

[entry.boot]
# Programmer credits scroll: "PROGRAMMING BY ANDREW DEAKIN /
# GRAPHICS BY IVAN HORN" in cyan and white on black, no border —
# the post-load attract before the title screen rolls.
wait_frames = 6000
frame_hash = "xxh64:ee18d332300497af"

[entry.audio]
# Canonical "attract-loop silence" hash. Op Wolf's credit-scroll
# state runs without AY music; verified static at wait_frames 8000
# (same boot+audio hash as 6000). Music plays once the player
# starts a game, which we'd need scripted input to reach.
from_frame = 100
secs = 2.0
hash = "xxh64:d21bc79639a0edde"

