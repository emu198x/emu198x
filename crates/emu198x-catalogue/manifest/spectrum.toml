[[entry]]
id = "turrican-plus3"
title = "Turrican (+3)"
year = 1990
publisher = "Rainbow Arts"
variant = "plus3"

[entry.media]
# Rainbow Arts' shoot-'em-up. Custom +3 disk protection: the
# loader reads track 1's single N=6 (8192-byte) sector with
# recorded ST1.DE | ST2.DD, then stops reading mid-sector (~1100
# of 8192 bytes) and waits for the µPD765A's intrinsic ~2-
# revolution read timeout to force Result phase. The +3 doesn't
# wire the FDC's TC pin (FUSE upd_fdc.c: "in +3 uPD765 never got
# TC"), so silicon timeout is the only abort path. Unblocked by
# `EXEC_READ_TIMEOUT_TICKS` in `nec-upd765a`.
kind = "disk"
slot = "disk-a"
path = "sinclair/spectrum/Games/[DSK]/Turrican (1990)(Rainbow Arts)(+3)(Side A).zip"

