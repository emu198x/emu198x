[package]
name = "emu198x-atari-maria"
description = "Atari 7800 MARIA display processor — zone-based display list renderer"
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["maria", "atari", "7800", "video", "emulator"]
categories = ["emulators"]

[lib]
name = "emu198x_atari_maria"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde-big-array = { workspace = true }

[lints]
workspace = true
