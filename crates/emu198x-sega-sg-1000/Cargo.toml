[package]
name = "emu198x-sega-sg-1000"
description = "Sega SG-1000 / SC-3000 headless runner with shell-backed script + MCP parity — Z80 + TMS9918A + SN76489A"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "emu198x-sega-sg-1000"
path = "src/main.rs"

[features]
# UI mode is on by default for interactive / dev builds. The headless
# screenshot / script pipeline builds with `--no-default-features` to skip the
# shared `emu198x-ui` harness (winit + wgpu) — `--script` and `--mcp` still
# work; the default UI path errors out with a "rebuild with --features ui"
# message.
default = ["ui"]
ui = ["dep:emu198x-ui"]

[dependencies]
emu198x-shell = { path = "../emu198x-shell", version = "0.2.0" }
emu198x-ui = { path = "../emu198x-ui", version = "0.2.0", optional = true }
machine-sega-sg-1000 = { path = "../machine-sega-sg-1000", version = "0.2.0" }
png = { workspace = true }
runtime-sega-sg-1000 = { path = "../runtime-sega-sg-1000", version = "0.2.0" }
serde_json = { workspace = true }

[lints]
workspace = true
