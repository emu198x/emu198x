[package]
name = "emu198x-sord-m5"
description = "Sord M5 headless runner with shell-backed script + MCP parity — Z80 + TMS9918A + SN76489A"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "emu198x-sord-m5"
path = "src/main.rs"

[features]
# UI mode is on by default for interactive / dev builds. The headless
# screenshot / script pipeline builds with `--no-default-features` to skip the
# shared `emu198x-ui` harness (winit + wgpu) — `--script` and `--mcp` still
# work; the default UI path errors out with a "rebuild with --features ui"
# message.
default = ["ui"]
ui = ["dep:emu198x-ui"]

[dependencies]
emu198x-shell = { path = "../emu198x-shell", version = "0.2.0" }
emu198x-ui = { path = "../emu198x-ui", version = "0.2.0", optional = true }
machine-sord-m5 = { path = "../machine-sord-m5", version = "0.2.0" }
png = { workspace = true }
runtime-sord-m5 = { path = "../runtime-sord-m5", version = "0.2.0" }
serde_json = { workspace = true }
zilog-z80 = { path = "../zilog-z80", version = "0.2.0" }

[lints]
workspace = true
