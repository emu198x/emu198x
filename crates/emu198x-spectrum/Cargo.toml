[package]
name = "emu198x-spectrum"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# UI mode is on by default for interactive / dev builds. Code198x's
# headless screenshot/video pipeline builds with `--no-default-features`
# to skip the shared `emu198x-ui` harness (winit + wgpu + muda) — the
# `--script` and `--mcp` modes still work, only `--ui` errors out at
# runtime with a "rebuild with --features ui" message.
default = ["ui"]
ui = ["dep:emu198x-ui"]

[dependencies]
common-sinclair-zx-spectrum = { path = "../common-sinclair-zx-spectrum", version = "0.2.0" }
emu198x-shell = { path = "../emu198x-shell", version = "0.2.0" }
emu198x-ui = { path = "../emu198x-ui", version = "0.2.0", optional = true }
format-sinclair-zx-spectrum-bas = { path = "../format-sinclair-zx-spectrum-bas", version = "0.2.0" }
format-sinclair-zx-spectrum-sna = { path = "../format-sinclair-zx-spectrum-sna", version = "0.2.0" }
format-sinclair-zx-spectrum-szx = { path = "../format-sinclair-zx-spectrum-szx", version = "0.2.0" }
format-sinclair-zx-spectrum-z80 = { path = "../format-sinclair-zx-spectrum-z80", version = "0.2.0" }
runtime-sinclair-zx-spectrum = { path = "../runtime-sinclair-zx-spectrum", version = "0.2.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
zilog-z80 = { path = "../zilog-z80", version = "0.2.0" }

[lints]
workspace = true

# `publish = false` (added in 63fac19e) keeps this off crates.io but also
# hides it from cargo-dist, which owns the GitHub Release. `dist = true`
# restores it without publishing.
[package.metadata.dist]
dist = true
