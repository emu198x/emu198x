[package]
name = "emu198x-spectrum"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# UI mode is on by default for interactive / dev builds. Code198x's
# headless screenshot/video pipeline builds with `--no-default-features`
# to skip the heavy graphics stack (winit + wgpu + muda) — the
# `--script` and `--mcp` modes still work, only `--ui` errors out at
# runtime with a "rebuild with --features ui" message.
#
# muda is target-specific (non-Linux only) — its 0.19.x line does not
# compile on Linux with default-features = false, and the Linux GTK
# backend was intentionally disabled at the workspace dep level to
# dodge a Dependabot alert (glib 0.18.x VariantStrIter unsoundness).
# Linux gets a no-op stub menu implementation; menus aren't wired up
# on Linux yet anyway (`init_for_gtk_window` is a track-1c TODO).
default = ["ui"]
ui = ["dep:emu198x-native-video", "dep:rfd", "dep:winit"]

[dependencies]
common-sinclair-zx-spectrum = { path = "../common-sinclair-zx-spectrum" }
emu198x-native-video = { path = "../emu198x-native-video", optional = true }
emu198x-shell = { path = "../emu198x-shell" }
format-sinclair-zx-spectrum-bas = { path = "../format-sinclair-zx-spectrum-bas" }
format-sinclair-zx-spectrum-sna = { path = "../format-sinclair-zx-spectrum-sna" }
format-sinclair-zx-spectrum-z80 = { path = "../format-sinclair-zx-spectrum-z80" }
rfd = { workspace = true, optional = true }
runtime-sinclair-zx-spectrum = { path = "../runtime-sinclair-zx-spectrum" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
winit = { workspace = true, optional = true }
zilog-z80 = { path = "../zilog-z80" }

[target.'cfg(not(target_os = "linux"))'.dependencies]
muda = { workspace = true }

[lints]
workspace = true
