[package]
name = "emu198x-atari-800xl"
description = "Atari 800XL headless runner with shell-backed script + MCP parity — 6502C Sally + ANTIC + GTIA + POKEY + PIA-6520"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "emu198x-atari-800xl"
path = "src/main.rs"

[features]
# UI mode is on by default for interactive / dev builds. The headless
# screenshot / script pipeline builds with `--no-default-features` to skip the
# shared `emu198x-ui` harness (winit + wgpu) — `--script` and `--mcp` still
# work; the default UI path errors out with a "rebuild with --features ui"
# message.
default = ["ui"]
ui = ["dep:emu198x-ui"]

[dependencies]
emu198x-shell = { path = "../emu198x-shell", version = "0.22.0" }
atari-gtia = { path = "../atari-gtia", version = "0.22.0" }
emu198x-ui = { path = "../emu198x-ui", version = "0.22.0", optional = true }
machine-atari-800xl = { path = "../machine-atari-800xl", version = "0.22.0" }
png = { workspace = true }
runtime-atari-800xl = { path = "../runtime-atari-800xl", version = "0.22.0" }
serde_json = { workspace = true }

[dev-dependencies]
emu198x-test-skip = { path = "../emu198x-test-skip", version = "0.22.0" }

[lints]
workspace = true

# `publish = false` (added in 63fac19e) keeps this off crates.io but also
# hides it from cargo-dist, which owns the GitHub Release. `dist = true`
# restores it without publishing.
[package.metadata.dist]
dist = true
