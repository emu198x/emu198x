[package]
name = "motorola-68030"
description = "Motorola 68030 CPU — adds the on-chip MMU (PMMU/ATC), data cache, and burst fill on top of the 68020. Skeleton crate: re-exports the shared 68k core with a 68030-specific type alias and surfaces the MMU types. Not exercised by any active machine today."
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[dependencies]
motorola-68k-common = { path = "../motorola-68k-common", version = "0.17.0" }
motorola-68000 = { path = "../motorola-68000", version = "0.17.0" }
motorola-68010 = { path = "../motorola-68010", version = "0.17.0" }
motorola-68020 = { path = "../motorola-68020", version = "0.17.0" }
serde = { workspace = true }

[dev-dependencies]
emu198x-test-skip = { path = "../emu198x-test-skip", version = "0.17.0" }
rmp-serde = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true
