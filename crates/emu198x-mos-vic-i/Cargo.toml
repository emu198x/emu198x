[package]
name = "emu198x-mos-vic-i"
description = "MOS Technology 6560 (NTSC) / 6561 (PAL) — VIC chip used by the VIC-20, handling video and audio. Extracted from machine-commodore-vic-20."
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["6560", "6561", "vic", "vic-20", "emulator"]
categories = ["emulators"]

[dependencies]
serde = { workspace = true }

[lints]
workspace = true
