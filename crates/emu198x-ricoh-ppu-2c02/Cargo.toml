[package]
name = "emu198x-ricoh-ppu-2c02"
description = "Ricoh 2C02 PPU — dot-level NES picture processing unit. One tick() = one PPU dot. Background tile pipeline, sprite evaluation with hardware overflow bug, loopy scroll registers, NMI timing with 2-dot pipeline delay, odd-frame skip."
edition.workspace = true
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.1"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["nes", "ppu", "video", "ricoh", "emulator"]
categories = ["emulators"]

[dependencies]
serde = { workspace = true }
serde-big-array = { workspace = true }

[lints]
workspace = true
