[package]
name = "emu198x-snk-lspc2"
description = "SNK LSPC2 video chip and palette: 381 shrinking sprite strips and the fix layer, line-stepped — SNK Neo Geo"
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["lspc2", "neo-geo", "sprites", "video", "emulator"]
categories = ["emulators"]

[dependencies]
serde = { workspace = true }

[dev-dependencies]
postcard = { workspace = true }

[lints]
workspace = true
