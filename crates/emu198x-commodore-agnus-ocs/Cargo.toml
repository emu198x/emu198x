[package]
name = "emu198x-commodore-agnus-ocs"
description = "Commodore Agnus OCS — DMA controller, beam generator, copper coprocessor. Per-CCK (colour clock) DMA slot allocation matching real hardware arbitration."
edition.workspace = true
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["agnus", "amiga", "dma", "copper", "emulator"]
categories = ["emulators"]

[dependencies]
serde = { workspace = true }

[lints]
workspace = true
