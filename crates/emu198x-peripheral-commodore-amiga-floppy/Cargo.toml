[package]
name = "emu198x-peripheral-commodore-amiga-floppy"
description = "Amiga floppy drive mechanism — head positioning, motor control, disk change detection, MFM track encoding."
edition.workspace = true
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["amiga", "floppy", "mfm", "disk", "emulator"]
categories = ["emulators"]

[dependencies]
format198x-commodore-amiga-adf = "0.3.0"
serde = { workspace = true }

[lints]
workspace = true
