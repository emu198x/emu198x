[package]
name = "emu198x-scorpion-ula"
description = "Scorpion ZS-256 ULA — Russian extended Spectrum, no contention, 48K-style geometry"
edition.workspace = true
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.1.0"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["zx-spectrum", "ula", "scorpion", "video", "emulator"]
categories = ["emulators"]

[dependencies]
serde = { workspace = true }
emu198x-bus-sinclair-zx-spectrum = { path = "../emu198x-bus-sinclair-zx-spectrum", version = "0.1.0" }
emu198x-sinclair-zx-spectrum-ula = { path = "../emu198x-sinclair-zx-spectrum-ula", version = "0.1.0" }

[lints]
workspace = true
