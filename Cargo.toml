[workspace]
resolver = "2"
members = [
    # Active members
    "crates/common-commodore-c64",
    "crates/common-commodore-iec",
    "crates/common-sinclair-zx-spectrum",
    "crates/emu198x-c64",
    "crates/emu198x-script-nes",
    "crates/emu198x-spectrum",
    "crates/emu198x-script-c64",
    "crates/emu198x-script-spectrum",
    "crates/emu198x-shell",
    "crates/ferranti-ula-6c001e",
    "crates/format-commodore-c64-bas",
    "crates/format-commodore-c64-d64",
    "crates/format-commodore-c64-prg",
    "crates/format-commodore-c64-tap",
    "crates/format-commodore-c64-t64",
    "crates/format-commodore-amiga-adf",
    "crates/format-nintendo-nes-ines",
    "crates/format-sinclair-zx-spectrum-tap",
    "crates/format-sinclair-zx-spectrum-tzx",
    "crates/machine-commodore-amiga-ocs",
    "crates/machine-commodore-c64",
    "crates/machine-commodore-1541",
    "crates/machine-nintendo-nes",
    "crates/machine-sinclair-zx-spectrum-48k",
    "crates/mos-6502",
    "crates/mos-cia-6526",
    "crates/mos-cia-8520",
    "crates/commodore-paula-8364",
    "crates/commodore-agnus-ocs",
    "crates/commodore-denise-ocs",
    "crates/peripheral-commodore-amiga-floppy",
    # Keyboard archive — included during Phase 1 of the keyboard port
    # so characterisation tests can run against archive behaviour.
    # Renamed to `peripheral-commodore-amiga-keyboard` at Phase 3.
    "crates/peripheral-commodore-amiga-keyboard-archive",
    "crates/mos-sid-6581",
    "crates/mos-via-6522",
    "crates/mos-vic-ii",
    "crates/motorola-68000",
    "crates/ricoh-apu-2a03",
    "crates/ricoh-ppu-2c02",
    "crates/runtime-commodore-c64",
    "crates/runtime-nintendo-nes",
    "crates/runtime-sinclair-zx-spectrum",
    "crates/zilog-z80",
]
exclude = [
    # Archived Amiga crates from the pre-restart implementation. Kept
    # in tree for reference (see wiki/decisions/amiga-restart-plan.md);
    # excluded from the build.
    "crates/commodore-gary-archive",
    "crates/emu198x-script-amiga-archive",
    "crates/machine-commodore-amiga-archive",
    "crates/runtime-commodore-amiga-archive",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-2.0-or-later"

[workspace.dependencies]
cpal = "0.15"
pixels = "0.15"
png = "0.17"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
serde_json = "1"
thiserror = "2"
winit = "0.30"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
