# Standalone dev tool that compiles Musashi (C) in its build.rs. Kept
# out of the workspace so `cargo build/clippy --workspace` (and CI,
# notably the Windows runner) never tries to build the C dependency.
# Build/run it explicitly via its own manifest path.
exclude = ["tools/m68k-test-gen"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "GPL-2.0-or-later"
repository = "https://github.com/emu198x/emu198x"

[workspace.dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
cpal = "0.18"
flate2 = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
gilrs = "0.11"
# muda 0.19 gates its Linux GTK backend behind the `gtk` feature
# (default-on upstream). We disable it because we don't yet wire native
# menus on Linux (the `init_for_gtk_window` path is the `track-1c` TODO
# in `crates/emu198x-spectrum/src/ui/menu.rs`), and dropping the
# feature removes the entire gtk3-rs subtree — closing Dependabot
# alert #1 (glib 0.18.x unsoundness in `VariantStrIter`) and the
# libxdo-dev CI install. When Linux menus actually land, re-enable
# the feature (and reopen the alert decision) or switch to a gtk4
# backend if muda upstream ships one. See
# `knowledge/decisions/native-menu-shell.md`.
muda = { version = "=0.19.3", default-features = false }
pollster = "0.4"
png = "0.18"
rfd = "0.17"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
serde_json = "1"
thiserror = "2"
toml = "1.1"
twox-hash = { version = "2.1", default-features = false, features = ["std", "xxhash64"] }
wgpu = "29"
winit = "0.30"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.dev]
# Line tables give backtraces without the full-debuginfo link tax — the
# biggest cargo test cost once a workspace grows many test binaries. This is
# the shared 198x skeleton lever (see ../decisions/project-skeleton-standard.md).
# Emu198x predates that standard, so it never picked the lever up — which is why
# its target/debug bloated. Backfilled here to match the siblings.
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
lto = "thin"
codegen-units = 1

# cargo-dist release configuration. The generated workflow lives at
# .github/workflows/release.yml; regenerate with `dist generate` after
# editing this section. A `v*` tag push triggers a build of the six
# native verifier shells (emu198x-{spectrum,c64,amiga,dragon,game-boy,nes})
# across four targets and attaches the archives to a GitHub Release.
# The catalogue tool opts out
# of the release via `dist = false` in its own Cargo.toml.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = []
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
pr-run-mode = "plan"
# Dependabot keeps the `actions/*` pins in the generated release.yml current
# (e.g. checkout v6 -> v7 in #589). cargo-dist's own template lags those bumps,
# so without this its `plan` check fails on every PR ("release.yml out of date").
# `allow-dirty = ["ci"]` tells dist to accept the externally-maintained CI file.
allow-dirty = ["ci"]

# Linux build deps. cpal needs ALSA dev headers; gilrs needs libudev.
# macOS and Windows pull native equivalents from the OS — no extra
# install needed there.
[workspace.metadata.dist.dependencies.apt]
libasound2-dev = { version = "*", stage = ["build"] }
libudev-dev = { version = "*", stage = ["build"] }
pkg-config = { version = "*", stage = ["build"] }

[profile.dist]
inherits = "release"
lto = "thin"
