[workspace]
resolver = "2"
members = [
    "crates/common-sinclair-zx-spectrum",
    "crates/emu198x-shell",
    "crates/ferranti-ula-6c001e",
    "crates/machine-sinclair-zx-spectrum-48k",
    "crates/runtime-sinclair-zx-spectrum",
    "crates/zilog-z80",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
