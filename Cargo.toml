[workspace]
resolver = "2"
members = [
    # Active members
    "crates/common-commodore-c64",
    "crates/common-commodore-iec",
    "crates/common-nintendo-game-boy",
    "crates/amstrad-ula-40077",
    "crates/beta-disk-interface",
    "crates/common-sinclair-zx-spectrum",
    "crates/emu198x-c64",
    "crates/emu198x-script-nes",
    "crates/emu198x-spectrum",
    "crates/emu198x-script-c64",
    "crates/emu198x-script-spectrum",
    "crates/emu198x-shell",
    "crates/ferranti-ula-6c001e",
    "crates/format-commodore-c64-bas",
    "crates/format-commodore-c64-d64",
    "crates/format-commodore-c64-prg",
    "crates/format-commodore-c64-tap",
    "crates/format-commodore-c64-t64",
    "crates/format-amstrad-dsk",
    "crates/format-commodore-amiga-adf",
    "crates/format-nintendo-nes-ines",
    "crates/format-sinclair-zx-spectrum-tap",
    "crates/format-sinclair-zx-spectrum-tzx",
    "crates/format-sinclair-zx-spectrum-z80",
    "crates/gi-ay-3-8912",
    "crates/machine-commodore-amiga-ocs",
    "crates/machine-commodore-c64",
    "crates/machine-commodore-1541",
    "crates/machine-nintendo-nes",
    "crates/machine-sinclair-zx-spectrum-48k",
    "crates/machine-pentagon-128",
    "crates/machine-scorpion-zs256",
    "crates/machine-timex-tc2048",
    "crates/machine-timex-ts2068",
    "crates/machine-sinclair-zx-spectrum-128k",
    "crates/machine-sinclair-zx-spectrum-plus",
    "crates/mos-6502",
    "crates/mos-cia-6526",
    "crates/mos-cia-8520",
    "crates/commodore-paula-8364",
    "crates/commodore-agnus-ocs",
    "crates/commodore-denise-ocs",
    "crates/peripheral-commodore-amiga-floppy",
    "crates/peripheral-commodore-amiga-keyboard",
    "crates/commodore-gary",
    "crates/commodore-amiga-autoconfig",
    "crates/runtime-commodore-amiga",
    "crates/emu198x-script-amiga",
    "crates/mos-sid-6581",
    "crates/mos-via-6522",
    "crates/mos-vic-ii",
    "crates/motorola-68000",
    "crates/nec-upd765a",
    "crates/nintendo-game-boy-apu",
    "crates/nintendo-game-boy-ppu",
    "crates/nintendo-game-boy-timer",
    "crates/pentagon-ula",
    "crates/scorpion-ula",
    "crates/sharp-lr35902",
    "crates/timex-scld",
    "crates/ricoh-apu-2a03",
    "crates/ricoh-ppu-2c02",
    "crates/runtime-commodore-c64",
    "crates/runtime-nintendo-nes",
    "crates/runtime-sinclair-zx-spectrum",
    "crates/sinclair-ula-7k010e",
    "crates/zilog-z80",
]
exclude = [
    # Pre-restart A500 machine implementation. Intentionally kept in
    # tree as historical reference — `wiki/decisions/amiga-restart-
    # plan.md` and `wiki/decisions/amiga-chip-only-boot-failure.md`
    # cite file:line coordinates into it. The CIA / Paula / Agnus /
    # Blitter / Denise / Floppy / Keyboard / Gary / Runtime /
    # Script-amiga ports all completed under the archive-port
    # methodology; this archive was wholesale replaced by
    # `machine-commodore-amiga-ocs` rather than ported piecewise, so
    # it retires by deletion rather than promotion and we're holding
    # that until the referenced decision records age out.
    "crates/machine-commodore-amiga-archive",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-2.0-or-later"

[workspace.dependencies]
cpal = "0.15"
pixels = "0.15"
png = "0.17"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
serde_json = "1"
thiserror = "2"
winit = "0.30"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
