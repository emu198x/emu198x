exclude = [
    # Pre-restart A500 machine implementation. Intentionally kept in
    # tree as historical reference — `wiki/decisions/amiga-restart-
    # plan.md` and `wiki/decisions/amiga-chip-only-boot-failure.md`
    # cite file:line coordinates into it. The CIA / Paula / Agnus /
    # Blitter / Denise / Floppy / Keyboard / Gary / Runtime /
    # Script-amiga ports all completed under the archive-port
    # methodology; this archive was wholesale replaced by
    # `machine-commodore-amiga-ocs` rather than ported piecewise, so
    # it retires by deletion rather than promotion and we're holding
    # that until the referenced decision records age out.
    "crates/machine-commodore-amiga-archive",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-2.0-or-later"

[workspace.dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
cpal = "0.17"
gilrs = "0.11"
# muda 0.19 gates its Linux GTK backend behind the `gtk` feature
# (default-on upstream). We disable it because we don't yet wire native
# menus on Linux (the `init_for_gtk_window` path is the `track-1c` TODO
# in `crates/emu198x-spectrum/src/ui/menu.rs`), and dropping the
# feature removes the entire gtk3-rs subtree — closing Dependabot
# alert #1 (glib 0.18.x unsoundness in `VariantStrIter`) and the
# libxdo-dev CI install. When Linux menus actually land, re-enable
# the feature (and reopen the alert decision) or switch to a gtk4
# backend if muda upstream ships one. See
# `wiki/decisions/native-menu-shell.md`.
muda = { version = "0.19", default-features = false }
pollster = "0.4"
png = "0.18"
rfd = "0.17"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
serde_json = "1"
thiserror = "2"
toml = "1.1"
twox-hash = { version = "2.1", default-features = false, features = ["std", "xxhash64"] }
wgpu = "0.19"
winit = "0.30"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
