[workspace]
resolver = "2"
members = [
    "crates/common-sinclair-zx-spectrum",
    "crates/emu-spectrum",
    "crates/emu198x-script-spectrum",
    "crates/emu198x-shell",
    "crates/ferranti-ula-6c001e",
    "crates/format-sinclair-zx-spectrum-tap",
    "crates/format-sinclair-zx-spectrum-tzx",
    "crates/machine-sinclair-zx-spectrum-48k",
    "crates/runtime-sinclair-zx-spectrum",
    "crates/zilog-z80",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
cpal = "0.15"
pixels = "0.15"
png = "0.17"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
winit = "0.30"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
