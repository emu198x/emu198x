# Standalone dev tool — deliberately NOT a workspace member (see the
# `exclude` entry in the root Cargo.toml). It compiles Musashi (C) via
# build.rs, which we don't want CI to build on every workspace command
# (notably the Windows runner). Build/run it explicitly:
#
#   cargo run --manifest-path tools/m68k-test-gen/Cargo.toml -- \
#       --cpu 68020 --instruction CHK2 --count 2000 \
#       --out <assets>/test-suites/m68k-generated/m68020/v1
#
# Adapted from Emu198x-Oldest/crates/m68k-test-gen (frozen donor); it
# uses Musashi as the reference oracle and emits Tom Harte-format
# MessagePack fixtures the motorola-680x0 `tom_harte` harnesses consume.
#
# Run its tests single-threaded — the Musashi binding uses a process-wide
# global memory (its C callbacks have nowhere else to read/write), so
# parallel tests race across modules:
#
#   cargo test --manifest-path tools/m68k-test-gen/Cargo.toml -- --test-threads=1
[package]
name = "m68k-test-gen"
description = "Test vector generator for Motorola 680x0 CPUs using Musashi as reference"
version = "0.2.0"
edition = "2024"
license = "GPL-2.0-or-later"

[[bin]]
name = "m68k-test-gen"
path = "src/main.rs"

[dependencies]
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
rand = "0.9"

[build-dependencies]
cc = "1"
