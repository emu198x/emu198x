[package]
name = "emu198x-spectrum-composite-experiment"
version = "0.1.0"
edition = "2024"
publish = false

# An offline experiment, deliberately outside the production workspace.
[workspace]

[dependencies]
wgpu = "30"
pollster = "1.0"

[[bin]]
name = "composite-experiment"
path = "src/main.rs"

[[bin]]
name = "render-crt"
path = "src/render_crt.rs"

[[bin]]
name = "decode-gpu"
path = "src/decode_gpu.rs"
