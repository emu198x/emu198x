[entry.audio]
# Title attract is silent at this 2 s window.
from_frame = 60
secs = 2.0
hash = "xxh64:f6389c53ba66240d"

[[entry]]
id = "bad-dudes-ecs"
title = "Bad Dudes vs. Dragon Ninja (ECS A500+)"
year = 1989
publisher = "Imagine"
variant = "a500-plus-ecs-pal"

[entry.media]
# OCS-era arcade port (Imagine 1989) running on the ECS A500+ chip
# stack with Kickstart 2.04. Validates that the ECS chip stack
# (Agnus 8375 / Denise 8373 / 1 MiB chip RAM) runs an older OCS
# game end-to-end via the trackloader. The disk-load fix in commit
# 504ada6 (floppy spin-up regression) was needed for KS 2.04 to read
# the boot block at all.
kind = "disk"
slot = "floppy-0"
path = "commodore-amiga/Bad Dudes vs. Dragon Ninja (1989)(Imagine)[cr OCL][t +3 OCL].zip"

[[entry.startup]]
# The OCL release screen responds once normal MFM pacing has reached it.
# RETURN opens the trainer menu.
action = "wait_frames"
frames = 7000

[[entry.startup]]
action = "press_key"
key = "return"

[[entry.startup]]
# The trainer menu's own RETURN action begins the game.
# One release-observation frame follows the first three-frame key hold. The
# remaining wait retains the established frame-12500 second input point.
action = "wait_frames"
frames = 5496

[[entry.startup]]
action = "press_key"
key = "return"

[entry.boot]
wait_frames = 7999
# Actual Imagine DRAGON NINJA title/credits sequence after leaving both the
# release screen and trainer menu. This is the ECS real-software waypoint.
frame_hash = "xxh64:6960ab0c86578a58"

[entry.audio]
# The title sequence is silent at this measured window.
from_frame = 60
secs = 2.0
hash = "xxh64:f6389c53ba66240d"

[[entry]]
id = "workbench-3.1-desktop"
title = "Amiga Workbench 3.1 desktop boot (AGA A1200)"
year = 1996
publisher = "ESCOM"
variant = "a1200-aga-pal"

[entry.media]
# Bootable Workbench disk from the six-disk 3.1 set. This row exercises
# the stock A1200's 68EC020, Alice/Lisa display path and 2 MiB chip RAM.
kind = "disk"
slot = "floppy-0"
path = "commodore-amiga/workbench-3.1.adf"

[entry.boot]
# The complete desktop is present at frame 1800. The 768 x 576 catalogue
# capture crops pixel-exactly to the reviewed 752 x 572 A1200 golden. This
# baseline includes the corrected Lisa bitplane/DIW phase and retains the
# independently clocked pointer without an ignored region.
wait_frames = 1800
frame_hash = "xxh64:bf5386b4b59c8528"

[entry.audio]
# Workbench is silent at the measured window.
from_frame = 60
secs = 2.0
hash = "xxh64:f6389c53ba66240d"

[[entry]]
id = "banshee-demo-aga"
title = "Banshee playable demo (AGA)"
year = 1994
publisher = "Core Design"
variant = "a1200-aga-pal"

[entry.media]
kind = "disk"
slot = "floppy-0"
path = "commodore-amiga/Banshee (demo-playable) (1994)(Core)(AGA)[cr ATX].zip"

[[entry.startup]]
# Dismiss the Anthrox release screen only after its loader is active.
action = "wait_frames"
frames = 6500

[[entry.startup]]
action = "click_mouse"
button = "left"

[entry.boot]
wait_frames = 5700
# Settled POWERUPS instruction page. Samples taken every 100 frames from 5300
# through 6100 were identical; this midpoint is 400 frames from both endpoints.
# After the Lisa bitplane/DIW correction, the old x=0..765 region equals the
# corrected x=2..767 region exactly. The full-frame hash retains that two-host-
# sample phase change. This exercises an AGA-only title beyond its release
# screen; independent pixel accuracy remains bounded by the Test Kit cases.
frame_hash = "xxh64:67b5a4958c46955c"

[entry.audio]
# The Banshee preview soundtrack is active in stereo at this window.
from_frame = 60
secs = 2.0
hash = "xxh64:e80049171d171254"

