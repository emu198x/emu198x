[[entry]]
id = "workbench-1.3-desktop"
title = "Amiga Workbench 1.3 desktop boot"
year = 1988
publisher = "Commodore"
variant = "a500-ocs-pal-a501"

[entry.media]
# DF0 floppy slot. The runtime auto-DMAs the boot block off the disk
# once Kickstart reaches the insert-disk screen.
kind = "disk"
slot = "floppy-0"
path = "commodore-amiga/workbench-1.3.adf"

[entry.boot]
# Correct normal MFM pacing reaches the reviewed Workbench desktop at
# frame 3500. The catalogue uses that stable post-startup waypoint rather
# than sampling an intermediate AmigaDOS window whose cursor position
# depends on how much of the startup sequence has loaded.
wait_frames = 3500
frame_hash = "xxh64:d04f967ff00ab933"
# Workbench's allocator-derived free-memory value can change in 16-byte
# allocation quanta around this capture boundary. Exclude only its six digits;
# the rest of the full 768 x 576 frame remains part of the exact hash.
ignore_rects = [{ x = 278, y = 38, width = 50, height = 18 }]

[entry.audio]
# Workbench desktop has no music or sound effects.
from_frame = 60
secs = 2.0
hash = "xxh64:f6389c53ba66240d"

[[entry]]
id = "workbench-2.04-desktop"
title = "Amiga Workbench 2.04 desktop boot (ECS A500+)"
year = 1991
publisher = "Commodore"
variant = "a500-plus-ecs-pal"

[entry.media]
# DF0 floppy slot. The ECS A500+ uses Kickstart 2.04 + Workbench 2.04.
# Different chip stack to OCS A500 (Agnus 8375 / Denise 8373 / 1 MiB
# chip RAM); validates the ECS path end-to-end.
kind = "disk"
slot = "floppy-0"
path = "commodore-amiga/workbench-2.04.adf"

[entry.boot]
# WB 2.04 boot is longer than the original catalogue waypoint. The boot
# block loads, the OS brings up libraries, and the AmigaDOS startup-sequence
# runs. With
# the floppy spin-up regression fixed (peripheral-commodore-amiga-
# floppy 2026-05-05) the disk loads cleanly and we land on the
# canonical "KeyMap Selection" prompt the WB 2.04 startup-sequence
# raises when no Extras disk is in DF1:
#   "KeyMap Selection / This procedure will copy a selected keymap
#    from the Extras disk onto your Workbench disk. / Please ensure
#    that you are working with a copy of your Workbench disk. / Do
#    you wish to continue? (1 = Yes / 0 = No)"
# This is the strongest single-frame proof that WB 2.04 actually
# booted: it requires the boot block to have run, libraries to have
# initialised, and the startup-sequence script to have executed.
wait_frames = 2500
frame_hash = "xxh64:7f328097710b32b5"

[entry.audio]
# Workbench desktop has no music or sound effects.
from_frame = 60
secs = 2.0
hash = "xxh64:f6389c53ba66240d"

[[entry]]
id = "barbarian"
title = "Barbarian - The Ultimate Warrior"
year = 1988
publisher = "Palace"
variant = "a500-ocs-pal-a501"

[entry.media]
# OCS A500 boot-block trackloaded game (cracker release, pre-extracted
# to .adf). Validates the trackloader path beyond Workbench.
kind = "disk"
slot = "floppy-0"
path = "commodore-amiga/Barbarian - The Ultimate Warrior (1988)(Palace)[cr BS1 - TKT - INA].zip"

[[entry.startup]]
# Correct normal MFM pacing reaches the BSO intro after the old frame-1500
# input point. Click the left mouse button once the intro is visibly active.
# The May fixture called this joystick FIRE, but the then-swapped CIA-A fire
# lines meant that event actually asserted the mouse-port button.
action = "wait_frames"
frames = 6500

[[entry.startup]]
action = "click_mouse"
button = "left"

[entry.boot]
# After the click the BSO cracker intro hands off to the actual Palace
# Barbarian title. wait_frames covers the post-click load.
# Captures the canonical "BARBARIAN" title (Palace logo + score
# header + snake-coiled tree pillars) during its demonstration loop.
wait_frames = 4999
frame_hash = "xxh64:da26789277ea081e"

[entry.audio]
# The demonstration loop is audibly active at this window.
from_frame = 60
secs = 2.0
hash = "xxh64:d583c66c852360ee"

[[entry]]
id = "1943"
title = "1943 - The Battle of Midway"
year = 1989
publisher = "GO!"
variant = "a500-ocs-pal-a501"

[entry.media]
# OCS A500 single-disk Capcom arcade port (PNA = Paranoimia cracker
# release). Different publisher + different cracker group + different
# mod tune than Barbarian — broader validation of the trackloader
# and Paula audio paths.
kind = "disk"
slot = "floppy-0"
path = "commodore-amiga/1943 - The Battle of Midway (1989)(GO!)[cr PNA].zip"

[[entry.startup]]
# Correct normal MFM pacing reaches the Paranoimia intro after the old
# frame-1500 input point. As with Barbarian, this release screen polls
# the left mouse button rather than the port-2 joystick fire line.
action = "wait_frames"
frames = 6500

[[entry.startup]]
action = "click_mouse"
button = "left"

[entry.boot]
# After the click the Paranoimia cracker intro hands off to the actual
# 1943 game. wait_frames covers the post-click load. Captures the
# canonical 1943 title: "1943™ / THE BATTLE OF MIDWAY / F1 - ONE
# PLAYER / Joystick control only / PRESS FIRE ON JOYSTICK TO START
# / © 1987 CAPCOM".
wait_frames = 4999
frame_hash = "xxh64:99d5044f70a3bb21"

[entry.audio]
# Title attract sequence — silent at this 2 s window (waiting for
# joystick FIRE to start the game).
from_frame = 60
secs = 2.0
hash = "xxh64:f6389c53ba66240d"

