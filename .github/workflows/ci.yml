name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        # libasound2-dev: audio (cpal). libudev-dev: gamepad enumeration
        # via gilrs for the host-input layer. libgtk-3-dev: native menus
        # via muda (transitively pulls in libglib2.0-dev). libxdo-dev:
        # muda's accelerator-handling layer links against libxdo on X11.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libgtk-3-dev libxdo-dev

      - name: Read pinned toolchain
        # Single source of truth across local + CI is
        # rust-toolchain.toml. dtolnay/rust-toolchain@master no longer
        # auto-reads the file, so we extract the channel here and
        # pass it explicitly. Update rust-toolchain.toml only.
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  zex:
    name: ZEXDOC + ZEXALL
    runs-on: ubuntu-latest
    # Frank Cringle's Z80 exerciser. Long-running (tens of minutes in
    # release on the GitHub runner) but hermetic — `.com` corpus is
    # checked in at test-data/zex/. Parallel to the main rust job so it
    # doesn't slow PR feedback on lint / unit tests.

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read pinned toolchain
        # See note in the rust job above.
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: zex

      - name: Run ZEXDOC + ZEXALL
        run: cargo test --release -p zilog-z80 --test zex_tests -- --include-ignored --nocapture
