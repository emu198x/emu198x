name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format and lint run as separate jobs so the workflow summary
  # surfaces them independently. Both are fast (no test compile);
  # heavier downstream jobs gate on both passing.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        # Single source of truth across local + CI is
        # rust-toolchain.toml. dtolnay/rust-toolchain@master no longer
        # auto-reads the file, so we extract the channel here and
        # pass it explicitly. Update rust-toolchain.toml only.
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        # libasound2-dev: audio (cpal). libudev-dev: gamepad enumeration
        # via gilrs for the host-input layer. muda's GTK backend is
        # disabled at the workspace dep level (see workspace `muda`
        # entry in the root Cargo.toml), so libgtk-3-dev / libxdo-dev
        # aren't needed any more — restore them if Linux native menus
        # are wired up.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Read pinned toolchain
        # See note in the fmt job above.
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Cross-platform smoke build. Catches platform-specific compile
  # regressions on macOS (primary dev host) and Windows without
  # paying the cost of a full test run on those OSes. The full test
  # suite still runs only on Linux via the coverage job below; this
  # job only proves the workspace compiles. cpal and gilrs each pick
  # up native audio/gamepad backends on macOS and Windows, so no
  # platform-specific install is needed outside Linux.
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.os }}

      - name: Build workspace
        run: cargo check --workspace --all-targets

  # The coverage job is the workspace's only test runner — cargo
  # llvm-cov compiles every test binary with `-C instrument-coverage`
  # and runs them, so we get both regression coverage AND coverage
  # metrics in one pass. Gated on fmt + clippy so a fast lint failure
  # doesn't waste a slow coverage compile.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    env:
      # SOLID criterion 11 targets ≥90% but we ratchet up as test
      # coverage lands. 72 is the current anti-regression floor —
      # just below the lowest gated crate (amstrad-class, 72.79%).
      # Bump this back toward 90 as crate coverage improves.
      COVERAGE_GATE_THRESHOLD: 72
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        # libasound2-dev: audio (cpal). libudev-dev: gamepad enumeration
        # via gilrs for the host-input layer. muda's GTK backend is
        # disabled at the workspace dep level (see workspace `muda`
        # entry in the root Cargo.toml), so libgtk-3-dev / libxdo-dev
        # aren't needed any more — restore them if Linux native menus
        # are wired up.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Read pinned toolchain
        # See note in the fmt job above. Branch coverage was dropped
        # 2026-04-30 (see scripts/coverage.sh header), so nightly is
        # no longer required here; stable + llvm-tools-preview is
        # enough for line / region / function coverage.
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run coverage suite
        # Compiles every test binary with -C instrument-coverage and
        # runs them. This is the workspace test step too — there is
        # no separate `cargo test --workspace` job; the regression
        # signal comes from this run's pass/fail.
        env:
          # Tests that need a ROM, corpus or disk image return early when
          # it is absent and libtest prints `ok`, so a green run cannot be
          # told from a vacuous one. libtest captures output from passing
          # tests, which is why grepping this log for "skipping" finds
          # nothing — the file survives that capture.
          #
          # Deliberately not strict here: CI genuinely has no ROMs, so a
          # skip is honest. EMU198X_STRICT_FIXTURES belongs on the nightly
          # accuracy run, which provisions fixtures — but only once every
          # guard has been converted, or it fails on the unconverted ones
          # for the wrong reason. See the tally below for what remains.
          EMU198X_SKIP_LOG: ${{ github.workspace }}/target/test-skips.tsv
        run: ./scripts/coverage.sh

      - name: Publish skipped-fixture summary
        # Runs even when the suite fails — a failing run is exactly when
        # you want to know how much of it never executed.
        if: always()
        run: |
          log="${GITHUB_WORKSPACE}/target/test-skips.tsv"
          {
            echo "## Skipped for missing fixtures"
            echo
            if [ ! -s "${log}" ]; then
              echo "None — every test ran."
            else
              echo "**$(wc -l < "${log}" | tr -d ' ') tests did not run.**"
              echo "A green suite does not cover these."
              echo
              echo '| Count | Fixture |'
              echo '|---|---|'
              cut -f2 "${log}" | sort | uniq -c | sort -rn \
                | sed -E 's/^ *([0-9]+) (.*)$/| \1 | \2 |/'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run Spectrum-side coverage gate
        # Gates the SOLID criterion 11 floor. The summary step below
        # runs regardless via the `if: always()` guard, so even when
        # the gate fails the publish/upload steps still capture the
        # report — making it easy to diagnose what fell below.
        run: ./scripts/coverage-gate.sh

      - name: Publish coverage summary
        if: always()
        run: |
          total_line="$(grep '^TOTAL' target/llvm-cov/coverage-summary.txt | tail -n 1)"
          {
            echo "## Coverage"
            echo
            echo '```text'
            echo "${total_line}"
            echo '```'
            echo
            echo "- Text summary: \`target/llvm-cov/coverage-summary.txt\`"
            echo "- JSON summary: \`target/llvm-cov/coverage-summary.json\`"
            echo "- LCOV export: \`target/llvm-cov/lcov.info\`"
            echo "- HTML report: uploaded as the \`coverage-html\` artifact"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage summary artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: |
            target/llvm-cov/coverage-summary.txt
            target/llvm-cov/coverage-summary.json
            target/llvm-cov/lcov.info

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/llvm-cov/html

  # ZEXDOC + ZEXALL moved to .github/workflows/zex.yml — it runs only when
  # the Z80 core or its corpus changes (plus on demand), so it no longer
  # makes every push wait tens of minutes on a stable CPU exerciser.
