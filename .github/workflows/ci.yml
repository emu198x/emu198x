name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format and lint run as separate jobs so the workflow summary
  # surfaces them independently. Both are fast (no test compile);
  # heavier downstream jobs gate on both passing.
  registry:
    name: System registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Verifies docs/status/systems.toml against the crates, the declared
      # machine profiles, and the tracker's labels and milestones. The registry
      # is the only place the repo's four naming vocabularies are joined, so an
      # entry that has drifted silently un-joins a machine from its own issues.
      - name: Check the system registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/status/check_registry.py

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        # Single source of truth across local + CI is
        # rust-toolchain.toml. dtolnay/rust-toolchain@master no longer
        # auto-reads the file, so we extract the channel here and
        # pass it explicitly. Update rust-toolchain.toml only.
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check


  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        # libasound2-dev: audio (cpal). libudev-dev: gamepad enumeration
        # via gilrs for the host-input layer. muda's GTK backend is
        # disabled at the workspace dep level (see workspace `muda`
        # entry in the root Cargo.toml), so libgtk-3-dev / libxdo-dev
        # aren't needed any more — restore them if Linux native menus
        # are wired up.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Read pinned toolchain
        # See note in the fmt job above.
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Cross-platform smoke build. Catches platform-specific compile
  # regressions on macOS (primary dev host) and Windows without
  # paying the cost of a full test run on those OSes. The full test
  # suite still runs only on Linux, via the `test` job below; this
  # job only proves the workspace compiles. cpal and gilrs each pick
  # up native audio/gamepad backends on macOS and Windows, so no
  # platform-specific install is needed outside Linux.
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.os }}

      - name: Build workspace
        run: cargo check --workspace --all-targets

  # The workspace's test runner. Deliberately *not* gated on fmt +
  # clippy: those are seconds, this is minutes, and making it wait
  # behind them adds its whole duration to the critical path instead
  # of overlapping with them. That coupling is what made the old
  # coverage job feel expensive enough to remove.
  #
  # Not instrumented. `cargo llvm-cov` used to serve as both the test
  # run and the coverage measurement; separating them means a PR
  # answers "did it pass" without paying for "how much is covered".
  test:
    name: Test
    runs-on: ubuntu-latest
    # `EMU198X_SKIP_LOG` is not set here: the collector points each test
    # binary at its own log, which is the only way a skip can be
    # attributed to the crate that raised it — the logged line carries the
    # test's thread name and no crate.
    #
    # Deliberately not strict either. CI genuinely has no ROMs, so a skip
    # here is honest, and it is the reason CI is where the gaps are
    # visible at all: on a machine with the fixtures staged those tests
    # pass and vanish. `EMU198X_STRICT_FIXTURES` belongs on the nightly
    # accuracy run, which provisions them.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        # libasound2-dev: audio (cpal). libudev-dev: gamepad enumeration
        # via gilrs for the host-input layer.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-linux

      - name: Run the workspace test suite and collect evidence
        # Replaces `cargo test --workspace --no-fail-fast`, and is the same
        # work: the same build, the same binaries, and no-fail-fast by
        # construction since every binary runs regardless of its
        # neighbours. What it adds is a record of what ran, so a green tick
        # stops being the only thing this job produces.
        #
        # Deliberately not a second pass. Coverage was removed on
        # 2026-08-13 for costing ~5 minutes on every PR's critical path,
        # and a status canon that repeated the suite to measure it would
        # earn the same fate. One run, all the data.
        run: python3 scripts/status/collect_evidence.py --out target/status-evidence.json

      - name: Run doctests
        # The collector runs test binaries; rustdoc runs doctests, which are
        # outside executable-level attribution and would otherwise stop
        # being checked. Reuses the build the step above already paid for.
        run: cargo test --workspace --doc

      - name: Publish the evidence summary
        # Runs even when the suite fails — a failing run is exactly when
        # you want to know how much of it never executed. The collector
        # writes its ledger before judging anything, so there is something
        # to summarise either way.
        if: always()
        run: |
          python3 scripts/status/summarise_evidence.py \
            target/status-evidence.json >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the evidence ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: status-evidence
          path: target/status-evidence.json
          if-no-files-found: warn

  # The Coverage job is disabled. It cost ~5 minutes on the critical path
  # of every PR (it gated on fmt + clippy) and had not failed in any
  # recent run, with its threshold sitting at 72 against a stated target
  # of 90 — a floor well below the aspiration it was meant to ratchet
  # toward. Removed 2026-08-13 by decision, not by accident.
  #
  # What that removal also took, unremarked, was the workspace's only
  # test execution: `cargo llvm-cov --workspace --lib --tests` was the
  # test run as well as the measurement, so for a day every green tick
  # meant "compiles" and nothing more. The `test` job above restores the
  # execution. Coverage itself is still worth having on a nightly
  # schedule — a ratchet that never fires looks identical to one that is
  # working.
  #
  # To restore it, recover the job from this file's history
  # (`git log -p -- .github/workflows/ci.yml`); scripts/coverage.sh and
  # scripts/coverage-gate.sh are untouched and still run locally.

  # ZEXDOC + ZEXALL moved to .github/workflows/zex.yml — it runs only when
  # the Z80 core or its corpus changes (plus on demand), so it no longer
  # makes every push wait tens of minutes on a stable CPU exerciser.
