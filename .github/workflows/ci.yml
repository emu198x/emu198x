name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format and lint run as separate jobs so the workflow summary
  # surfaces them independently. Both are fast (no test compile);
  # heavier downstream jobs gate on both passing.
  # Cheap, buildless, and pure Python — it sits before everything that needs
  # a toolchain so a reintroduced silent guard is reported in seconds.
  hygiene:
    name: Test hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # libtest reports an early return as `ok`, so a guard that prints a
      # missing fixture and returns claims a pass for a test that did not
      # run. #1011 swept 54 of those across 39 files; this stops the next
      # copied guard restoring the class.
      #
      # `--self-test` runs the detector against known-good and known-bad
      # samples first. This repository runs no CI job over the scripts' own
      # tests, so a checker that had stopped detecting would pass silently —
      # which is the very failure it is here to prevent.
      - name: Check no fixture guard passes in silence
        run: python3 scripts/check-fixture-guards.py --self-test

  registry:
    name: System registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Verifies docs/status/systems.toml against the crates, the declared
      # machine profiles, and the tracker's labels and milestones. The registry
      # is the only place the repo's four naming vocabularies are joined, so an
      # entry that has drifted silently un-joins a machine from its own issues.
      - name: Check the system registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/status/check_registry.py

      # The committed status pages are generated from the registry and the
      # dependency graph. Neither needs a build, so this costs seconds and
      # sits here rather than behind the test job. A page edited by hand
      # fails, which is the point: the last time these pages were
      # hand-maintained they went stale and then vanished (#825).
      - name: Check the status pages are current
        run: python3 scripts/status/render_status.py --check

  # Spectrum boot evidence. Amstrad permits the Sinclair ROMs to be
  # distributed, so unlike almost every other machine here the Spectrum's
  # "does it boot" can be checked on a pull request rather than only in the
  # nightly. The ROM still is not committed — `Emu198x/CLAUDE.md` keeps ROM
  # and media files out of the repository — so it comes from the same
  # corpora store the nightly uses.
  #
  # Deliberately a short, named set. `z80test`, the contention oracles and
  # the Tom Harte corpora take tens of minutes and stay nightly; these four
  # targets total under ten seconds. Coverage was removed for costing five
  # minutes on every PR, and this is not the change that reintroduces that.
  #
  # `contention_arming`'s port-class case is excluded, and not because I/O
  # contention is broken — it is green, and `io_contention_oracle` below is
  # the instrument that says so, at zero against FUSE across a whole frame.
  # That case is a known limitation of its own counter: a withheld *run*
  # merges charges landing one T-state apart, so two charges read as one and
  # four read as two. Its ignore attribute says exactly this, and
  # `io-contention-is-a-count-not-a-level.md` forbids scoring gate changes
  # against that file at all — three terms were once tuned against its run
  # count and died.
  spectrum-boot:
    name: Spectrum boot evidence
    runs-on: ubuntu-latest
    env:
      CORPORA_REPO: ${{ vars.ACCURACY_CORPORA_REPO }}
      CORPORA_TAG: ${{ vars.ACCURACY_CORPORA_TAG || 'v1' }}
      # The ROM is provisioned in this job, so a test that skips for its
      # absence is a provisioning failure, not an honest gap. Fail loudly.
      EMU198X_STRICT_FIXTURES: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check the corpora store is configured
        id: store
        env:
          CORPORA_TOKEN: ${{ secrets.ACCURACY_CORPORA_TOKEN }}
        run: |
          if [ -n "${CORPORA_TOKEN}" ] && [ -n "${CORPORA_REPO}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Corpora store not configured — Spectrum boot evidence did NOT run."
          fi

      - name: Install Linux build dependencies
        if: steps.store.outputs.configured == 'true'
        # Bounded and retried for the same reason as the other two: an
        # unreachable Azure Ubuntu mirror otherwise costs twenty to thirty
        # minutes of apt's default retries.
        run: |
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            sudo timeout 120 apt-get $apt_opts update \
              || echo "::warning::apt-get update attempt ${attempt} incomplete (mirror unreachable)"
            if sudo timeout 180 apt-get $apt_opts install -y --no-install-recommends \
                 pkg-config libasound2-dev libudev-dev; then
              exit 0
            fi
            echo "::warning::apt-get install attempt ${attempt} failed; retrying"
            sleep 10
          done
          echo "::error::apt failed after three bounded attempts"
          exit 1

      - name: Read pinned toolchain
        if: steps.store.outputs.configured == 'true'
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.store.outputs.configured == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        if: steps.store.outputs.configured == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-linux

      - name: Provision the Spectrum ROMs from the store
        if: steps.store.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.ACCURACY_CORPORA_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p corpora
          cd corpora
          gh release download "${CORPORA_TAG}" -R "${CORPORA_REPO}" \
            -p 'z80test.tar.zst' -p 'spectrum-roms.tar.zst' -p 'SHA256SUMS'
          grep ' z80test.tar.zst$' SHA256SUMS | sha256sum -c -
          grep ' spectrum-roms.tar.zst$' SHA256SUMS | sha256sum -c -
          tar --zstd -xf 'z80test.tar.zst'
          mkdir -p roms
          tar --zstd -xf 'spectrum-roms.tar.zst' -C roms
          # The 48K ROM travels inside the z80test tarball; the rest of the
          # line has its own. `EMU198X_ROMS_ROOT` is the firmware root each
          # machine's test joins its own directory onto.
          echo "EMU198X_SPECTRUM_48K_ROM=$(pwd)/z80test/48.rom" >> "$GITHUB_ENV"
          echo "EMU198X_ROMS_ROOT=$(pwd)/roms" >> "$GITHUB_ENV"

      - name: Run the Spectrum tests the ROM unlocks
        if: steps.store.outputs.configured == 'true'
        run: |
          cargo test -p machine-sinclair-zx-spectrum-48k --test boot_test -- --ignored
          cargo test -p machine-sinclair-zx-spectrum-48k --test float_bus_oracle -- --ignored
          # The authoritative I/O contention instrument: a whole-frame
          # differential against FUSE, currently at zero. The longest thing
          # here at ~17s, and worth it — this is the gate the contention
          # campaign closed on.
          cargo test -p machine-sinclair-zx-spectrum-48k --test io_contention_oracle -- --ignored
          cargo test -p runtime-sinclair-zx-spectrum --test boot_invariants -- --ignored
          # Only the goldens the 48K ROM covers. The 128K, +2 and +3 goldens
          # want their own ROMs, which this job does not provision — and
          # under strict fixtures their skips are failures rather than the
          # silent passes they used to be.
          cargo test -p runtime-sinclair-zx-spectrum --test goldens \
            golden_spectrum_16k_boot -- --ignored
          cargo test -p runtime-sinclair-zx-spectrum --test goldens \
            golden_spectrum_48k_boot -- --ignored
          cargo test -p runtime-sinclair-zx-spectrum --test goldens \
            golden_spectrum_plus_boot -- --ignored
          # Only the two `runtime_48k` cases the ROM alone unlocks. The
          # other three want commercial tape images, and under
          # EMU198X_STRICT_FIXTURES their skips are failures — correctly,
          # since this job claims to have provisioned what it runs.
          cargo test -p runtime-sinclair-zx-spectrum --test runtime_48k \
            spectrum_boot_wait_and_prompt -- --ignored
          cargo test -p runtime-sinclair-zx-spectrum --test runtime_48k \
            spectrum_query_provider_detects -- --ignored
          # The rest of the Sinclair/Amstrad line. Each boots its own real
          # firmware, which Amstrad permits to be distributed — so unlike
          # most machines here these need no synthetic stand-in.
          for machine in 128k plus2 plus2a plus2b plus3; do
            cargo test -p "machine-sinclair-zx-spectrum-${machine}" \
              --test boot_test -- --ignored
          done

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        # Single source of truth across local + CI is
        # rust-toolchain.toml. dtolnay/rust-toolchain@master no longer
        # auto-reads the file, so we extract the channel here and
        # pass it explicitly. Update rust-toolchain.toml only.
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check


  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        # libasound2-dev: audio (cpal). libudev-dev: gamepad enumeration
        # via gilrs for the host-input layer. muda's GTK backend is
        # disabled at the workspace dep level (see workspace `muda`
        # entry in the root Cargo.toml), so libgtk-3-dev / libxdo-dev
        # aren't needed any more — restore them if Linux native menus
        # are wired up.
        #
        # Bounded and retried because the Azure Ubuntu mirror intermittently
        # refuses these runners. Unbounded, apt answers that by retrying with
        # its default timeouts: four jobs across two pull requests hung here
        # for 20-30 minutes each, logging `Ign:` against
        # azure.archive.ubuntu.com, while sibling jobs in the same run got a
        # healthy mirror and passed. Re-running is not a fix — it is a
        # coin toss.
        #
        # `update` may fail without failing the step: the runner image ships
        # a populated package cache, so an unreachable mirror should cost
        # seconds, not the whole job.
        run: |
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            sudo timeout 120 apt-get $apt_opts update \
              || echo "::warning::apt-get update attempt ${attempt} incomplete (mirror unreachable)"
            if sudo timeout 180 apt-get $apt_opts install -y --no-install-recommends \
                 pkg-config libasound2-dev libudev-dev; then
              exit 0
            fi
            echo "::warning::apt-get install attempt ${attempt} failed; retrying"
            sleep 10
          done
          echo "::error::apt failed after three bounded attempts"
          exit 1

      - name: Read pinned toolchain
        # See note in the fmt job above.
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Cross-platform smoke build. Catches platform-specific compile
  # regressions on macOS (primary dev host) and Windows without
  # paying the cost of a full test run on those OSes. The full test
  # suite still runs only on Linux, via the `test` job below; this
  # job only proves the workspace compiles. cpal and gilrs each pick
  # up native audio/gamepad backends on macOS and Windows, so no
  # platform-specific install is needed outside Linux.
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.os }}

      - name: Build workspace
        run: cargo check --workspace --all-targets

  # The workspace's test runner. Deliberately *not* gated on fmt +
  # clippy: those are seconds, this is minutes, and making it wait
  # behind them adds its whole duration to the critical path instead
  # of overlapping with them. That coupling is what made the old
  # coverage job feel expensive enough to remove.
  #
  # Not instrumented. `cargo llvm-cov` used to serve as both the test
  # run and the coverage measurement; separating them means a PR
  # answers "did it pass" without paying for "how much is covered".
  test:
    name: Test
    runs-on: ubuntu-latest
    # `EMU198X_SKIP_LOG` is not set here: the collector points each test
    # binary at its own log, which is the only way a skip can be
    # attributed to the crate that raised it — the logged line carries the
    # test's thread name and no crate.
    #
    # Deliberately not strict either. CI genuinely has no ROMs, so a skip
    # here is honest, and it is the reason CI is where the gaps are
    # visible at all: on a machine with the fixtures staged those tests
    # pass and vanish. `EMU198X_STRICT_FIXTURES` belongs on the nightly
    # accuracy run, which provisions them.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        # libasound2-dev: audio (cpal). libudev-dev: gamepad enumeration
        # via gilrs for the host-input layer.
        #
        # Bounded and retried because the Azure Ubuntu mirror intermittently
        # refuses these runners. Unbounded, apt answers that by retrying with
        # its default timeouts: four jobs across two pull requests hung here
        # for 20-30 minutes each, logging `Ign:` against
        # azure.archive.ubuntu.com, while sibling jobs in the same run got a
        # healthy mirror and passed. Re-running is not a fix — it is a
        # coin toss.
        #
        # `update` may fail without failing the step: the runner image ships
        # a populated package cache, so an unreachable mirror should cost
        # seconds, not the whole job.
        run: |
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            sudo timeout 120 apt-get $apt_opts update \
              || echo "::warning::apt-get update attempt ${attempt} incomplete (mirror unreachable)"
            if sudo timeout 180 apt-get $apt_opts install -y --no-install-recommends \
                 pkg-config libasound2-dev libudev-dev; then
              exit 0
            fi
            echo "::warning::apt-get install attempt ${attempt} failed; retrying"
            sleep 10
          done
          echo "::error::apt failed after three bounded attempts"
          exit 1

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-linux

      - name: Run the workspace test suite and collect evidence
        # Replaces `cargo test --workspace --no-fail-fast`, and is the same
        # work: the same build, the same binaries, and no-fail-fast by
        # construction since every binary runs regardless of its
        # neighbours. What it adds is a record of what ran, so a green tick
        # stops being the only thing this job produces.
        #
        # Deliberately not a second pass. Coverage was removed on
        # 2026-08-13 for costing ~5 minutes on every PR's critical path,
        # and a status canon that repeated the suite to measure it would
        # earn the same fate. One run, all the data.
        run: python3 scripts/status/collect_evidence.py --out target/status-evidence.json

      - name: Run doctests
        # The collector runs test binaries; rustdoc runs doctests, which are
        # outside executable-level attribution and would otherwise stop
        # being checked. Reuses the build the step above already paid for.
        run: cargo test --workspace --doc

      - name: Publish the evidence summary
        # Runs even when the suite fails — a failing run is exactly when
        # you want to know how much of it never executed. The collector
        # writes its ledger before judging anything, so there is something
        # to summarise either way.
        if: always()
        run: |
          python3 scripts/status/summarise_evidence.py \
            target/status-evidence.json >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the evidence ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: status-evidence
          path: target/status-evidence.json
          if-no-files-found: warn

  # The Coverage job is disabled. It cost ~5 minutes on the critical path
  # of every PR (it gated on fmt + clippy) and had not failed in any
  # recent run, with its threshold sitting at 72 against a stated target
  # of 90 — a floor well below the aspiration it was meant to ratchet
  # toward. Removed 2026-08-13 by decision, not by accident.
  #
  # What that removal also took, unremarked, was the workspace's only
  # test execution: `cargo llvm-cov --workspace --lib --tests` was the
  # test run as well as the measurement, so for a day every green tick
  # meant "compiles" and nothing more. The `test` job above restores the
  # execution. Coverage itself is still worth having on a nightly
  # schedule — a ratchet that never fires looks identical to one that is
  # working.
  #
  # To restore it, recover the job from this file's history
  # (`git log -p -- .github/workflows/ci.yml`); scripts/coverage.sh and
  # scripts/coverage-gate.sh are untouched and still run locally.

  # ZEXDOC + ZEXALL moved to .github/workflows/zex.yml — it runs only when
  # the Z80 core or its corpus changes (plus on demand), so it no longer
  # makes every push wait tens of minutes on a stable CPU exerciser.
