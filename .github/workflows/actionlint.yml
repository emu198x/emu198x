name: Workflow lint

# actionlint checks the workflows themselves, and with shellcheck (on the
# runner image) every `run:` script in them. It only has something to say
# when a workflow or its own config changes, so it runs only then.
# .github/actionlint.yaml records the findings accepted in dist's generated
# release.yml.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The release binary, checked against the release's own checksums. The
      # version is pinned so a new actionlint check cannot fail an unrelated
      # PR; dependabot does not track it, so bump it by hand.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 -o "$archive" "$base/$archive"
          curl -sSfL --retry 3 -o checksums.txt "$base/actionlint_${VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # actionlint checks run: scripts only when shellcheck is on the path,
      # and shellcheck versions disagree: the runner image's 0.9.0 flags
      # code that 0.11.0 accepts. Pinning the same version as a local
      # `brew install shellcheck` keeps a clean local run clean here. The
      # project publishes no checksums, so the SHA-256 is the one recorded
      # from the release asset on 2026-10-20.
      - name: Install shellcheck
        env:
          VERSION: 0.11.0
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-v${VERSION}.linux.x86_64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${VERSION}/$archive"
          echo "$SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" --strip-components=1 "shellcheck-v${VERSION}/shellcheck"

      - name: Every workflow must pass actionlint
        run: |
          shellcheck --version | sed -n 2p
          actionlint -version | head -1
          actionlint -color
