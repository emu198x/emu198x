name: Nightly Accuracy

# Runs external CPU comparison corpora that are too large or asset-dependent
# to gate every push: SingleStepTests (6502, Z80, 68000), SM83 (Tennant),
# Klaus Dormann, FUSE Z80, Wolfgang Lorenz, and ZEXDOC/ZEXALL. Their tests are
# ignored by default because the external corpora are not checked into this
# repository. A completed job records only the comparison it executed; the
# workflow's presence does not establish an accuracy result.
#
# A configured private release store delivers the corpora. It is a cache, not
# their canonical provenance or a grant of redistribution rights. The workflow
# verifies delivery checksums; the 68000 job also verifies a committed per-file
# manifest. The Lorenz asset contains the project's synthetic free KERNAL, not
# a commercial ROM. See test-data/accuracy-corpora.md.

on:
  schedule:
    # 02:30 UTC nightly — off-peak for GitHub-hosted runners.
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-accuracy-${{ github.ref }}
  cancel-in-progress: true

env:
  # The dedicated assets store. Set ACCURACY_CORPORA_REPO as an Actions
  # variable (e.g. emu198x/accuracy-corpora); ACCURACY_CORPORA_TAG defaults
  # to v1. The read token is the ACCURACY_CORPORA_TOKEN secret.
  CORPORA_REPO: ${{ vars.ACCURACY_CORPORA_REPO }}
  CORPORA_TAG: ${{ vars.ACCURACY_CORPORA_TAG || 'v1' }}

  # Every job here provisions the fixtures its tests need, from the store
  # above, in an explicit step. So a test that skips for a missing fixture
  # is not reporting an honest absence — it is reporting that provisioning
  # silently failed, and it would otherwise report that as a pass.
  #
  # This is the environment `emu198x-test-skip` exists for. On CI proper a
  # skip is honest (there are no ROMs there) and is only counted; here it
  # is an error.
  #
  # The corpus tests already behave this way by using `.expect()` on their
  # corpus roots. What this covers is the rest: the ZEX, z80test and
  # floating-bus jobs, whose Spectrum tests guarded with a bare `return`
  # and passed in silence when the 48K ROM, floatspy.tap or the Spectron
  # reference screens were absent.
  EMU198X_STRICT_FIXTURES: "1"

jobs:
  # Secrets can't be read in a job-level `if`, so a preflight job turns
  # "is the store configured?" into an output the corpus jobs gate on. On a
  # fork without the secret this short-circuits everything to skipped. On the
  # canonical repository, missing configuration fails the preflight.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check corpora store is configured
        id: check
        run: |
          if [ -n "${{ secrets.ACCURACY_CORPORA_TOKEN }}" ] && [ -n "${CORPORA_REPO}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Corpora store: ${CORPORA_REPO}@${CORPORA_TAG}"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.repository }}" = "emu198x/emu198x" ]; then
              echo "::error::Corpora store not configured on the canonical repository (ACCURACY_CORPORA_TOKEN secret and/or ACCURACY_CORPORA_REPO variable unset). See test-data/accuracy-corpora.md."
              exit 1
            fi
            echo "::warning::Corpora store not configured on this fork. Corpus jobs skipped. See test-data/accuracy-corpora.md."
          fi

  # Fast-to-moderate corpora, one matrix leg each. Each leg pulls its tarball
  # from the store, verifies it against the store's SHA256SUMS, extracts it,
  # points the corpus env var at the extracted dir, and runs that test file
  # with --include-ignored (the whole ignored set for the file, matching the
  # zex.yml precedent).
  corpora:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # `filter` narrows to the comprehensive sweep test. `--include-ignored`
        # would otherwise also run the per-opcode helper tests (run_named_opcode
        # etc.) that require an env var and panic when it is unset — those are
        # for driving a single opcode by hand, not for CI.
        include:
          - name: harte-6502
            artifact: harte-6502
            crate: mos-6502
            test: single_step_tests
            env_var: EMU198X_6502_TOM_HARTE_DIR
            filter: run_all
          - name: harte-z80
            artifact: harte-z80
            crate: zilog-z80
            test: single_step_tests
            env_var: EMU198X_Z80_TOM_HARTE_DIR
            filter: run_all
          - name: sm83-tennant
            artifact: sm83
            crate: sharp-lr35902
            test: single_step_tests
            env_var: EMU198X_SM83_TENNANT_DIR
            filter: run_all
          - name: dormann-6502
            artifact: dormann-6502
            crate: mos-6502
            test: dormann_tests
            env_var: EMU198X_6502_DORMANN_DIR
            filter: ''
          - name: fuse-z80
            artifact: fuse-z80
            crate: zilog-z80
            test: z80_fuse
            env_var: EMU198X_FUSE_Z80_TESTS_DIR
            filter: ''
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-accuracy-${{ matrix.crate }}

      - name: Provision corpus from store
        env:
          GH_TOKEN: ${{ secrets.ACCURACY_CORPORA_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p corpora
          cd corpora
          gh release download "${CORPORA_TAG}" -R "${CORPORA_REPO}" \
            -p '${{ matrix.artifact }}.tar.zst' -p 'SHA256SUMS'
          # Verify only the asset we pulled against the store's checksums.
          grep ' ${{ matrix.artifact }}.tar.zst$' SHA256SUMS | sha256sum -c -
          tar --zstd -xf '${{ matrix.artifact }}.tar.zst'
          echo "${{ matrix.env_var }}=$(pwd)/${{ matrix.artifact }}" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.name }}
        run: cargo test --release -p ${{ matrix.crate }} --test ${{ matrix.test }} ${{ matrix.filter }} -- --include-ignored --nocapture

  # SingleStepTests 68000 — 124 fixture files containing 1,000,060 rows.
  # The harness excludes two named invalid rows and compares the remaining
  # 1,000,058. It gets its own job with a long timeout rather than sharing the
  # matrix.
  harte-68000:
    name: harte-68000
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-accuracy-motorola-68000

      - name: Provision corpus from store
        env:
          GH_TOKEN: ${{ secrets.ACCURACY_CORPORA_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p corpora
          cd corpora
          gh release download "${CORPORA_TAG}" -R "${CORPORA_REPO}" \
            -p 'harte-68000.tar.zst' -p 'SHA256SUMS'
          grep ' harte-68000.tar.zst$' SHA256SUMS | sha256sum -c -
          tar --zstd -xf 'harte-68000.tar.zst'
          cd harte-68000
          sha256sum -c "${GITHUB_WORKSPACE}/test-data/singlesteptests-680x0-e0d5ece.sha256"
          echo "EMU198X_68000_TOM_HARTE_ROOT=$(pwd)" >> "$GITHUB_ENV"

      - name: Verify full-sweep test is registered
        run: |
          set -euo pipefail
          matches="$(
            cargo test --release -p motorola-68000 --test tom_harte -- --list --ignored |
              awk '$0 == "harte_full_sweep: test" { count++ } END { print count + 0 }'
          )"
          if [ "${matches}" -ne 1 ]; then
            echo "::error::Expected exactly one ignored harte_full_sweep test; found ${matches}."
            exit 1
          fi

      - name: Run SingleStepTests 68000 full sweep
        run: cargo test --release -p motorola-68000 --test tom_harte harte_full_sweep -- --ignored --exact --nocapture

  # Wolfgang Lorenz — its own job because it loads a C64 KERNAL into $E000-$FFFF.
  # That KERNAL is a *synthetic, fully-free* one we author (not the commercial
  # Cloanto ROM): the harness traps CHROUT and installs its own reset/IRQ
  # vectors, so the only KERNAL code the suite ever executes is the interrupt
  # handlers at $EA31/$FE66/NMI — the synthetic supplies compatible minimal
  # handlers there. Verified 2026-07-04 to reproduce the real-KERNAL result on
  # all 265 cases (250 pass / 15 hardware-dependent skips). The store's
  # lorenz-6502 tarball carries the cases plus this synthetic kernal.rom; no
  # commercial ROM touches CI. See test-data/commodore/c64/synthetic-kernal/.
  lorenz-6502:
    name: lorenz-6502
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-accuracy-lorenz

      - name: Provision corpus + KERNAL from store
        env:
          GH_TOKEN: ${{ secrets.ACCURACY_CORPORA_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p corpora
          cd corpora
          gh release download "${CORPORA_TAG}" -R "${CORPORA_REPO}" \
            -p 'lorenz-6502.tar.zst' -p 'SHA256SUMS'
          grep ' lorenz-6502.tar.zst$' SHA256SUMS | sha256sum -c -
          tar --zstd -xf 'lorenz-6502.tar.zst'
          echo "EMU198X_6502_LORENZ_DIR=$(pwd)/lorenz-6502" >> "$GITHUB_ENV"
          # The suite reads a KERNAL via the C64 ROM env var; the tarball ships
          # the synthetic free KERNAL (kernal.rom) alongside the cases — not a
          # commercial ROM. See test-data/commodore/c64/synthetic-kernal/.
          echo "EMU198X_C64_KERNAL_ROM=$(pwd)/lorenz-6502/kernal.rom" >> "$GITHUB_ENV"

      - name: Run Wolfgang Lorenz 6502 suite
        run: cargo test --release -p mos-6502 --test lorenz_tests run_lorenz_6502_cpu_suite -- --include-ignored --nocapture

  # Frank Cringle's ZEXDOC + ZEXALL Z80 exerciser. Own job (tens of minutes).
  # Previously ran hermetically from a checked-in corpus via zex.yml, on Z80
  # changes; folded into this nightly for consistency with the other corpora
  # (moved 2026-07-04). The .com corpus now lives in the store.
  zex:
    name: zex
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-accuracy-zex

      - name: Provision corpus from store
        env:
          GH_TOKEN: ${{ secrets.ACCURACY_CORPORA_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p corpora
          cd corpora
          gh release download "${CORPORA_TAG}" -R "${CORPORA_REPO}" \
            -p 'zex.tar.zst' -p 'SHA256SUMS'
          grep ' zex.tar.zst$' SHA256SUMS | sha256sum -c -
          tar --zstd -xf 'zex.tar.zst'
          echo "EMU198X_ZEX_DIR=$(pwd)/zex" >> "$GITHUB_ENV"

      - name: Run ZEXDOC + ZEXALL
        # --skip checkpoint drops run_zexdoc_checkpoint / run_zexall_checkpoint,
        # which need EMU198X_ZEX_CHECKPOINT set and panic without it.
        run: cargo test --release -p zilog-z80 --test zex_tests -- --include-ignored --skip checkpoint --nocapture

  # Patrik Rak's z80test exerciser (MIT). Runs on a full 48K Spectrum, so it
  # needs the free (Amstrad-permissioned) 48K ROM — the z80test tarball ships
  # it alongside the .tap corpus. Previously local-only; added to CI 2026-07-04.
  z80test:
    name: z80test
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-accuracy-z80test

      - name: Install Linux build dependencies
        # z80test compiles a full 48K Spectrum, which pulls in the host
        # audio/input stack (cpal -> alsa, gilrs -> libudev). The pure-CPU
        # jobs above don't need these. Mirrors the main ci.yml install.
        run: |
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            sudo timeout 120 apt-get $apt_opts update \
              || echo "::warning::apt-get update attempt ${attempt} incomplete (mirror unreachable)"
            if sudo timeout 180 apt-get $apt_opts install -y --no-install-recommends \
                 pkg-config libasound2-dev libudev-dev; then
              exit 0
            fi
            echo "::warning::apt-get install attempt ${attempt} failed; retrying"
            sleep 10
          done
          echo "::error::apt failed after three bounded attempts"
          exit 1

      - name: Provision corpus + 48K ROM from store
        env:
          GH_TOKEN: ${{ secrets.ACCURACY_CORPORA_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p corpora
          cd corpora
          gh release download "${CORPORA_TAG}" -R "${CORPORA_REPO}" \
            -p 'z80test.tar.zst' -p 'SHA256SUMS'
          grep ' z80test.tar.zst$' SHA256SUMS | sha256sum -c -
          tar --zstd -xf 'z80test.tar.zst'
          echo "EMU198X_Z80TEST_DIR=$(pwd)/z80test" >> "$GITHUB_ENV"
          echo "EMU198X_SPECTRUM_48K_ROM=$(pwd)/z80test/48.rom" >> "$GITHUB_ENV"

      - name: Run z80test
        run: cargo test --release -p machine-sinclair-zx-spectrum-48k --test z80test -- --include-ignored --nocapture

  # Floating-bus oracles: Float48K / Float128k (Woody) and floatspy (Ramsoft),
  # the latter byte-compared against Spectron's own reference screens.
  #
  # Added 2026-08-10 after a contention fix silently regressed the floating
  # bus. The timing survey improved, the catalogue passed, the unit tests
  # passed — and floatspy, which caught it, was an ignored test outside the
  # matrix, so it only ran because someone went looking. These are the
  # strongest floating-bus oracles in the tree and they belong in CI.
  floating-bus:
    name: floating-bus (Float48K / Float128k / floatspy)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-accuracy-floating-bus

      - name: Install Linux build dependencies
        # These tests boot a full Spectrum, which pulls in the host
        # audio/input stack (cpal -> alsa, gilrs -> libudev).
        run: |
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            sudo timeout 120 apt-get $apt_opts update \
              || echo "::warning::apt-get update attempt ${attempt} incomplete (mirror unreachable)"
            if sudo timeout 180 apt-get $apt_opts install -y --no-install-recommends \
                 pkg-config libasound2-dev libudev-dev; then
              exit 0
            fi
            echo "::warning::apt-get install attempt ${attempt} failed; retrying"
            sleep 10
          done
          echo "::error::apt failed after three bounded attempts"
          exit 1

      - name: Provision corpus + 48K ROM from store
        env:
          GH_TOKEN: ${{ secrets.ACCURACY_CORPORA_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p corpora
          cd corpora
          gh release download "${CORPORA_TAG}" -R "${CORPORA_REPO}" \
            -p 'spectrum-system-tests.tar.zst' -p 'z80test.tar.zst' -p 'SHA256SUMS'
          grep ' spectrum-system-tests.tar.zst$' SHA256SUMS | sha256sum -c -
          grep ' z80test.tar.zst$' SHA256SUMS | sha256sum -c -
          tar --zstd -xf 'spectrum-system-tests.tar.zst'
          tar --zstd -xf 'z80test.tar.zst'
          echo "EMU198X_SPECTRUM_48K_ROM=$(pwd)/z80test/48.rom" >> "$GITHUB_ENV"
          echo "EMU198X_SPECTRUM_SYSTEM_TESTS_DIR=$(pwd)/spectrum-system-tests/tapes" >> "$GITHUB_ENV"
          echo "EMU198X_SPECTRON_RESULTS_DIR=$(pwd)/spectrum-system-tests/spectron-results" >> "$GITHUB_ENV"
          echo "EMU198X_SPECTRUM_128K_ROM0=$(pwd)/spectrum-system-tests/roms/128-0.rom" >> "$GITHUB_ENV"
          echo "EMU198X_SPECTRUM_128K_ROM1=$(pwd)/spectrum-system-tests/roms/128-1.rom" >> "$GITHUB_ENV"

      - name: Assert the corpus is actually present
        # These tests `return` early when their tape or ROM is missing, so a
        # half-provisioned corpus passes vacuously — which is the failure
        # mode this job exists to prevent. Check the inputs explicitly
        # before running anything.
        run: |
          set -euo pipefail
          for f in "${EMU198X_SPECTRUM_48K_ROM}" \
                   "${EMU198X_SPECTRUM_SYSTEM_TESTS_DIR}/Float48k.tap" \
                   "${EMU198X_SPECTRUM_SYSTEM_TESTS_DIR}/Float128k.tap" \
                   "${EMU198X_SPECTRUM_SYSTEM_TESTS_DIR}/floatspy.tap" \
                   "${EMU198X_SPECTRON_RESULTS_DIR}/floatspy_48.png" \
                   "${EMU198X_SPECTRUM_128K_ROM0}" \
                   "${EMU198X_SPECTRUM_128K_ROM1}"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing corpus input: $f — the floating-bus tests would skip silently"
              exit 1
            fi
          done

      - name: Float48K (48K first-display-byte T-state)
        run: cargo test --release -p machine-sinclair-zx-spectrum-48k --test float_bus -- --include-ignored --nocapture

      - name: Float128k (128K first-display-byte T-state)
        # `float128k_prints_expected_tstate` ran skipped-by-name here while
        # the engine read one T-state short of 14364 (#851). The I/O sample
        # instant is now derived from the M-cycle rather than fitted per
        # machine, the engine reads 14364, and the skip is gone — so this
        # step gates the 128K floating bus again.
        run: |
          cargo test --release -p machine-sinclair-zx-spectrum-128k \
            --test float_bus -- --include-ignored --nocapture

      - name: floatspy (golden + Spectron byte-compare)
        run: cargo test --release -p machine-sinclair-zx-spectrum-48k --test tape_smoke -- --include-ignored --nocapture floatspy

      - name: Live floating bus vs FUSE, frame-wide (48K)
        # Float48K and floatspy are *programs* reading the bus through the
        # `IN` path, so they can only report one sample each. This scores
        # the bus the ULA actually drives at every T-state in the frame,
        # plus the byte the `IN` path returns at every arrival T-state —
        # both currently exact, and both able to fail on their own.
        #
        # It is what disconfirmed `IDLE_TABLE`/`MEM_TABLE` as floatspy's
        # remaining wrong byte. Cheap: under a second once built.
        run: |
          cargo test --release -p machine-sinclair-zx-spectrum-48k \
            --test float_bus_oracle -- --include-ignored --nocapture

      - name: Live floating bus vs FUSE, frame-wide (128K)
        # The 128K's second frame anchor. It also asserts that the `/INT`
        # edge and the raster still *disagree* by two T-states — a known
        # defect held open deliberately, so that reconciling it fails a
        # test rather than silently outdating the record.
        run: |
          cargo test --release -p machine-sinclair-zx-spectrum-128k \
            --test float_bus_oracle -- --include-ignored --nocapture

  # Contention oracles: the frame-wide I/O differential against FUSE, and
  # the 70-case ZXSpectrum4.net timing survey.
  #
  # Added 2026-08-11. Both had measured the engine for weeks while being
  # structurally unable to fail — the differential printed its disagreement
  # count and asserted nothing, and the survey printed 36 FAIL lines and
  # returned `ok`. Both now carry ratchets, so this job is what turns them
  # into a scoreboard for the contention derivation rather than two logs
  # someone has to read at the right moment.
  contention-oracles:
    name: contention (I/O differential + timing survey)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-accuracy-contention

      - name: Install Linux build dependencies
        # Both oracles build a whole Spectrum, which pulls in the host
        # audio/input stack (cpal -> alsa, gilrs -> libudev).
        run: |
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            sudo timeout 120 apt-get $apt_opts update \
              || echo "::warning::apt-get update attempt ${attempt} incomplete (mirror unreachable)"
            if sudo timeout 180 apt-get $apt_opts install -y --no-install-recommends \
                 pkg-config libasound2-dev libudev-dev; then
              exit 0
            fi
            echo "::warning::apt-get install attempt ${attempt} failed; retrying"
            sleep 10
          done
          echo "::error::apt failed after three bounded attempts"
          exit 1

      - name: Provision 48K ROM + timing suite from store
        env:
          GH_TOKEN: ${{ secrets.ACCURACY_CORPORA_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p corpora
          cd corpora
          gh release download "${CORPORA_TAG}" -R "${CORPORA_REPO}" \
            -p 'z80test.tar.zst' -p 'spectrum-system-tests.tar.zst' -p 'SHA256SUMS'
          grep ' z80test.tar.zst$' SHA256SUMS | sha256sum -c -
          grep ' spectrum-system-tests.tar.zst$' SHA256SUMS | sha256sum -c -
          tar --zstd -xf 'z80test.tar.zst'
          tar --zstd -xf 'spectrum-system-tests.tar.zst'
          echo "EMU198X_SPECTRUM_48K_ROM=$(pwd)/z80test/48.rom" >> "$GITHUB_ENV"
          echo "EMU198X_SPECTRUM_TIMING_SUITE=$(pwd)/spectrum-system-tests/suites" >> "$GITHUB_ENV"
          echo "EMU198X_SPECTRUM_128K_ROM0=$(pwd)/spectrum-system-tests/roms/128-0.rom" >> "$GITHUB_ENV"
          echo "EMU198X_SPECTRUM_128K_ROM1=$(pwd)/spectrum-system-tests/roms/128-1.rom" >> "$GITHUB_ENV"
          echo "EMU198X_SPECTRUM_PLUS3_ROM_DIR=$(pwd)/spectrum-system-tests/roms" >> "$GITHUB_ENV"

      - name: Assert the corpus is actually present
        # Same reasoning as the floating-bus job: a half-provisioned corpus
        # would make these skip, and a skipped ratchet gates nothing.
        run: |
          set -euo pipefail
          for f in "${EMU198X_SPECTRUM_48K_ROM}" \
                   "${EMU198X_SPECTRUM_TIMING_SUITE}/timingTests48k.sna" \
                   "${EMU198X_SPECTRUM_128K_ROM0}" \
                   "${EMU198X_SPECTRUM_128K_ROM1}" \
                   "${EMU198X_SPECTRUM_PLUS3_ROM_DIR}/plus3-0.rom" \
                   "${EMU198X_SPECTRUM_PLUS3_ROM_DIR}/plus3-3.rom"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing corpus input: $f — the contention oracles would skip"
              exit 1
            fi
          done

      - name: Where the contention gate arms (derivation instrument)
        # Records the ULA from inside `tick` on the real machine and
        # asserts the gate actually stalls a contended access, naming the
        # half-cycles that offer it an arming opportunity and the clock
        # parity each falls on. It is the test that caught the gate arming
        # on the wrong edge, and it is cheap; the two ratchets below are
        # aggregates and cannot say *where* a regression happened.
        #
        # `io_contention_matches_the_four_fuse_port_classes` is skipped by
        # name, not by `#[ignore]` — this step passes `--include-ignored`,
        # which runs ignored tests by design. It is the same instrument
        # pointed at FUSE's four port classes and it is red on one of them:
        # `$40FF` gets two withheld runs per I/O M-cycle where FUSE charges
        # four. That is a live finding, not a flake, and neither the gate
        # nor the reference is being adjusted to hide it.
        run: |
          cargo test --release -p machine-sinclair-zx-spectrum-48k \
            --test contention_arming -- --include-ignored --nocapture \
            --skip io_contention_matches_the_four_fuse_port_classes

      - name: I/O contention differential vs FUSE (ratchet)
        run: cargo test --release -p machine-sinclair-zx-spectrum-48k --test io_contention_oracle -- --include-ignored --nocapture

      - name: ZXSpectrum4.net timing survey (ratchet)
        run: cargo test --release -p runtime-sinclair-zx-spectrum --test timing_survey -- --include-ignored --nocapture

      # The three arrival-resolved memory differentials. Each scores real
      # instruction costs against FUSE's per-M-cycle walk at every arrival
      # T-state in the frame, with the origin measured from the `/INT` edge
      # rather than fitted. A frame *total* cannot see a phase error —
      # the contended window is sixteen whole 8-T-state groups — which is
      # how a one-T-state shift survived a whole phase of work with every
      # gate green.
      #
      # All three are sub-second once built, so the cost here is the build
      # this job already pays for.
      - name: Memory contention differential vs FUSE, 48K (ratchet 18)
        run: |
          cargo test --release -p machine-sinclair-zx-spectrum-48k \
            --test contention_oracle -- --include-ignored --nocapture

      - name: Memory contention differential vs FUSE, 128K (ratchet 17)
        # The 128K's contention phase lives in two constants whose *sum*
        # was all HALT2INT128 could ever measure. This is what separates
        # them.
        run: |
          cargo test --release -p machine-sinclair-zx-spectrum-128k \
            --test contention_oracle -- --include-ignored --nocapture

      - name: Memory contention differential vs FUSE, +2A (ratchet 149185)
        # A floor to work down from, not a near-miss to protect: this gate
        # undercharges everywhere and its offset sweep is flat, so no phase
        # fixes it (#856). The ratchet stops it getting worse while that is
        # addressed.
        #
        # It needs the +3 ROM set, which is why that was added to the
        # corpus — without it this harness returns early and passes
        # vacuously, which is how #856 went unmeasured in the first place.
        run: |
          cargo test --release -p machine-sinclair-zx-spectrum-plus2a \
            --test contention_oracle -- --include-ignored --nocapture

  # The 128K's own real-software oracle, plus the two fixtures that had
  # never been staged.
  #
  # Split from `contention-oracles` because it is the only Spectrum job
  # needing the `zx-spectrum-tests` corpus — the zxe.io depot snapshot, 29
  # MiB against the 45 KiB of `spectrum-system-tests` — and because the
  # survey costs ~7 minutes where everything in that job is sub-second.
  spectrum-128k-oracles:
    name: 128K (timing survey + HALT2INT + SZX)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-accuracy-spectrum-128k

      - name: Install Linux build dependencies
        # Booting a whole Spectrum pulls in the host audio/input stack
        # (cpal -> alsa, gilrs -> libudev).
        run: |
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            sudo timeout 120 apt-get $apt_opts update \
              || echo "::warning::apt-get update attempt ${attempt} incomplete (mirror unreachable)"
            if sudo timeout 180 apt-get $apt_opts install -y --no-install-recommends \
                 pkg-config libasound2-dev libudev-dev; then
              exit 0
            fi
            echo "::warning::apt-get install attempt ${attempt} failed; retrying"
            sleep 10
          done
          echo "::error::apt failed after three bounded attempts"
          exit 1

      - name: Provision corpora from store
        env:
          GH_TOKEN: ${{ secrets.ACCURACY_CORPORA_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p corpora
          cd corpora
          gh release download "${CORPORA_TAG}" -R "${CORPORA_REPO}" \
            -p 'spectrum-system-tests.tar.zst' -p 'zx-spectrum-tests.tar.zst' \
            -p 'SHA256SUMS'
          grep ' spectrum-system-tests.tar.zst$' SHA256SUMS | sha256sum -c -
          grep ' zx-spectrum-tests.tar.zst$' SHA256SUMS | sha256sum -c -
          tar --zstd -xf 'spectrum-system-tests.tar.zst'
          tar --zstd -xf 'zx-spectrum-tests.tar.zst'
          echo "EMU198X_ZX_SPECTRUM_TESTS_DIR=$(pwd)/zx-spectrum-tests" >> "$GITHUB_ENV"
          echo "EMU198X_SPECTRUM_SYSTEM_TESTS_DIR=$(pwd)/spectrum-system-tests/tapes" >> "$GITHUB_ENV"
          echo "EMU198X_SPECTRUM_128K_ROM0=$(pwd)/spectrum-system-tests/roms/128-0.rom" >> "$GITHUB_ENV"
          echo "EMU198X_SPECTRUM_128K_ROM1=$(pwd)/spectrum-system-tests/roms/128-1.rom" >> "$GITHUB_ENV"

      - name: Assert the corpus is actually present
        # Same reasoning as the other Spectrum jobs. `halt2int128.tap` in
        # particular had never been staged, so its test skipped from the
        # day it was written — which is why the oracle the 128K's
        # contention constants were pinned against could not be re-checked.
        run: |
          set -euo pipefail
          for f in "${EMU198X_SPECTRUM_128K_ROM0}" \
                   "${EMU198X_SPECTRUM_128K_ROM1}" \
                   "${EMU198X_SPECTRUM_SYSTEM_TESTS_DIR}/halt2int128.tap" \
                   "${EMU198X_ZX_SPECTRUM_TESTS_DIR}/ZX Spectrum Timing Tests - 128K v1.0 (2015-03-30)(Butler, Richard; Butler, Tim)[!].szx"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing corpus input: $f — the 128K oracles would skip"
              exit 1
            fi
          done

      - name: SZX reader against real files
        # The format the 128K timing suite ships in. Parses every `.szx` in
        # the corpus, not just the one that motivated the reader — a parser
        # tested on one writer's output is tested on one writer's habits.
        run: |
          cargo test --release -p format-sinclair-zx-spectrum-szx \
            --test real_files -- --include-ignored --nocapture

      - name: HALT2INT128 (128K HALT-to-interrupt profile)
        # The oracle `spectrum-contention-the-way-out.md` cites for the
        # 128K's contention window. It had never run: the tape was not in
        # any corpus.
        run: |
          cargo test --release -p machine-sinclair-zx-spectrum-128k \
            --test tape_smoke -- --include-ignored --nocapture \
            halt2int128

      - name: ZXSpectrum4.net timing survey, 128K (ratchet 8 of 68)
        # The 128K's first graded real-software oracle. ~7 minutes.
        run: |
          cargo test --release -p runtime-sinclair-zx-spectrum \
            --test timing_survey_128k -- --include-ignored --nocapture

      - name: Upload the 128K survey report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spectrum-timing-survey-128k
          path: target/accuracy/spectrum-timing-survey-128k/**/report.json
          if-no-files-found: warn
