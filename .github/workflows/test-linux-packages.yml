name: Linux packages

on:
  workflow_dispatch:
    inputs:
      installer_target:
        description: "Host subset for the opt-in installer audit"
        required: false
        type: choice
        options:
          - all
          - windows
        default: all
      installer_journey:
        description: "Audit documented macOS Homebrew and Windows installer routes"
        required: false
        type: boolean
        default: false
      macos_developer_journey:
        description: "Run the pinned native Intel macOS developer handoffs"
        required: false
        type: boolean
        default: false
      linux_developer_journey:
        description: "Run the pinned native x86-64 Linux developer journey"
        required: false
        type: boolean
        default: false
      windows_developer_journey:
        description: "Run the pinned Windows Meteor Storm package-to-boot journey instead of Linux package builds"
        required: false
        type: boolean
        default: false
      windows_startup_regression:
        description: "Compare Spectrum startup before/after #1792 and run the pinned Windows journey"
        required: false
        type: boolean
        default: false
      release_run:
        description: "Existing release run whose artifacts should be tested (blank builds locally)"
        required: false
        type: string
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  install:
    if: ${{ !inputs.windows_startup_regression && !inputs.windows_developer_journey && !inputs.linux_developer_journey && !inputs.macos_developer_journey && !inputs.installer_journey }}
    name: Install and exercise (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PACKAGE_TARGET: ${{ matrix.target }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_AUTOREMOVE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install emulator build dependencies
        # Bounded and retried, as in ci.yml: an unreachable Ubuntu mirror
        # otherwise makes apt retry with its default timeouts and the job
        # hangs until it is cancelled.
        run: |
          bash scripts/ci/apt-install.sh libasound2-dev libudev-dev pkg-config libgtk-4-dev
      - name: Cache Rust artifacts
        if: inputs.plan == '' && inputs.release_run == ''
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build packages for this native runner
        if: inputs.plan == '' && inputs.release_run == ''
        shell: bash
        run: |
          set -euo pipefail
          dist_version=$(awk -F'"' '/^cargo-dist-version/{print $2}' Cargo.toml)
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${dist_version}/cargo-dist-installer.sh" -o "$RUNNER_TEMP/install-dist.sh"
          sh "$RUNNER_TEMP/install-dist.sh"
          mkdir -p target
          bash scripts/build-gtk-window.sh "$PACKAGE_TARGET"
          dist build --artifacts=all --target "$PACKAGE_TARGET" --output-format=json > target/package-test-manifest.json
      - name: Fetch the actual release packages
        if: inputs.plan != '' || inputs.release_run != ''
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib
          merge-multiple: true
          run-id: ${{ inputs.release_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Save the release plan
        if: inputs.plan != '' || inputs.release_run != ''
        shell: bash
        # The suite plan is larger than Linux's per-environment-entry limit.
        # It is already an artifact; keep it on disk for every process launch.
        run: cp target/distrib/plan-dist-manifest.json target/package-test-manifest.json
      - name: Set up Homebrew
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            curl --proto '=https' --tlsv1.2 -LsSf https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh -o "$RUNNER_TEMP/install-homebrew.sh"
            NONINTERACTIVE=1 /bin/bash "$RUNNER_TEMP/install-homebrew.sh"
          fi
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install generated formulae and check output
        shell: bash
        run: python3 scripts/test-linux-packages.py target/package-test-manifest.json "$PACKAGE_TARGET"

  windows-startup-regression:
    name: Windows Spectrum startup and package-to-boot regression
    if: github.repository == 'emu198x/emu198x' && github.event_name == 'workflow_dispatch' && inputs.windows_startup_regression
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: code198x/code-samples
          ref: '51297ac3196a990286b0d21a4dedd4653c0168f0'
          path: code-samples
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: '3a82574eb0b9e844bcedf6dd4d118cf84b84d13b'
          path: journey-audit
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install pinned Rust
        shell: pwsh
        run: |
          $channel = (Select-String '^channel = "([^"]+)"' rust-toolchain.toml).Matches.Groups[1].Value
          rustup toolchain install $channel --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-spectrum-startup-dist
      - name: Reproduce startup before heap allocation
        shell: pwsh
        run: |
          python -c @'
          import subprocess
          from pathlib import Path
          source = Path('crates/runtime-sinclair-zx-spectrum/src/family_runtime.rs')
          candidate = source.read_bytes()
          baseline = subprocess.check_output(['git', 'show', '9a22ce6c557399492269bf23a6b5994022e03e36:crates/runtime-sinclair-zx-spectrum/src/family_runtime.rs'])
          try:
              source.write_bytes(baseline)
              subprocess.run(['cargo', 'build', '--profile', 'dist', '-p', 'emu198x-spectrum'], check=True, timeout=900)
          finally:
              source.write_bytes(candidate)
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-windows-spectrum-startup.py --binary target/dist/emu198x-spectrum.exe --output "$env:RUNNER_TEMP/windows-startup-evidence/baseline" --expect-overflow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test the candidate with the original stack reserve
        shell: pwsh
        run: |
          cargo test --profile dist -p emu198x-spectrum --test script_startup --test mcp_startup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-windows-spectrum-startup.py --binary target/dist/emu198x-spectrum.exe --output "$env:RUNNER_TEMP/windows-startup-evidence/candidate"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare checked firmware and identify the candidate journey input
        env:
          ROM_B64: ${{ secrets.EMU198X_SPECTRUM_48K_ROM_B64 }}
          RELEASE_RUN: ${{ inputs.release_run }}
        shell: pwsh
        run: |
          python -c @'
          import base64, hashlib, json, os, zipfile
          from pathlib import Path
          if os.environ['RELEASE_RUN']:
              raise ValueError('This source regression does not consume a release_run')
          root = Path(os.environ['RUNNER_TEMP'])
          evidence = root / 'windows-startup-evidence'
          pins_file = Path('journey-audit/scripts/windows-developer-journey-inputs.json')
          original = pins_file.read_bytes()
          pins = json.loads(original)
          data = base64.b64decode(''.join(os.environ['ROM_B64'].split()), validate=True)
          if len(data) != 16384 or hashlib.sha256(data).hexdigest() != pins['firmware_sha256']:
              raise ValueError('Genuine 48K firmware is missing or differs')
          firmware = root / 'windows-startup-firmware'
          firmware.mkdir()
          (firmware / '48.rom').write_bytes(data)
          archive = root / 'candidate-spectrum.zip'
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED) as zipped:
              zipped.write('target/dist/emu198x-spectrum.exe', 'emu198x-spectrum.exe')
          tool = next(t for t in pins['tools'] if t['name'] == 'emu198x-spectrum')
          tool.update(version='source-' + os.environ['GITHUB_SHA'], archive=archive.name, url=archive.as_uri(), sha256=hashlib.sha256(archive.read_bytes()).hexdigest())
          pins_file.write_text(json.dumps(pins, indent=2) + '\n', encoding='utf-8')
          harness = Path('journey-audit/scripts/windows-developer-journey.py')
          (evidence / 'candidate-input.json').write_text(json.dumps({'candidate_revision': os.environ['GITHUB_SHA'], 'audit_revision': '3a82574eb0b9e844bcedf6dd4d118cf84b84d13b', 'unchanged_harness_sha256': hashlib.sha256(harness.read_bytes()).hexdigest(), 'original_pins_sha256': hashlib.sha256(original).hexdigest(), 'candidate_pins': pins}, indent=2) + '\n', encoding='utf-8')
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the unchanged positive and missing-CODE journey
        shell: pwsh
        run: |
          python journey-audit/scripts/windows-developer-journey.py `
            --samples-root "$env:GITHUB_WORKSPACE/code-samples" `
            --firmware "$env:RUNNER_TEMP/windows-startup-firmware/48.rom" `
            --work "$env:RUNNER_TEMP/windows-startup-work" `
            --output "$env:RUNNER_TEMP/windows-startup-evidence/journey"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove private firmware and candidate scratch
        if: always()
        shell: pwsh
        run: |
          python -c @'
          import json, os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          for name in ['windows-startup-firmware', 'windows-startup-work']:
              folder = root / name
              if folder.exists():
                  shutil.rmtree(folder)
              if folder.exists():
                  raise RuntimeError('Scratch cleanup failed')
          (root / 'candidate-spectrum.zip').unlink(missing_ok=True)
          evidence = root / 'windows-startup-evidence'
          evidence.mkdir(exist_ok=True)
          (evidence / 'cleanup.json').write_text(json.dumps({'firmware_removed': True, 'scratch_removed': True}) + '\n', encoding='utf-8')
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain only startup and journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-spectrum-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-startup-evidence/
          if-no-files-found: error
          retention-days: 30

  windows-developer-journey:
    name: Windows released-tool package-to-boot journey
    if: github.repository == 'emu198x/emu198x' && github.event_name == 'workflow_dispatch' && inputs.windows_developer_journey
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      SAMPLES_REVISION: '51297ac3196a990286b0d21a4dedd4653c0168f0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: code198x/code-samples
          ref: ${{ env.SAMPLES_REVISION }}
          path: code-samples
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check Windows journey rejection controls
        run: python -m unittest discover -s scripts -p test_windows_developer_journey.py -v
      - name: Materialise checked Windows-journey firmware
        env:
          ROM_B64: ${{ secrets.EMU198X_SPECTRUM_48K_ROM_B64 }}
          RELEASE_RUN: ${{ inputs.release_run }}
        shell: pwsh
        run: |
          python -c @'
          import base64, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          evidence = root / 'windows-developer-evidence'
          evidence.mkdir()
          record = evidence / 'firmware-check.json'
          record.write_text(json.dumps({'status': 'failed', 'firmware_validated': False}))
          if os.environ['RELEASE_RUN']:
              raise ValueError('Windows journey does not consume a candidate release_run')
          pins = json.loads(Path('scripts/windows-developer-journey-inputs.json').read_text())
          data = base64.b64decode(''.join(os.environ['ROM_B64'].split()), validate=True)
          if len(data) != 16384 or hashlib.sha256(data).hexdigest() != pins['firmware_sha256']:
              raise ValueError('Genuine 48K firmware is missing or differs; no runtime qualification')
          firmware = root / 'windows-developer-firmware'
          firmware.mkdir()
          (firmware / '48.rom').write_bytes(data)
          record.write_text(json.dumps({'status': 'passed', 'firmware_validated': True, 'sha256': pins['firmware_sha256']}))
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and cold-boot the published Windows tools
        shell: pwsh
        run: |
          python scripts/windows-developer-journey.py `
            --samples-root "$env:GITHUB_WORKSPACE/code-samples" `
            --firmware "$env:RUNNER_TEMP/windows-developer-firmware/48.rom" `
            --work "$env:RUNNER_TEMP/windows-developer-work" `
            --output "$env:RUNNER_TEMP/windows-developer-evidence/journey"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove private Windows-journey firmware
        if: always()
        shell: pwsh
        run: |
          python -c @'
          import os, shutil
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'windows-developer-firmware'
          if folder.exists():
              shutil.rmtree(folder)
          if folder.exists():
              raise RuntimeError('Private firmware cleanup failed')
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain only Windows journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-developer-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-developer-evidence/
          if-no-files-found: error
          retention-days: 30

  linux-developer-journey:
    name: Linux x64 released-tool developer journey
    if: github.repository == 'emu198x/emu198x' && github.event_name == 'workflow_dispatch' && inputs.linux_developer_journey
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SAMPLES_REVISION: '51297ac3196a990286b0d21a4dedd4653c0168f0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: code198x/code-samples
          ref: ${{ env.SAMPLES_REVISION }}
          path: code-samples
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install the published executables' runtime prerequisites
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/apt-install.sh libasound2 libudev1
          dpkg-query --show libasound2 libudev1 > "$RUNNER_TEMP/journey-prerequisites.txt"
      - name: Check Linux journey rejection controls
        run: python -m unittest discover -s scripts -p test_windows_developer_journey.py -v
      - name: Materialise checked Linux-journey firmware
        env:
          ROM_B64: ${{ secrets.EMU198X_SPECTRUM_48K_ROM_B64 }}
          RELEASE_RUN: ${{ inputs.release_run }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          evidence = root / 'linux-developer-evidence'
          evidence.mkdir()
          (evidence / 'runtime-prerequisites.txt').write_bytes((root / 'journey-prerequisites.txt').read_bytes())
          record = evidence / 'firmware-check.json'
          record.write_text(json.dumps({'status': 'failed', 'firmware_validated': False}))
          if os.environ['RELEASE_RUN']:
              raise ValueError('Linux journey does not consume a candidate release_run')
          pins = json.loads(Path('scripts/linux-developer-journey-inputs.json').read_text())
          data = base64.b64decode(''.join(os.environ['ROM_B64'].split()), validate=True)
          if len(data) != 16384 or hashlib.sha256(data).hexdigest() != pins['firmware_sha256']:
              raise ValueError('Genuine 48K firmware is missing or differs; no runtime qualification')
          firmware = root / 'linux-developer-firmware'
          firmware.mkdir()
          (firmware / '48.rom').write_bytes(data)
          record.write_text(json.dumps({'status': 'passed', 'firmware_validated': True, 'sha256': pins['firmware_sha256']}))
          PY
      - name: Build and debug with the published Linux tools
        shell: bash
        run: |
          set -euo pipefail
          python scripts/windows-developer-journey.py --pins scripts/linux-developer-journey-inputs.json \
            --samples-root "$GITHUB_WORKSPACE/code-samples" \
            --firmware "$RUNNER_TEMP/linux-developer-firmware/48.rom" \
            --work "$RUNNER_TEMP/linux-developer-work" \
            --output "$RUNNER_TEMP/linux-developer-evidence/journey"
      - name: Remove private Linux-journey firmware
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'linux-developer-firmware'
          if folder.exists():
              shutil.rmtree(folder)
          if folder.exists():
              raise RuntimeError('Private firmware cleanup failed')
          PY
      - name: Retain only Linux journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-developer-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-developer-evidence/
          if-no-files-found: error
          retention-days: 30

  macos-developer-journey:
    name: macOS x64 released-tool developer journey
    if: github.repository == 'emu198x/emu198x' && github.event_name == 'workflow_dispatch' && inputs.macos_developer_journey
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      SAMPLES_REVISION: '51297ac3196a990286b0d21a4dedd4653c0168f0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: code198x/code-samples
          ref: ${{ env.SAMPLES_REVISION }}
          path: code-samples
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check macOS journey rejection controls
        run: python -m unittest discover -s scripts -p test_windows_developer_journey.py -v
      - name: Materialise checked macOS-journey firmware
        env:
          ROM_B64: ${{ secrets.EMU198X_SPECTRUM_48K_ROM_B64 }}
          RELEASE_RUN: ${{ inputs.release_run }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          evidence = root / 'macos-developer-evidence'
          evidence.mkdir()
          record = evidence / 'firmware-check.json'
          record.write_text(json.dumps({'status': 'failed', 'firmware_validated': False}))
          if os.environ['RELEASE_RUN']:
              raise ValueError('macOS journey does not consume a candidate release_run')
          pins = json.loads(Path('scripts/macos-developer-journey-inputs.json').read_text())
          data = base64.b64decode(''.join(os.environ['ROM_B64'].split()), validate=True)
          if len(data) != 16384 or hashlib.sha256(data).hexdigest() != pins['firmware_sha256']:
              raise ValueError('Genuine 48K firmware is missing or differs; no runtime qualification')
          firmware = root / 'macos-developer-firmware'
          firmware.mkdir()
          (firmware / '48.rom').write_bytes(data)
          record.write_text(json.dumps({'status': 'passed', 'firmware_validated': True, 'sha256': pins['firmware_sha256']}))
          PY
      - name: Build and debug with the published macOS tools
        shell: bash
        run: |
          set -euo pipefail
          python scripts/windows-developer-journey.py --pins scripts/macos-developer-journey-inputs.json \
            --samples-root "$GITHUB_WORKSPACE/code-samples" \
            --firmware "$RUNNER_TEMP/macos-developer-firmware/48.rom" \
            --work "$RUNNER_TEMP/macos-developer-work" \
            --output "$RUNNER_TEMP/macos-developer-evidence/journey"
      - name: Provision the retained Amiga firmware privately
        env:
          GH_TOKEN: ${{ secrets.ACCURACY_CORPORA_TOKEN }}
          CORPORA_REPO: ${{ vars.ACCURACY_CORPORA_REPO }}
          CORPORA_TAG: ${{ vars.ACCURACY_CORPORA_TAG || 'v1' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/macos-developer-firmware/corpus"
          gh release download "$CORPORA_TAG" -R "$CORPORA_REPO" -p amiga-accuracy.tar.zst -p SHA256SUMS --dir "$RUNNER_TEMP/macos-developer-firmware/corpus"
          python - <<'PYCODE'
          import hashlib, os, tarfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'macos-developer-firmware'
          archive = root / 'corpus/amiga-accuracy.tar.zst'
          sums = (root / 'corpus/SHA256SUMS').read_text().splitlines()
          matches = [line.split()[0] for line in sums if line.split()[-1].lstrip('*') == archive.name]
          if matches != [hashlib.sha256(archive.read_bytes()).hexdigest()]:
              raise ValueError('Private corpus checksum differs')
          with tarfile.open(archive, mode='r:zst') as packed:
              members = [m for m in packed.getmembers() if m.isfile() and m.name == 'amiga-accuracy/kickstart-1.3-r34.5.rom']
              if len(members) != 1 or members[0].size != 262144:
                  raise ValueError('Missing unique Kickstart 1.3')
              stream = packed.extractfile(members[0])
              if stream is None:
                  raise ValueError('Missing firmware stream')
              data = stream.read()
          if hashlib.sha256(data).hexdigest() != 'ee05862d8102a08436ac4056da7d549db31625c7d47b24dfb7b3c9a5c113ca53':
              raise ValueError('Kickstart identity differs')
          (root / 'kick13.rom').write_bytes(data)
          PYCODE
      - name: Rebuild and cold-boot the retained Amiga sample
        shell: bash
        run: |
          set -euo pipefail
          python scripts/macos-amiga-journey.py \
            --fixtures "$GITHUB_WORKSPACE/scripts/developer-journey-fixtures/amiga" \
            --work "$RUNNER_TEMP/macos-developer-work" \
            --firmware "$RUNNER_TEMP/macos-developer-firmware/kick13.rom" \
            --output "$RUNNER_TEMP/macos-developer-evidence/amiga"
      - name: Remove private macOS-journey firmware
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          for name in ['macos-developer-firmware', 'macos-developer-work']:
              folder = Path(os.environ['RUNNER_TEMP']) / name
              if folder.exists():
                  shutil.rmtree(folder)
              if folder.exists():
                  raise RuntimeError('Private firmware or downloaded work cleanup failed')
          PY
      - name: Retain only macOS journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-developer-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-developer-evidence/
          if-no-files-found: error
          retention-days: 30

  installer-journey:
    name: Public installer journey (${{ matrix.host }})
    if: github.repository == 'emu198x/emu198x' && github.event_name == 'workflow_dispatch' && inputs.installer_journey
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.installer_target == 'windows'
              && '[{"host":"windows","runner":"windows-2022"}]'
              || '[{"host":"macos-intel","runner":"macos-15-intel"},{"host":"macos-arm","runner":"macos-15"},{"host":"windows","runner":"windows-2022"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: code198x/code-samples
          ref: '51297ac3196a990286b0d21a4dedd4653c0168f0'
          path: code-samples
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check archive and executable identity controls
        run: python -m unittest discover -s scripts -p test_installer_developer_journey.py -v
      - name: Provision checked installer-journey firmware
        env:
          ROM_B64: ${{ secrets.EMU198X_SPECTRUM_48K_ROM_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import base64, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          evidence = root / 'installer-journey-evidence'
          evidence.mkdir()
          record = evidence / 'firmware-check.json'
          record.write_text(json.dumps({'firmware_validated': False}))
          data = base64.b64decode(''.join(os.environ['ROM_B64'].split()), validate=True)
          sha = hashlib.sha256(data).hexdigest()
          if len(data) != 16384 or sha != 'd55daa439b673b0e3f5897f99ac37ecb45f974d1862b4dadb85dec34af99cb42':
              raise ValueError('Genuine firmware differs')
          private = root / 'installer-journey-firmware'
          private.mkdir()
          (private / '48.rom').write_bytes(data)
          record.write_text(json.dumps({'firmware_validated': True, 'sha256': sha}))
          PYCODE
      - name: Exercise the public installation routes and installed tools
        shell: bash
        run: |
          set -euo pipefail
          python scripts/installer-developer-journey.py --host '${{ matrix.host }}' \
            --samples-root "$GITHUB_WORKSPACE/code-samples" \
            --firmware "$RUNNER_TEMP/installer-journey-firmware/48.rom" \
            --work "$RUNNER_TEMP/installer-journey-work" \
            --output "$RUNNER_TEMP/installer-journey-evidence/install"
      - name: Remove private installer firmware and downloaded scratch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import json, os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          for name in ['installer-journey-firmware', 'installer-journey-work']:
              folder = root / name
              if folder.exists():
                  shutil.rmtree(folder)
              if folder.exists():
                  raise RuntimeError('Task scratch remains')
          evidence = root / 'installer-journey-evidence'
          evidence.mkdir(exist_ok=True)
          (evidence / 'cleanup.json').write_text(json.dumps({'firmware_removed': True, 'scratch_removed': True}))
          PYCODE
      - name: Retain safe installer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-journey-${{ matrix.host }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installer-journey-evidence/
          if-no-files-found: error
          retention-days: 30
