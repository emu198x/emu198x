name: Linux packages

on:
  workflow_dispatch:
    inputs:
      windows_developer_journey:
        description: "Run the pinned Windows Meteor Storm package-to-boot journey instead of Linux package builds"
        required: false
        type: boolean
        default: false
      release_run:
        description: "Existing release run whose artifacts should be tested (blank builds locally)"
        required: false
        type: string
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  install:
    if: ${{ !inputs.windows_developer_journey }}
    name: Install and exercise (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_TARGET: ${{ matrix.target }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_AUTOREMOVE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install emulator build dependencies
        # Bounded and retried, as in ci.yml: an unreachable Ubuntu mirror
        # otherwise makes apt retry with its default timeouts and the job
        # hangs until it is cancelled.
        run: |
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            sudo timeout 120 apt-get $apt_opts update \
              || echo "::warning::apt-get update attempt ${attempt} incomplete (mirror unreachable)"
            if sudo timeout 180 apt-get $apt_opts install -y --no-install-recommends \
                 libasound2-dev libudev-dev pkg-config; then
              exit 0
            fi
            echo "::warning::apt-get install attempt ${attempt} failed; retrying"
            sleep 10
          done
          echo "::error::apt failed after three bounded attempts"
          exit 1
      - name: Cache Rust artifacts
        if: inputs.plan == '' && inputs.release_run == ''
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build packages for this native runner
        if: inputs.plan == '' && inputs.release_run == ''
        shell: bash
        run: |
          set -euo pipefail
          dist_version=$(awk -F'"' '/^cargo-dist-version/{print $2}' Cargo.toml)
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${dist_version}/cargo-dist-installer.sh" -o "$RUNNER_TEMP/install-dist.sh"
          sh "$RUNNER_TEMP/install-dist.sh"
          mkdir -p target
          dist build --artifacts=all --target "$PACKAGE_TARGET" --output-format=json > target/package-test-manifest.json
      - name: Fetch the actual release packages
        if: inputs.plan != '' || inputs.release_run != ''
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib
          merge-multiple: true
          run-id: ${{ inputs.release_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Save the release plan
        if: inputs.plan != '' || inputs.release_run != ''
        shell: bash
        # The suite plan is larger than Linux's per-environment-entry limit.
        # It is already an artifact; keep it on disk for every process launch.
        run: cp target/distrib/plan-dist-manifest.json target/package-test-manifest.json
      - name: Set up Homebrew
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            curl --proto '=https' --tlsv1.2 -LsSf https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh -o "$RUNNER_TEMP/install-homebrew.sh"
            NONINTERACTIVE=1 /bin/bash "$RUNNER_TEMP/install-homebrew.sh"
          fi
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install generated formulae and check output
        shell: bash
        run: python3 scripts/test-linux-packages.py target/package-test-manifest.json "$PACKAGE_TARGET"

  windows-developer-journey:
    name: Windows released-tool package-to-boot journey
    if: github.repository == 'emu198x/emu198x' && github.event_name == 'workflow_dispatch' && inputs.windows_developer_journey
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      SAMPLES_REVISION: '51297ac3196a990286b0d21a4dedd4653c0168f0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: code198x/code-samples
          ref: ${{ env.SAMPLES_REVISION }}
          path: code-samples
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check Windows journey rejection controls
        run: python -m unittest discover -s scripts -p test_windows_developer_journey.py -v
      - name: Materialise checked Windows-journey firmware
        env:
          ROM_B64: ${{ secrets.EMU198X_SPECTRUM_48K_ROM_B64 }}
          RELEASE_RUN: ${{ inputs.release_run }}
        shell: pwsh
        run: |
          python -c @'
          import base64, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          evidence = root / 'windows-developer-evidence'
          evidence.mkdir()
          record = evidence / 'firmware-check.json'
          record.write_text(json.dumps({'status': 'failed', 'firmware_validated': False}))
          if os.environ['RELEASE_RUN']:
              raise ValueError('Windows journey does not consume a candidate release_run')
          pins = json.loads(Path('scripts/windows-developer-journey-inputs.json').read_text())
          data = base64.b64decode(''.join(os.environ['ROM_B64'].split()), validate=True)
          if len(data) != 16384 or hashlib.sha256(data).hexdigest() != pins['firmware_sha256']:
              raise ValueError('Genuine 48K firmware is missing or differs; no runtime qualification')
          firmware = root / 'windows-developer-firmware'
          firmware.mkdir()
          (firmware / '48.rom').write_bytes(data)
          record.write_text(json.dumps({'status': 'passed', 'firmware_validated': True, 'sha256': pins['firmware_sha256']}))
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and cold-boot the published Windows tools
        shell: pwsh
        run: |
          python scripts/windows-developer-journey.py `
            --samples-root "$env:GITHUB_WORKSPACE/code-samples" `
            --firmware "$env:RUNNER_TEMP/windows-developer-firmware/48.rom" `
            --work "$env:RUNNER_TEMP/windows-developer-work" `
            --output "$env:RUNNER_TEMP/windows-developer-evidence/journey"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove private Windows-journey firmware
        if: always()
        shell: pwsh
        run: |
          python -c @'
          import os, shutil
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'windows-developer-firmware'
          if folder.exists():
              shutil.rmtree(folder)
          if folder.exists():
              raise RuntimeError('Private firmware cleanup failed')
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain only Windows journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-developer-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-developer-evidence/
          if-no-files-found: error
          retention-days: 30
