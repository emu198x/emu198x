name: Prepare release (prototype)

# A candidate replacement for the release-plz half of "Maintain release".
#
# release-plz reasons in *packages*. This repo is one suite, one version, one
# changelog — every crate carries `version.workspace = true` — so almost all of
# that machinery had already been switched off: publishing, tagging, GitHub
# releases and the changelog are disabled in release-plz.toml, leaving 29
# hand-maintained [[package]] entries and a pinned fork of an unmerged upstream
# PR to do one job, decide the next version.
#
# That last job is what keeps breaking. The suite tag `v{{ version }}` is shared
# by every package, so release-plz resolved "latest release of
# emu198x-amstrad-cpc" to v0.2.3 — a tag from an hour before that crate was
# written — checked out a worktree there, and failed hard because the package
# was not in it. Every run since 2026-08-15 died at that step, and because the
# changelog step sits after it in the same job, the release PR froze two days
# back with 14 entries missing.
#
# Deliberately `workflow_dispatch` only: it runs beside "Maintain release" for
# comparison and does not race it. Nothing here tags or publishes — the suite
# tag is still cut by the existing workflow on merge, and cargo-dist still
# consumes it.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute the version and changelog, but open no PR"
        type: boolean
        default: true

permissions:
  pull-requests: write
  contents: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # git-cliff needs full history to see every commit since the tag.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Read pinned toolchain
        id: toolchain
        run: echo "channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1

      - name: Compute the next version
        id: version
        run: |
          set -euo pipefail
          version=$(scripts/prepare-release.py --print)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "next version: ${version}"

      - name: Apply the version to the manifests
        run: |
          set -euo pipefail
          scripts/prepare-release.py --apply
          # Rewriting the requirements changes what cargo resolves, so the
          # lockfile has to be regenerated in the same step that moved them —
          # a stale lock is how a green CI ships an unbuildable tag.
          cargo metadata --format-version 1 > /dev/null

      - name: Write the changelog
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # Replace this version's section rather than appending another copy;
          # regenerating wholesale would be idempotent but would destroy the
          # hand-written v0.1.0 prose.
          python3 scripts/changelog-section-reset.py CHANGELOG.md "${version}"
          git-cliff --unreleased --tag "v${version}" --prepend CHANGELOG.md

      - name: Show what would change
        run: |
          echo "::group::manifest + changelog diff (stat)"
          git diff --stat
          echo "::endgroup::"
          echo "::group::changelog"
          git diff -- CHANGELOG.md | head -80
          echo "::endgroup::"

      - name: Open or update the release PR
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          branch="release/v${version}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add Cargo.toml Cargo.lock CHANGELOG.md crates/*/Cargo.toml
          if git diff --cached --quiet; then
            echo "nothing to release"
            exit 0
          fi
          git commit -m "chore: release v${version}"
          git push --force-with-lease origin "$branch"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "release PR already open for ${branch}; updated in place"
          else
            gh pr create --base main --head "$branch" \
              --title "chore: release v${version}" \
              --body "Prepared by \`prepare-release.py\` + git-cliff. Merging cuts the suite tag \`v${version}\`."
          fi
