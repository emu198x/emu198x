#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "write"

# The jobs that write to the repo use RELEASE_PLZ_TOKEN, falling back to
# GITHUB_TOKEN, so no job depends on GITHUB_TOKEN carrying a write scope. The
# `contents: write` block above should be enough on its own, but v0.4.0's host
# step got `HTTP 403: Resource not accessible by integration` from
# `gh release create` under GITHUB_TOKEN, on a file that had published v0.3.0
# three hours earlier; that failure was never explained, and the PAT
# sidesteps it.

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      # Added by hand (allow-dirty = ["ci"]). macOS signing and notarisation
      # switch on together, and only when all six secrets exist; with none of
      # them the build is unsigned exactly as before, and a partial set fails
      # rather than shipping something half-done. dist signs each binary
      # before archiving it when the CODESIGN_* variables are set, so they are
      # exported here only on that path: dist treats an empty variable as set
      # and would try to sign with it. Secrets and setup:
      # .github/macos-signing.md.
      - name: Configure macOS signing
        id: macos-signing
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        env:
          CODESIGN_CERTIFICATE: ${{ secrets.CODESIGN_CERTIFICATE }}
          CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          NOTARYTOOL_KEY: ${{ secrets.NOTARYTOOL_KEY }}
          NOTARYTOOL_KEY_ID: ${{ secrets.NOTARYTOOL_KEY_ID }}
          NOTARYTOOL_ISSUER: ${{ secrets.NOTARYTOOL_ISSUER }}
        run: |
          set -euo pipefail

          names=(CODESIGN_CERTIFICATE CODESIGN_CERTIFICATE_PASSWORD CODESIGN_IDENTITY NOTARYTOOL_KEY NOTARYTOOL_KEY_ID NOTARYTOOL_ISSUER)
          missing=()
          for name in "${names[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ ${#missing[@]} -eq ${#names[@]} ]; then
            echo "::notice::macOS signing secrets not set; building unsigned binaries. See .github/macos-signing.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::macOS signing is partly configured; missing secrets: ${missing[*]}. See .github/macos-signing.md."
            exit 1
          fi

          # dist decodes the certificate as unwrapped base64; tolerate a value
          # pasted with line breaks.
          certificate=$(printf '%s' "$CODESIGN_CERTIFICATE" | tr -d '[:space:]')
          delimiter="EOF_$(uuidgen)"
          {
            echo "CODESIGN_IDENTITY<<$delimiter"
            printf '%s\n' "$CODESIGN_IDENTITY"
            echo "$delimiter"
            echo "CODESIGN_CERTIFICATE_PASSWORD<<$delimiter"
            printf '%s\n' "$CODESIGN_CERTIFICATE_PASSWORD"
            echo "$delimiter"
            echo "CODESIGN_CERTIFICATE=$certificate"
            # Hardened runtime, which notarisation requires.
            echo "CODESIGN_OPTIONS=runtime"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      # Added by hand (allow-dirty = ["ci"]); dist 0.32 signs but does not
      # notarise. Checks every binary in this target's archives carries a
      # Developer ID signature with the hardened runtime and a secure
      # timestamp, then submits them to Apple in one zip and fails the release
      # unless Apple accepts it. The archives are not changed: a bare
      # executable cannot be stapled, so Gatekeeper finds the notarisation
      # ticket online on first launch.
      - name: Notarise macOS binaries
        if: ${{ steps.macos-signing.outputs.enabled == 'true' }}
        shell: bash
        env:
          NOTARYTOOL_KEY: ${{ secrets.NOTARYTOOL_KEY }}
          NOTARYTOOL_KEY_ID: ${{ secrets.NOTARYTOOL_KEY_ID }}
          NOTARYTOOL_ISSUER: ${{ secrets.NOTARYTOOL_ISSUER }}
        run: |
          set -euo pipefail

          work="$RUNNER_TEMP/notarise"
          rm -rf "$work"
          mkdir -p "$work/extract" "$work/binaries"
          key="$work/AuthKey.p8"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$NOTARYTOOL_KEY" > "$key")

          archives=()
          while IFS= read -r path; do
            case "$path" in
              *.tar.gz) archives+=("$path") ;;
            esac
          done < <(dist print-upload-files-from-manifest --manifest dist-manifest.json)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::no .tar.gz archives listed in dist-manifest.json"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            tar -xzf "$archive" -C "$work/extract"
          done

          count=0
          failed=0
          while IFS= read -r -d '' binary; do
            if [[ "$(file -b "$binary")" != *Mach-O* ]]; then
              continue
            fi
            name=$(basename "$binary")
            if ! codesign --verify --strict --verbose=2 "$binary"; then
              echo "::error::$name: signature does not verify"
              failed=1
              continue
            fi
            details=$(codesign -dvv "$binary" 2>&1)
            if ! grep -q '^Authority=Developer ID Application:' <<<"$details"; then
              echo "::error::$name: not signed with a Developer ID Application certificate"
              failed=1
            fi
            if ! grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime' <<<"$details"; then
              echo "::error::$name: hardened runtime flag missing"
              failed=1
            fi
            if ! grep -q '^Timestamp=' <<<"$details"; then
              echo "::error::$name: no secure timestamp"
              failed=1
            fi
            if [ -e "$work/binaries/$name" ]; then
              echo "::error::$name appears in more than one archive"
              failed=1
            fi
            cp "$binary" "$work/binaries/$name"
            count=$((count + 1))
          done < <(find "$work/extract" -type f -perm -u+x -print0)
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "::error::no Mach-O binaries found in ${archives[*]}"
            exit 1
          fi
          echo "$count signed binaries verified"

          zip="$work/binaries.zip"
          ditto -c -k --keepParent "$work/binaries" "$zip"

          status_rc=0
          result=$(xcrun notarytool submit "$zip" \
            --key "$key" --key-id "$NOTARYTOOL_KEY_ID" --issuer "$NOTARYTOOL_ISSUER" \
            --wait --timeout 1h --output-format json) || status_rc=$?
          echo "$result"
          id=$(jq -r '.id // empty' <<<"$result" 2>/dev/null || true)
          status=$(jq -r '.status // empty' <<<"$result" 2>/dev/null || true)
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarisation ${status:-failed} (notarytool exit $status_rc)"
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" \
                --key "$key" --key-id "$NOTARYTOOL_KEY_ID" --issuer "$NOTARYTOOL_ISSUER" || true
            fi
            exit 1
          fi
          echo "Notarised: submission $id"
      # dist deletes each temporary signing keychain's file when it finishes,
      # but leaves it on the user search list and as the default keychain.
      # Housekeeping only, so nothing here fails the release.
      - name: Remove signing keychains
        if: ${{ always() && steps.macos-signing.outputs.enabled == 'true' }}
        shell: bash
        run: |
          security list-keychains -d user | tr -d '"' | sed 's/^ *//' | while read -r keychain; do
            case "$keychain" in
              */signing.keychain-db) security delete-keychain "$keychain" 2>/dev/null || true ;;
            esac
          done || true
          remaining=()
          while read -r keychain; do
            case "$keychain" in
              */signing.keychain-db) ;;
              *) remaining+=("$keychain") ;;
            esac
          done < <(security list-keychains -d user | tr -d '"' | sed 's/^ *//')
          security list-keychains -d user -s "${remaining[@]}" || true
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          # No --target. The tag is what fired this workflow, so it exists and
          # already pins the commit; GitHub documents target_commitish as
          # unused in that case, yet on 2026-09-02 it rejected a commit SHA
          # there with 403 (PAT) and 404 (user token) for v0.19.1, minutes
          # after accepting the same flag for v0.19.0. dist's generated step
          # passes `--target` with the pushed SHA; the tag makes it redundant.
          gh release create "${{ needs.plan.outputs.tag }}" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

  # Added by hand, not by `dist generate`. This repo sets allow-dirty = ["ci"]
  # because the action pins here are maintained outside dist's template, so
  # regenerating the file to add this job would revert them. The block matches
  # what dist emits for post-announce-jobs = ["./notify-discord"], which is
  # recorded in Cargo.toml so a future regeneration reproduces it.
  custom-notify-discord:
    needs:
      - plan
      - announce
    uses: ./.github/workflows/notify-discord.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit
