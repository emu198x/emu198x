name: Notify Discord

# Announces a release in Discord, as cargo-dist's post-announce job
# (`post-announce-jobs = ["./notify-discord"]`). The posting is shared by the
# family in stevehill1981/198x-workflows' discord-release.yml: full notes,
# without install tables, go to this project's channel, and a one-line digest
# linking to them goes to the family channel.
#
# Running as a post-announce job rather than on `release: published` matters:
# the GitHub Release is cut with GITHUB_TOKEN, and a release made that way
# fires no other workflow.

on:
  workflow_call:
    inputs:
      plan:
        description: "The dist manifest, passed by the release workflow and deliberately unused: it can exceed the 128 KB a single environment string may hold."
        required: true
        type: string
      release_tag:
        description: "The tag to announce, where the release workflow knows it; otherwise the ref that triggered the run."
        required: false
        type: string
        default: ''
    secrets:
      DISCORD_RELEASE_WEBHOOK:
        required: false
      DISCORD_RELEASE_WEBHOOK_ALL:
        required: false

jobs:
  notify:
    name: Post to Discord
    uses: stevehill1981/198x-workflows/.github/workflows/discord-release.yml@v1
    with:
      tag: ${{ inputs.release_tag || github.ref_name }}
    # Named, not `inherit`: GitHub passes inherited secrets only within one
    # organisation or enterprise, and the shared workflow is in a personal
    # account.
    secrets:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      DISCORD_RELEASE_WEBHOOK_ALL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_ALL }}
