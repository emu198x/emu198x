# Publish the browser packages to npm, from each release, via trusted publishing.
#
# Two packages (umbrella decisions/browser-bundles-ship-as-npm-packages.md):
#   @emu198x/player       the whole browser player, at the release's version;
#   @emu198x/zx-spectrum  the Spectrum module, at its own [package.metadata.npm]
#                         version, republished only when that is bumped.
#
# Only a release publishes: this runs after the Release workflow succeeds for a
# vX.Y.Z tag, so a site only ever pins a build that passed release
# qualification. A manual dispatch names a tag, for the first publish of a new
# package or to reconcile one that failed; publishing a version npm already has
# is a no-op.
#
# No NPM_TOKEN. `id-token: write` lets npm verify this workflow against the
# trusted publisher configured on each package, and provenance is attested
# automatically: each tarball can be traced to this workflow and its commit.
#
# Both packages embed the Spectrum 48K ROM, under the permission recorded in
# knowledge/decisions/test-rom-policy.md § Firmware in a published browser
# build. It arrives as the encrypted EMU198X_SPECTRUM_48K_ROM_B64 secret and the
# builds refuse any image but the genuine one. Without the secret nothing is
# published, rather than a package with no machine in it.
name: Publish to npm

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish from, such as v0.38.4"
        required: true
        type: string

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Find the release to publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      version: ${{ steps.find.outputs.version }}
      publish: ${{ steps.find.outputs.publish }}
    steps:
      - name: Decide whether this run publishes
        id: find
        env:
          EVENT: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
          ROM_B64: ${{ secrets.EMU198X_SPECTRUM_48K_ROM_B64 }}
        run: |
          set -euo pipefail
          # Release also runs for pull requests and pushes to main; only a
          # successful run for a version tag has released anything.
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
          elif [ "$RUN_CONCLUSION" = success ] && [ "$RUN_EVENT" = push ]; then
            tag="$RUN_REF"
          else
            tag=""
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a successful release run for a vX.Y.Z tag; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$ROM_B64" ]; then
            echo "::warning::EMU198X_SPECTRUM_48K_ROM_B64 not set; nothing was published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing from $tag."

  zx-spectrum:
    name: "@emu198x/zx-spectrum"
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Read the toolchain the repository pins
        id: toolchain
        run: echo "channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-npm

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs a recent npm; the one bundled with Node may
      # predate it. Pinned to a major so a new npm can't change publish
      # behaviour without an edit here.
      - name: Use an npm that speaks OIDC
        run: npm install -g npm@11

      - name: Provide the 48K ROM
        env:
          ROM_B64: ${{ secrets.EMU198X_SPECTRUM_48K_ROM_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "${ROM_B64}" | base64 -d > "${RUNNER_TEMP}/spectrum-48k.rom"
          echo "EMU198X_SPECTRUM_48K_ROM=${RUNNER_TEMP}/spectrum-48k.rom" >> "$GITHUB_ENV"

      - name: Build and publish
        run: bash crates/emu198x-spectrum-web/scripts/build-npm.sh --publish

  player:
    name: "@emu198x/player"
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      # The fleet catalogue tool runs natively and links ALSA and udev.
      # Bounded, so a dead mirror fails in minutes rather than hanging
      # (scripts/check-workflow-apt.py).
      - name: Install Linux build dependencies
        run: |
          bash scripts/ci/apt-install.sh pkg-config libasound2-dev libudev-dev

      - name: Read the toolchain the repository pins
        id: toolchain
        run: echo "channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-npm-player

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use an npm that speaks OIDC
        run: npm install -g npm@11

      - name: Provide the 48K ROM
        env:
          ROM_B64: ${{ secrets.EMU198X_SPECTRUM_48K_ROM_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "${ROM_B64}" | base64 -d > "${RUNNER_TEMP}/spectrum-48k.rom"
          echo "EMU198X_SPECTRUM_48K_ROM=${RUNNER_TEMP}/spectrum-48k.rom" >> "$GITHUB_ENV"

      - name: Build and publish
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: bash web-player/build-npm.sh "$VERSION" --publish
