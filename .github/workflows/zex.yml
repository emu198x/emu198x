name: ZEX

# Frank Cringle's Z80 exerciser (ZEXDOC + ZEXALL). Long-running — tens of
# minutes in release on the GitHub runner — and the Z80 core is mature, so
# running it on every push made every CI run wait tens of minutes for
# near-zero marginal signal. It now runs only when the Z80 core or its
# checked-in `.com` corpus changes, plus on demand via the Actions tab.
on:
  push:
    branches:
      - main
    paths:
      - 'crates/zilog-z80/**'
      - 'test-data/zex/**'
      - '.github/workflows/zex.yml'
  pull_request:
    paths:
      - 'crates/zilog-z80/**'
      - 'test-data/zex/**'
      - '.github/workflows/zex.yml'
  workflow_dispatch:

concurrency:
  group: zex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zex:
    name: ZEXDOC + ZEXALL
    runs-on: ubuntu-latest
    # Hermetic — the `.com` corpus is checked in at test-data/zex/.

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: zex

      - name: Run ZEXDOC + ZEXALL
        run: cargo test --release -p zilog-z80 --test zex_tests -- --include-ignored --nocapture
