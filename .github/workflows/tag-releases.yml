name: Tag release

# Interim suite tagging.
#
# release-plz prepares the version and changelog PR but deliberately does not
# create tags or GitHub Releases. This workflow reads the merged workspace
# package version and creates one suite tag, `v<version>`. cargo-dist builds
# every distable emulator binary at that version into one public release.
#
# To release the suite: bump the workspace package version and the emulator
# binary package versions together, merge to main, and this workflow tags the
# merge. Existing suite tags are left alone, so it is safe to run on every push.
#
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tag-releases
  cancel-in-progress: false

jobs:
  tag:
    name: Tag suite release from Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A PAT (not GITHUB_TOKEN) is required so that pushing a tag
          # fires release.yml — tag pushes made with GITHUB_TOKEN do not
          # trigger other workflows.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create suite tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          version=$(
            awk '
              /^\[workspace.package\]/ { in_workspace_package = 1; next }
              /^\[/ { in_workspace_package = 0 }
              in_workspace_package && /^version = / {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )

          if [ -z "$version" ]; then
            echo "::error::no workspace package version found in Cargo.toml"
            exit 1
          fi

          mismatches=0
          for manifest in crates/emu198x-*/Cargo.toml; do
            name=$(awk -F'"' '/^name = / { print $2; exit }' "$manifest")
            case "$name" in
              emu198x-catalogue|emu198x-native-video|emu198x-shell|emu198x-ui)
                continue
                ;;
            esac

            if grep -q '^version\.workspace = true$' "$manifest"; then
              package_version=$version
            else
              package_version=$(awk -F'"' '/^version = / { print $2; exit }' "$manifest")
            fi
            if [ "$package_version" != "$version" ]; then
              echo "::error::${name} is ${package_version}, expected suite version ${version}"
              mismatches=$((mismatches + 1))
            fi
          done

          if [ "$mismatches" -ne 0 ]; then
            exit 1
          fi

          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "exists: ${tag}"
          else
            echo "creating: ${tag}"
            git tag "${tag}"
            git push origin "${tag}"
          fi
