name: Qualify producer packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Each producer job checks its own source lock and archives, on its own native
# host, before uploading (release.yml, "Recheck packaged bytes after
# notarization"). A second check here needed a second runner per platform, and
# GitHub's Apple Silicon runners are scarce enough to fail releases; see
# knowledge/decisions/producer-source-locks.md.
jobs:
  linux-install:
    uses: ./.github/workflows/test-linux-packages.yml
    with:
      plan: ${{ inputs.plan }}
