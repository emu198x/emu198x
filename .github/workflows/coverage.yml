name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        # libasound2-dev: audio (cpal). libudev-dev: gamepad enumeration
        # via gilrs for the host-input layer.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Install nightly Rust toolchain for branch coverage
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run coverage suite
        run: ./scripts/coverage.sh

      - name: Run Spectrum-side coverage gate
        # Gates the SOLID criterion 11 floor (≥90% line coverage on
        # Spectrum-specific crates). The summary step below runs
        # regardless via the `if: always()` guard, so even when the
        # gate fails the publish/upload steps still capture the
        # report — making it easy to diagnose what fell below.
        run: ./scripts/coverage-gate.sh

      - name: Publish coverage summary
        if: always()
        run: |
          total_line="$(grep '^TOTAL' target/llvm-cov/coverage-summary.txt | tail -n 1)"
          {
            echo "## Coverage"
            echo
            echo '```text'
            echo "${total_line}"
            echo '```'
            echo
            echo "- Branch coverage is enabled in this report path."
            echo "- Text summary: \`target/llvm-cov/coverage-summary.txt\`"
            echo "- JSON summary: \`target/llvm-cov/coverage-summary.json\`"
            echo "- LCOV export: \`target/llvm-cov/lcov.info\`"
            echo "- HTML report: uploaded as the \`coverage-html\` artifact"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage summary artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-summary
          path: |
            target/llvm-cov/coverage-summary.txt
            target/llvm-cov/coverage-summary.json
            target/llvm-cov/lcov.info

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html
          path: target/llvm-cov/html
