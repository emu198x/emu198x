name: Maintain release

# release-plz/release-plz#2789 fixes the git_only comparison failure caused by
# the unpublished external `isa-disasm` dependency. Pin the exact reviewed
# commit while the upstream PR remains unmerged.
#
# This workflow creates the single suite tag consumed by cargo-dist, then asks
# release-plz to open or update the next version/changelog PR.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: maintain-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  contents: write

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # release-plz needs the full history to compute the changelog
          # diff from the last tag.
          fetch-depth: 0
          # Falls back to GITHUB_TOKEN if RELEASE_PLZ_TOKEN isn't set.
          # NOTE: tag pushes made with GITHUB_TOKEN do not fire other
          # workflows, so the cargo-dist release.yml will not trigger
          # automatically unless RELEASE_PLZ_TOKEN is a PAT (or GitHub
          # App token) with workflow-trigger rights.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create suite tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          version=$(
            awk '
              /^\[workspace.package\]/ { in_workspace_package = 1; next }
              /^\[/ { in_workspace_package = 0 }
              in_workspace_package && /^version = / {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )

          if [ -z "$version" ]; then
            echo "::error::no workspace package version found in Cargo.toml"
            exit 1
          fi

          mismatches=0
          for manifest in crates/emu198x-*/Cargo.toml; do
            name=$(awk -F'"' '/^name = / { print $2; exit }' "$manifest")
            case "$name" in
              emu198x-catalogue|emu198x-native-video|emu198x-shell|emu198x-ui)
                continue
                ;;
            esac

            if grep -q '^version\.workspace = true$' "$manifest"; then
              package_version=$version
            else
              package_version=$(awk -F'"' '/^version = / { print $2; exit }' "$manifest")
            fi
            if [ "$package_version" != "$version" ]; then
              echo "::error::${name} is ${package_version}, expected suite version ${version}"
              mismatches=$((mismatches + 1))
            fi
          done

          if [ "$mismatches" -ne 0 ]; then
            exit 1
          fi

          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "exists: ${tag}"
          else
            echo "creating: ${tag}"
            git tag "${tag}"
            git push origin "${tag}"
          fi

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Install Linux build dependencies
        # cargo metadata needs the same system deps as a normal build
        # because release-plz invokes cargo to inspect the workspace.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Install pinned release-plz
        uses: baptiste0928/cargo-install@v3.4.0
        with:
          crate: release-plz
          git: https://github.com/structured-world/release-plz
          commit: e8ca8da97dc8f472820a67eece651604887b1c7d

      - name: Run release-plz (open/update release PR)
        run: release-plz release-pr
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  # A separate job, and deliberately `if: always()`.
  #
  # This used to be three more steps in the job above, which meant it only ran
  # when release-plz had succeeded. When release-plz started failing on
  # 2026-08-15 the changelog stopped being written with it, and the release PR
  # sat 39 commits behind for two days carrying 5 entries against a range of
  # 21. Nothing reported that: the job was red for the version bump, and the
  # stale changelog was a second, silent casualty.
  #
  # The coupling was incidental. This reads the version from the release PR's
  # own branch, not from release-plz's output, so it has everything it needs
  # whether or not release-plz ran. `needs:` keeps the ordering — when
  # release-plz does work, its version is on the branch before this reads it.
  #
  # It also needs no Rust toolchain, so it cannot fail for a reason that has
  # nothing to do with changelogs.
  changelog:
    name: Changelog
    needs: [release-plz]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      # release-plz reasons in *packages* and only considers the ones it is
      # configured to release, so 181 of this workspace's 209 crates were
      # invisible to it — v0.2.2 came out with one entry against eighty-six
      # commits. git-cliff reasons in *commits* and has no package model, which
      # is what this repo actually is: one suite, one version, one changelog.
      #
      # The version comes from the release PR branch's own manifest, which is
      # where release-plz writes it — so this needs release-plz to have *run*,
      # not to have succeeded.
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1

      - name: Write the changelog onto the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          branch=$(gh pr list --state open --search 'chore: release' \
                     --json headRefName --jq '.[0].headRefName // empty')
          if [ -z "$branch" ]; then
            echo "no open release PR — nothing to write a changelog onto"
            exit 0
          fi

          git fetch origin "$branch"
          git checkout "$branch"

          # The version release-plz just wrote is the one to file entries under.
          version=$(awk '
            /^\[workspace.package\]/ { in_wp = 1; next }
            /^\[/ { in_wp = 0 }
            in_wp && /^version = / { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)

          # Replace this version's section rather than appending another copy:
          # this workflow runs on every push to main, and `--prepend` inserts
          # unconditionally. Regenerating the whole file would be idempotent for
          # free but would destroy the hand-written v0.1.0 prose.
          python3 scripts/changelog-section-reset.py CHANGELOG.md "${version}"
          git-cliff --unreleased --tag "v${version}" --prepend CHANGELOG.md

          if git diff --quiet -- CHANGELOG.md; then
            echo "changelog already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: regenerate the changelog for v${version}"
          git push origin "$branch"
