name: Release-plz

# PAUSED — manual-dispatch only.
#
# release-plz's git_only flow currently fails here: `cargo package`
# cannot resolve the unpublished external git dependency `isa-disasm`
# (asm198x), so "determine next versions" errors out. The fix is
# release-plz/release-plz#2789 (source-dir fallback), not yet merged.
# Until it ships, the per-machine tags are created by tag-releases.yml
# from the versions in each Cargo.toml.
#
# To re-enable: once #2789 is released, bump the release-plz/action
# version below, restore the `push` trigger (replace `workflow_dispatch`
# with the commented block), and delete tag-releases.yml. Tracking issue:
# release-plz/release-plz#2595.
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  contents: write

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # release-plz needs the full history to compute the changelog
          # diff from the last tag.
          fetch-depth: 0
          # Falls back to GITHUB_TOKEN if RELEASE_PLZ_TOKEN isn't set.
          # NOTE: tag pushes made with GITHUB_TOKEN do not fire other
          # workflows, so the cargo-dist release.yml will not trigger
          # automatically unless RELEASE_PLZ_TOKEN is a PAT (or GitHub
          # App token) with workflow-trigger rights.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Install Linux build dependencies
        # cargo metadata needs the same system deps as a normal build
        # because release-plz invokes cargo to inspect the workspace.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Run release-plz (open/update release PR)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run release-plz (tag merged releases)
        # Without this step, merging a release PR bumps the versions but never
        # tags — so cargo-dist's release.yml never fires. The PAT (not
        # GITHUB_TOKEN) is what lets these tag pushes trigger release.yml.
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
