name: Release-plz

# release-plz/release-plz#2789 fixes the git_only comparison failure caused by
# the unpublished external `isa-disasm` dependency. Pin the exact reviewed
# commit while the upstream PR remains unmerged.
#
# Keep tag-releases.yml: release-plz owns version/changelog PRs, while that
# workflow owns the single suite tag consumed by cargo-dist.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  contents: write

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # release-plz needs the full history to compute the changelog
          # diff from the last tag.
          fetch-depth: 0
          # Falls back to GITHUB_TOKEN if RELEASE_PLZ_TOKEN isn't set.
          # NOTE: tag pushes made with GITHUB_TOKEN do not fire other
          # workflows, so the cargo-dist release.yml will not trigger
          # automatically unless RELEASE_PLZ_TOKEN is a PAT (or GitHub
          # App token) with workflow-trigger rights.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Wait for current suite tag
        run: |
          set -euo pipefail

          version=$(
            awk '
              /^\[workspace.package\]/ { in_workspace_package = 1; next }
              /^\[/ { in_workspace_package = 0 }
              in_workspace_package && /^version = / {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )
          tag="v${version}"

          for attempt in $(seq 1 24); do
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
              exit 0
            fi
            echo "waiting for tag ${tag} (${attempt}/24)"
            sleep 5
          done

          echo "::error::suite tag ${tag} was not created within two minutes"
          exit 1

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Install Linux build dependencies
        # cargo metadata needs the same system deps as a normal build
        # because release-plz invokes cargo to inspect the workspace.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Install pinned release-plz
        uses: baptiste0928/cargo-install@v3.4.0
        with:
          crate: release-plz
          git: https://github.com/structured-world/release-plz
          commit: e8ca8da97dc8f472820a67eece651604887b1c7d

      - name: Run release-plz (open/update release PR)
        run: release-plz release-pr
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
