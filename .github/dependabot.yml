# Dependabot version-update config.
#
# Two ecosystems tracked: cargo (workspace Cargo.toml / Cargo.lock)
# and github-actions (workflow files in .github/workflows/). Minor
# and patch updates are grouped per ecosystem to keep PR volume
# low; major updates open per-dep PRs because they're more likely
# to need real review.
#
# The earlier `rust-toolchain` ecosystem entry was a no-op — that
# isn't a real Dependabot ecosystem. Rust toolchain pins in
# rust-toolchain.toml are bumped manually when we want a new
# stable channel.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Workspace Rust dependencies. The version pins in
  # [workspace.dependencies] in Cargo.toml and all transitive crates
  # in Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Workflow files in .github/workflows/. Catches Node version
  # deprecations (e.g. v20 → v24) and security updates to actions
  # we depend on.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
    # cargo-dist owns .github/workflows/release.yml and validates it byte-for-byte
    # with `dist generate --check`. A Dependabot *major* bump of these actions
    # there fails that check — they can't be applied without upgrading cargo-dist
    # itself (release.yml pins e.g. actions/checkout@v6, which 0.32.0 emits). So
    # ignore majors for the dist-managed actions; bump them via a cargo-dist
    # upgrade + `dist generate`. Minor/patch and all other actions still flow.
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/download-artifact"
        update-types: ["version-update:semver-major"]
